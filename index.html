<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice forwarder setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F5F4; --panel: #FFFFFF; --ink: #15232A; --muted: #55676E; --line: #D3DDDA; --line-strong: #A9BAB6;
  --send: #0B7A5E; --send-soft: #E1F2EB; --send-ink: #06553F;
  --review: #9A5B00; --review-soft: #FCEFD8; --review-ink: #6E4100;
  --exclude: #B3261E; --exclude-soft: #FBE6E4; --exclude-ink: #84190F;
  --ignore: #66767C; --ignore-soft: #ECF0EF;
  --focus: #1D63D8; --code-bg: #10201F; --code-ink: #D6E7E2;
  --radius: 6px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1617; --panel: #142123; --ink: #E3EDEB; --muted: #96AAAE; --line: #26393C; --line-strong: #3E5559;
    --send: #3FC196; --send-soft: #10342A; --send-ink: #8BE3C3;
    --review: #E6A646; --review-soft: #3A2A10; --review-ink: #F5CD8E;
    --exclude: #F08A80; --exclude-soft: #3D1B19; --exclude-ink: #F8B9B2;
    --ignore: #8FA1A5; --ignore-soft: #1C2B2D;
    --focus: #7AA7FF; --code-bg: #091112; --code-ink: #CFE2DD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1617; --panel: #142123; --ink: #E3EDEB; --muted: #96AAAE; --line: #26393C; --line-strong: #3E5559;
  --send: #3FC196; --send-soft: #10342A; --send-ink: #8BE3C3;
  --review: #E6A646; --review-soft: #3A2A10; --review-ink: #F5CD8E;
  --exclude: #F08A80; --exclude-soft: #3D1B19; --exclude-ink: #F8B9B2;
  --ignore: #8FA1A5; --ignore-soft: #1C2B2D;
  --focus: #7AA7FF; --code-bg: #091112; --code-ink: #CFE2DD;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--send-ink); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
p { margin: 0 0 12px; }
code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-size: 20px; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--review-soft); color: var(--review-ink); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 9px 16px; border-radius: var(--radius); border: 1.5px solid var(--line-strong);
  background: var(--panel); color: var(--ink); font-weight: 700; font-size: 15px;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--send); border-color: var(--send); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #062B21; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #062B21; } }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 11px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--send-ink); text-decoration: underline; cursor: pointer; font-weight: 700; }
.linkbtn.danger { color: var(--exclude-ink); }

/* Layout */
.shell { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 44px; }
.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); align-self: start; }
.steps ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps li { counter-increment: step; }
.steps a {
  display: flex; gap: 12px; align-items: baseline; padding: 9px 12px; border-left: 3px solid transparent;
  text-decoration: none; color: var(--muted); font-weight: 700; font-size: 16px;
}
.steps a::before { content: counter(step); font-variant-numeric: tabular-nums; min-width: 1.1em; color: var(--line-strong); }
.steps a:hover { color: var(--ink); }
.steps a[aria-current="page"] { color: var(--ink); border-left-color: var(--send); background: var(--panel); }
.steps a[aria-current="page"]::before { color: var(--send); }
.steps .badge { margin-left: auto; white-space: nowrap; align-self: center; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--review-soft); color: var(--review-ink); }
main { min-width: 0; max-width: 860px; }
section[data-view] { display: none; }
section[data-view].active { display: block; }
section h2 { font-size: 32px; margin-bottom: 10px; letter-spacing: -0.01em; }
.lead { color: var(--muted); font-size: 18px; max-width: 64ch; margin-bottom: 26px; }
.group { margin: 0 0 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.group > h3 { font-size: 20px; margin-bottom: 6px; }
.group > p { color: var(--muted); max-width: 68ch; }

/* Route strip: the three outcomes */
.route { display: grid; grid-template-columns: auto 1fr; gap: 0 18px; align-items: stretch; margin: 0 0 30px; }
.route-src { display: flex; align-items: center; font-weight: 700; padding: 10px 0; }
.route-lanes { display: grid; gap: 6px; }
.lane { display: flex; gap: 12px; align-items: baseline; padding: 8px 14px; border-left: 5px solid; background: var(--panel); }
.lane b { min-width: 9.5em; }
.lane span { color: var(--muted); font-size: 15px; }
.lane.send { border-color: var(--send); } .lane.send b { color: var(--send-ink); }
.lane.review { border-color: var(--review); } .lane.review b { color: var(--review-ink); }
.lane.exclude { border-color: var(--exclude); } .lane.exclude b { color: var(--exclude-ink); }

/* Fields */
label.f, .f { display: block; margin-bottom: 16px; }
.f > span, .f-label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 15px; }
.f small, .hint { display: block; color: var(--muted); font-size: 14px; margin-top: 5px; max-width: 68ch; }
input[type=text], input[type=email], input[type=number], input[type=tel], select, textarea {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--line-strong); border-radius: var(--radius);
  background: var(--panel); min-height: 44px;
}
textarea { resize: vertical; line-height: 1.45; }
input:hover, select:hover, textarea:hover { border-color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.check { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--send); }
.check b { display: block; }
.check small { color: var(--muted); font-size: 14px; }
.radio-set { display: grid; gap: 8px; margin-bottom: 16px; }
.radio-set label { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; }
.radio-set label:has(input:checked) { border-color: var(--send); }
.radio-set input { accent-color: var(--send); width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { border: 1.5px dashed var(--line-strong); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { border-style: solid; }
.state { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 6px; }
.state.ok { background: var(--send-soft); color: var(--send-ink); }
.state.todo { background: var(--review-soft); color: var(--review-ink); }

/* Stores */
.store { display: grid; grid-template-columns: 44px 1fr; gap: 0 14px; padding: 20px 0; border-top: 1px solid var(--line); }
.store:first-child { border-top: 0; padding-top: 0; }
.store-num { font-size: 26px; font-weight: 700; color: var(--line-strong); font-variant-numeric: tabular-nums; line-height: 1.2; }
.store-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.store-head h3 { font-size: 19px; }
.store-head .linkbtn { margin-left: auto; font-size: 14px; }
.faxprev { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all; }

/* Rules table */
.rules { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
.rules th, .rules td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.rules th { font-size: 14px; color: var(--muted); }
.rules td:first-child { font-weight: 700; }
.rules select { max-width: 260px; }

/* Address book */
.book { width: 100%; border-collapse: collapse; }
.book th { text-align: left; font-size: 14px; color: var(--muted); padding: 6px 6px; }
.book td { padding: 6px; vertical-align: top; border-top: 1px solid var(--line); }
.book td:last-child { width: 1%; white-space: nowrap; vertical-align: middle; }
.empty { padding: 18px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); margin-bottom: 14px; }

/* Labels preview */
.labels { list-style: none; padding: 0; margin: 0 0 10px; }
.labels li { display: grid; grid-template-columns: minmax(0, 15em) 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.labels code { font-weight: 500; word-break: break-word; }
.labels span { color: var(--muted); font-size: 15px; }
.who { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; background: var(--ignore-soft); color: var(--muted); }

/* Tester */
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tester { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.rxlabel { border: 2px solid var(--ignore); border-radius: var(--radius); background: var(--panel); overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); }
.rxlabel header { padding: 14px 18px; background: var(--ignore-soft); border-bottom: 2px solid var(--ignore); }
.rxlabel header small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.rxlabel header strong { display: block; font-size: 26px; line-height: 1.15; }
.rxlabel .body { padding: 14px 18px 18px; }
.rxlabel dl { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 8px 12px; }
.rxlabel dt { color: var(--muted); font-size: 14px; font-weight: 700; padding-top: 2px; }
.rxlabel dd { margin: 0; word-break: break-word; }
.rxlabel ul { margin: 0; padding-left: 18px; }
.rxlabel.send { border-color: var(--send); } .rxlabel.send header { background: var(--send-soft); border-color: var(--send); color: var(--send-ink); }
.rxlabel.review { border-color: var(--review); } .rxlabel.review header { background: var(--review-soft); border-color: var(--review); color: var(--review-ink); }
.rxlabel.exclude { border-color: var(--exclude); } .rxlabel.exclude header { background: var(--exclude-soft); border-color: var(--exclude); color: var(--exclude-ink); }

/* Install */
.readiness { list-style: none; padding: 0; margin: 0 0 20px; }
.readiness li { padding: 8px 12px 8px 14px; border-left: 4px solid var(--line-strong); margin-bottom: 6px; background: var(--panel); font-size: 15px; }
.readiness li.error { border-color: var(--exclude); }
.readiness li.warn { border-color: var(--review); }
.readiness li.info { border-color: var(--line-strong); color: var(--muted); }
.readiness li.ok { border-color: var(--send); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.codebox { width: 100%; height: 340px; background: var(--code-bg); color: var(--code-ink); border: 0; border-radius: var(--radius); padding: 14px; font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; white-space: pre; overflow: auto; }
.instructions h3 { font-size: 21px; margin: 30px 0 10px; }
.instructions h3:first-child { margin-top: 0; }
.instructions ol, .instructions ul { padding-left: 24px; max-width: 70ch; }
.instructions li { margin-bottom: 10px; }
.instructions .todo-item { color: var(--review-ink); font-weight: 700; }
.instructions .ok-item { color: var(--send-ink); font-weight: 700; }
.tbl-wrap { overflow-x: auto; margin-bottom: 16px; }
.tbl { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 14px; color: var(--muted); }
.st-ok { color: var(--send-ink); font-weight: 700; }
.st-old { color: var(--review-ink); font-weight: 700; }
.st-none { color: var(--muted); }
details.box { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 16px; background: var(--panel); margin-bottom: 14px; }
details.box summary { font-weight: 700; cursor: pointer; }
details.box[open] summary { margin-bottom: 12px; }

/* Banners and toast */
.banner { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 18px; border: 1.5px solid var(--review); background: var(--review-soft); color: var(--review-ink); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.banner.info { border-color: var(--line-strong); background: var(--panel); color: var(--ink); }
.banner p { margin: 0; flex: 1 1 320px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--panel); padding: 11px 18px; border-radius: var(--radius); font-weight: 700; font-size: 15px;
  display: none; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.toast.show { display: flex; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 700; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.modal { position: fixed; inset: 0; z-index: 30; background: rgba(8, 18, 20, .5); display: flex; align-items: flex-start; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 48px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); overflow: auto; }
.modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: 100%; max-width: 620px; padding: 24px; }
.modal-card h2 { font-size: 24px; margin-bottom: 14px; }
.changes { max-height: 230px; overflow: auto; margin: 0 0 8px; padding: 10px 14px 10px 30px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-size: 14px; }
.changes li { margin-bottom: 4px; }
.invalid { border-color: var(--exclude) !important; }
details.inline summary { cursor: pointer; color: var(--send-ink); font-weight: 700; font-size: 14px; }
details.inline ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; gap: 18px; padding-top: 0; }
  .steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 0px); z-index: 4; background: var(--bg); margin: 0 -24px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .steps ol { display: flex; gap: 2px; }
  .steps a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; padding: 8px 10px; font-size: 15px; }
  .steps a[aria-current="page"] { border-bottom-color: var(--send); background: transparent; }
  .tester { grid-template-columns: 1fr; }
  .rxlabel { position: static; }
  .top { position: static; }
}
@media (max-width: 620px) {
  body { font-size: 16px; }
  .row { grid-template-columns: 1fr; }
  section h2 { font-size: 26px; }
  .route { grid-template-columns: 1fr; }
  .lane { flex-direction: column; gap: 0; }
  .labels li { grid-template-columns: 1fr; gap: 2px; }
  .book thead { display: none; }
  .book tr { display: block; border-top: 1px solid var(--line); padding: 8px 0; }
  .book td { display: block; border: 0; padding: 4px 0; width: auto !important; }
  .store { grid-template-columns: 1fr; }
  .store-num { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="6" fill="var(--send)"/>
        <path d="M9 11h16M9 17h10M9 23h7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M21 20l4 3-4 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Invoice forwarder setup</h1>
        <p>Settings for the Gmail script that sends invoices to each store’s fax and Teams</p>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"><span>Loading saved settings…</span></div>
    <button class="btn primary" data-act="save" id="saveBtn">Save settings</button>
  </div>
</header>

<div class="shell">
  <nav class="steps" aria-label="Setup steps">
    <ol>
      <li><a href="#stores" data-nav="stores">Stores</a></li>
      <li><a href="#delivery" data-nav="delivery">Where invoices go</a></li>
      <li><a href="#detection" data-nav="detection">What counts as an invoice</a></li>
      <li><a href="#senders" data-nav="senders">Sender address book</a></li>
      <li><a href="#labels" data-nav="labels">Labels and schedule</a></li>
      <li><a href="#test" data-nav="test">Try an email</a></li>
      <li><a href="#install" data-nav="install">Get the script <span class="badge" id="navBadge" hidden></span></a></li>
    </ol>
  </nav>

  <main id="main">
    <div id="saveHelp"></div>
    <div id="banners"></div>
    <section data-view="stores" id="v-stores"></section>
    <section data-view="delivery" id="v-delivery"></section>
    <section data-view="detection" id="v-detection"></section>
    <section data-view="senders" id="v-senders"></section>
    <section data-view="labels" id="v-labels"></section>
    <section data-view="test" id="v-test"></section>
    <section data-view="install" id="v-install"></section>
  </main>
</div>

 <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="toolbar"><button class="btn primary" id="modalOk"></button><button class="btn" id="modalCancel">Cancel</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" hidden></button></div>

<script>
/* ============================================================
 * CORE LOGIC - decides what happens to an email.
 * The setup page uses this same code for its "Try an email" tester.
 * ============================================================ */
var IFCore = (function () {
  var IMAGE_EXT = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'tif', 'tiff', 'webp'];

  // Purchase-order number variations: PO#, P.O. No., PO Number, PO Num, Purchase Order, PO 123456
  var PO_PATTERNS = [
    { label: 'PO number', re: /(?:^|[^A-Za-z0-9])p\.?\s?o\.?\s*(?:#|no\.?(?![a-z])|num(?:ber)?\.?(?![a-z])|nbr\.?(?![a-z]))/i },
    { label: 'purchase order', re: /(?:^|[^A-Za-z0-9])purchase\s+order/i },
    { label: 'PO number', re: /(?:^|[^A-Za-z0-9])P\.?O\.?\s*[:#-]?\s*\d{4,}/ }
  ];

  function list_(v) {
    if (!v) return [];
    var arr = Array.isArray(v) ? v : String(v).split(/[\n,;]+/);
    return arr.map(function (s) { return String(s).trim(); }).filter(function (s) { return s.length > 0; });
  }

  function escRe_(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // Matches a phrase at the start of a word. Short phrases (3 letters or fewer) must be a whole word.
  function phraseRe_(phrase, wholeWord) {
    var p = String(phrase).trim();
    var body = escRe_(p).replace(/\s+/g, '\\s+');
    var whole = wholeWord || p.length <= 3;
    return new RegExp('(?:^|[^A-Za-z0-9])' + body + (whole ? '(?![A-Za-z0-9])' : ''), 'i');
  }

  function invoiceHits_(cfg, text) {
    var hits = [];
    if (!text) return hits;
    list_(cfg.keywords).forEach(function (k) {
      if (phraseRe_(k, false).test(text)) hits.push(k);
    });
    if (cfg.matchPoPatterns) {
      PO_PATTERNS.forEach(function (p) {
        if (hits.indexOf(p.label) < 0 && p.re.test(text)) hits.push(p.label);
      });
    }
    return hits;
  }

  function attachmentNames_(info) {
    return (info.attachments || []).map(function (a) { return a.name || ''; });
  }

  function keywordMatches_(cfg, info) {
    var names = attachmentNames_(info).join('\n').replace(/[_\-.]+/g, ' ');
    return {
      subject: invoiceHits_(cfg, info.subject || ''),
      attachment: invoiceHits_(cfg, names),
      body: invoiceHits_(cfg, info.body || ''),
      pdf: cfg.readPdfText && cfg.pdfWording ? invoiceHits_(cfg, info.pdfText || '') : []
    };
  }

  function exclusionMatch_(cfg, info) {
    var text = (info.subject || '') + (cfg.exclusionCheckBody ? '\n' + (info.body || '') : '');
    var phrases = list_(cfg.exclusionPhrases);
    for (var i = 0; i < phrases.length; i++) {
      if (phraseRe_(phrases[i], false).test(text)) return phrases[i];
    }
    return null;
  }

  function parseSender_(from) {
    var raw = String(from || '');
    var m = raw.match(/<([^>]+)>/);
    var email = (m ? m[1] : raw).trim().toLowerCase();
    var at = email.lastIndexOf('@');
    return { email: email, domain: at >= 0 ? email.slice(at + 1) : '' };
  }

  function validSender_(pattern) {
    var p = String(pattern || '').trim().toLowerCase().replace(/^@/, '');
    if (!p) return false;
    if (p.indexOf('@') >= 0) return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p);
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(p);
  }

  function senderMatches_(pattern, email, domain) {
    var p = String(pattern || '').trim().toLowerCase().replace(/^@/, '');
    if (!p) return false;
    if (p.indexOf('@') >= 0) return p === email;
    return domain === p || (domain.length > p.length && domain.slice(-(p.length + 1)) === '.' + p);
  }

  // Exact email entries win over domain entries; longer domains win over shorter ones.
  function findBookEntry_(cfg, email, domain) {
    var book = (cfg.addressBook || []).filter(function (e) { return e && e.sender; });
    var exact = book.filter(function (e) { return String(e.sender).indexOf('@') > 0 && senderMatches_(e.sender, email, domain); });
    if (exact.length) return exact[0];
    var doms = book.filter(function (e) { return String(e.sender).replace(/^@/, '').indexOf('@') < 0 && senderMatches_(e.sender, email, domain); });
    doms.sort(function (a, b) { return String(b.sender).length - String(a.sender).length; });
    return doms[0] || null;
  }

  function storeById_(cfg, id) {
    var s = (cfg.stores || []).filter(function (x) { return x.id === id; });
    return s[0] || null;
  }

  function storeName_(cfg, id) {
    var s = storeById_(cfg, id);
    return s ? (s.name || s.id) : id;
  }

  // Store keywords in the subject, message text or attachment names win over ones found only inside a PDF.
  function storeHits_(cfg, info) {
    var text = [info.subject || '', info.body || '', attachmentNames_(info).join(' ').replace(/[_\-.]+/g, ' ')].join('\n');
    var pdf = cfg.readPdfText ? String(info.pdfText || '') : '';
    var inText = [], inPdf = [];
    (cfg.stores || []).forEach(function (s) {
      var kws = list_(s.keywords);
      var textHit = null, pdfHit = null;
      for (var i = 0; i < kws.length; i++) {
        var re = phraseRe_(kws[i], true);
        if (!textHit && re.test(text)) textHit = kws[i];
        if (!pdfHit && pdf && re.test(pdf)) pdfHit = kws[i];
      }
      if (textHit) inText.push({ store: s, keyword: textHit, inPdf: false });
      else if (pdfHit) inPdf.push({ store: s, keyword: pdfHit, inPdf: true });
    });
    return inText.length ? inText : inPdf;
  }

  function route_(cfg, info, book, env) {
    env = env || {};
    if (book && book.store && book.store !== 'auto' && storeById_(cfg, book.store)) {
      return { kind: 'book', storeIds: [book.store], reason: 'The address book sends this sender to ' + storeName_(cfg, book.store) };
    }
    var hits = storeHits_(cfg, info);
    if (hits.length === 1) {
      return { kind: 'keyword', storeIds: [hits[0].store.id], reason: 'It mentions \u201c' + hits[0].keyword + '\u201d, a keyword for ' + (hits[0].store.name || hits[0].store.id) + (hits[0].inPdf ? ' (found inside the PDF)' : '') };
    }
    if (hits.length > 1) {
      var names = hits.map(function (h) { return h.store.name || h.store.id; }).join(', ');
      var ids = hits.map(function (h) { return h.store.id; });
      if (cfg.multiStoreMatch === 'all') return { kind: 'keyword', storeIds: ids, reason: 'It mentions several stores (' + names + '), so it goes to each' };
      return { kind: 'multi', storeIds: ids, problem: 'It mentions more than one store (' + names + ')' };
    }
    if (env.homeStoreId && storeById_(cfg, env.homeStoreId)) {
      return { kind: 'home', storeIds: [env.homeStoreId], reason: 'No store keyword found, so it goes to the store whose Gmail received it (' + storeName_(cfg, env.homeStoreId) + ')' };
    }
    if (cfg.fallbackStoreId && storeById_(cfg, cfg.fallbackStoreId)) {
      return { kind: 'fallback', storeIds: [cfg.fallbackStoreId], reason: 'No store keyword found, so it goes to the fallback store (' + storeName_(cfg, cfg.fallbackStoreId) + ')' };
    }
    return { kind: 'none', storeIds: [], problem: 'It isn\u2019t clear which store this is for' };
  }

  function ext_(name) {
    var m = /\.([A-Za-z0-9]+)$/.exec(name || '');
    return m ? m[1].toLowerCase() : '';
  }

  function forwardableFiles_(cfg, atts) {
    var types = list_(cfg.attachmentTypes).map(function (t) { return t.replace(/^\./, '').toLowerCase(); });
    var minImg = (Number(cfg.minImageKB) || 0) * 1024;
    return (atts || []).filter(function (a) {
      var e = ext_(a.name);
      if (types.indexOf(e) < 0) return false;
      if (IMAGE_EXT.indexOf(e) >= 0 && a.size != null && a.size < minImg) return false;
      return true;
    });
  }

  function faxConfigured_(cfg) {
    var t = String(cfg.faxAddressTemplate || '');
    return t.indexOf('{number}') >= 0 && t.indexOf('@') > 0 && !/replace|your-fax|example\./i.test(t);
  }

  function faxDigits_(number) {
    var d = String(number || '').replace(/\D/g, '');
    if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
    return d;
  }

  function faxAddress_(cfg, number) {
    var d = faxDigits_(number);
    return d ? String(cfg.faxAddressTemplate || '').replace('{number}', d) : '';
  }

  function faxDomain_(cfg) {
    if (!faxConfigured_(cfg)) return '';
    var t = String(cfg.faxAddressTemplate);
    return t.slice(t.lastIndexOf('@') + 1).toLowerCase();
  }

  // opts.includePending = also list fax addresses that can't be used yet (for display only)
  function destinationsFor_(cfg, store, opts) {
    var out = [];
    if (!store) return out;
    var mode = cfg.deliveryMode || 'both';
    if (mode !== 'teams' && faxDigits_(store.faxNumber)) {
      if (faxConfigured_(cfg)) out.push({ kind: 'fax', address: faxAddress_(cfg, store.faxNumber) });
      else if (opts && opts.includePending) out.push({ kind: 'fax-pending', address: faxAddress_(cfg, store.faxNumber) });
    }
    if (mode !== 'fax') {
      var t = String(store.teamsAddress || '').trim() || String(cfg.defaultTeamsAddress || '').trim();
      if (t) out.push({ kind: 'teams', address: t });
    }
    return out;
  }

  // Works out stores, files and destinations. forcedStoreId is used when staff pick a store by label.
  function plan_(cfg, info, env, forcedStoreId) {
    var s = parseSender_(info.from);
    var book = findBookEntry_(cfg, s.email, s.domain);
    var r = forcedStoreId ? { kind: 'staff', storeIds: [forcedStoreId], reason: 'Staff chose ' + storeName_(cfg, forcedStoreId) } : route_(cfg, info, book, env);
    var files = forwardableFiles_(cfg, info.attachments);
    var plan = {
      storeIds: r.storeIds,
      routeKind: r.kind || '',
      routeReason: r.reason || '',
      problem: r.problem || '',
      files: files,
      bodyAsPdf: !!cfg.bodyToPdf && (files.length === 0 || !!cfg.alwaysIncludeBody)
    };
    if (!plan.problem) {
      var noDest = plan.storeIds.filter(function (id) { return destinationsFor_(cfg, storeById_(cfg, id)).length === 0; });
      if (noDest.length) {
        plan.problem = 'There\u2019s no working fax or Teams address for ' + noDest.map(function (id) { return storeName_(cfg, id); }).join(', ') +
          (faxConfigured_(cfg) ? '' : ' yet (the fax provider address is still a placeholder)');
      }
    }
    if (!plan.problem && files.length === 0 && !plan.bodyAsPdf) {
      plan.problem = 'There\u2019s nothing to send: no attachment, and \u201cturn the message text into a PDF\u201d is off';
    }
    return plan;
  }

  function where_(kw) {
    var parts = [];
    if (kw.subject.length) parts.push('the subject (' + kw.subject.join(', ') + ')');
    if (kw.attachment.length) parts.push('an attachment name (' + kw.attachment.join(', ') + ')');
    if (kw.body.length) parts.push('the message text (' + kw.body.join(', ') + ')');
    if (kw.pdf && kw.pdf.length) parts.push('the text inside a PDF (' + kw.pdf.join(', ') + ')');
    if (parts.length <= 1) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
  }

  /**
   * The main decision. Returns:
   *   action: 'send' | 'review' | 'exclude' | 'ignore'
   *   reasons: plain-language list of why
   *   storeIds, files, bodyAsPdf: what would be sent where
   * env: { trusted: [emails], blocked: [emails], homeStoreId: 's1', inSpam: bool }
   */
  function decide_(cfg, info, env) {
    env = env || {};
    var s = parseSender_(info.from);
    var kw = keywordMatches_(cfg, info);
    var any = kw.subject.length + kw.attachment.length + kw.body.length + kw.pdf.length > 0;
    var book = findBookEntry_(cfg, s.email, s.domain);
    var vendor = book && book.vendor ? ' (' + book.vendor + ')' : '';
    var blocked = (env.blocked || []).indexOf(s.email) >= 0;
    var trusted = (env.trusted || []).indexOf(s.email) >= 0;
    var res = { action: 'ignore', reasons: [], keywordHits: kw, sender: s.email, bookEntry: book, storeIds: [], files: [], bodyAsPdf: false, routeReason: '', routeKind: '', locked: false };

    if (blocked || (book && book.action === 'exclude')) {
      res.action = any ? 'exclude' : 'ignore';
      res.locked = true;
      res.reasons.push(blocked ? 'Staff blocked this sender with the Block Sender label' : 'This sender is set to \u201cnever forward\u201d in the address book' + vendor);
      return res;
    }

    if (book && book.action === 'forward') {
      res.action = 'send';
      res.reasons.push('This sender is in the address book' + vendor + ' as \u201calways forward\u201d');
    } else if (trusted) {
      res.action = 'send';
      res.reasons.push('Staff trusted this sender with the Trust Sender label');
    } else if (book && book.action === 'review') {
      res.action = 'review';
      res.reasons.push('The address book says to always check this sender' + vendor);
    } else {
      var ex = exclusionMatch_(cfg, info);
      if (ex) {
        res.action = any ? 'exclude' : 'ignore';
        res.locked = true;
        res.reasons.push('It contains the exclusion phrase \u201c' + ex + '\u201d');
        return res;
      }
      var rules = cfg.rules || {};
      if (any) {
        var auto = (kw.subject.length && rules.subject === 'send') ||
                   (kw.attachment.length && rules.attachment === 'send') ||
                   (kw.body.length && rules.body === 'send') ||
                   (kw.pdf.length && rules.pdf === 'send');
        res.action = auto ? 'send' : 'review';
        res.reasons.push('Invoice wording found in ' + where_(kw));
        if (!auto) res.reasons.push('Wording found only there is set to be held for review');
      } else if (cfg.reviewUnknownAttachments && !book && forwardableFiles_(cfg, info.attachments).length) {
        res.action = 'review';
        res.reasons.push('It has an attachment from a sender who isn\u2019t in the address book');
      } else {
        return res;
      }
    }

    var plan = plan_(cfg, info, env, null);
    res.storeIds = plan.storeIds;
    res.routeReason = plan.routeReason;
    res.routeKind = plan.routeKind;
    res.files = plan.files;
    res.bodyAsPdf = plan.bodyAsPdf;
    if (plan.problem) {
      if (res.action === 'send') res.action = 'review';
      res.reasons.push(plan.problem);
    }
    if (env.inSpam && res.action === 'send') {
      res.action = 'review';
      res.reasons.push('It was in the Spam folder');
    }
    return res;
  }

  function hasPdf_(info) {
    return (info.attachments || []).some(function (a) { return ext_(a.name) === 'pdf'; });
  }

  // True when reading the text inside the PDF could change the decision:
  // to find the store when nothing else named it, or to find invoice wording.
  function needsPdfText_(cfg, info, d) {
    if (!cfg.readPdfText || info.pdfText != null || !hasPdf_(info) || d.locked) return false;
    if (d.action === 'ignore') return !!cfg.pdfWording;
    if (d.action === 'exclude') return false;
    return ['home', 'fallback', 'none', 'multi'].indexOf(d.routeKind) >= 0;
  }

  function configWarnings_(cfg) {
    var w = [];
    var stores = cfg.stores || [];
    var mode = cfg.deliveryMode || 'both';

      w.push({ level: 'warn', text: 'The fax provider email format is still a placeholder, so nothing will be faxed yet.' +
        (mode === 'both' ? ' Invoices will still go to Teams.' : ' Invoices will be held for review instead.') });
    }
    if (!stores.length) w.push({ level: 'error', text: 'Add at least one store.' });
    var seen = {};
    var noKeywords = 0, noGmail = 0;
    stores.forEach(function (st, i) {
      var n = st.name || ('Store ' + (i + 1));
      var issues = [], level = 'warn';
      var g = String(st.gmail || '').trim().toLowerCase();
      if (!g) { issues.push('no Gmail address'); noGmail++; }
      else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g)) { issues.push('\u201c' + st.gmail + '\u201d isn\u2019t a valid email address'); level = 'error'; }
      else if (seen[g]) { issues.push('same Gmail address as ' + seen[g]); level = 'error'; }
      else seen[g] = n;
      var d = faxDigits_(st.faxNumber);

        if (!d) issues.push('no fax number');
        else if (d.length !== 10) issues.push('fax number has ' + d.length + ' digits instead of 10');
      }
      if (mode !== 'fax' && !String(st.teamsAddress || cfg.defaultTeamsAddress || '').trim()) issues.push('no Teams channel address (and no default channel)');
      if (stores.length > 1 && !list_(st.keywords).length) noKeywords++;
      if (issues.length) w.push({ level: level, text: n + ': ' + issues.join(', ') + '.' });
    });
    if (noGmail) w.push({ level: 'info', text: 'Without a Gmail address, the script can\u2019t tell it\u2019s running in that store\u2019s account, so invoices without a store keyword are held for review there.' });
    if (noKeywords) w.push({ level: 'info', text: noKeywords + ' store' + (noKeywords > 1 ? 's have' : ' has') + ' no store keywords. That\u2019s fine if invoices always arrive in the right store\u2019s Gmail; keywords help when they don\u2019t.' });
    if (!list_(cfg.reviewRecipients).length) {
      w.push({ level: 'info', text: 'No one is set to get review notices, so each store\u2019s Gmail will email itself.' });
    }
    if (!list_(cfg.keywords).length && !cfg.matchPoPatterns && !(cfg.addressBook || []).length) {
      w.push({ level: 'error', text: 'There are no keywords and no address book senders, so nothing will be detected.' });
    }
    var hist = String(cfg.historyDocUrl || '').trim();
    if (!hist) w.push({ level: 'info', text: 'No change history document is linked, so installs aren\u2019t recorded in Google Sheets or Docs. The history of saved settings is still kept on this page.' });
    else if (!/docs\.google\.com\/(spreadsheets|document)\/d\//.test(hist)) w.push({ level: 'error', text: 'The change history link isn\u2019t a Google Sheet or Google Doc link.' });
    (cfg.addressBook || []).forEach(function (e, i) {
      if (!validSender_(e.sender)) w.push({ level: 'error', text: 'Address book row ' + (i + 1) + ': \u201c' + (e.sender || '') + '\u201d isn\u2019t an email address or domain.' });
    });
    return w;
  }

  return {
    list_: list_, parseSender_: parseSender_, validSender_: validSender_, keywordMatches_: keywordMatches_,
    findBookEntry_: findBookEntry_, storeById_: storeById_, storeName_: storeName_, route_: route_, plan_: plan_,
    decide_: decide_, needsPdfText_: needsPdfText_, hasPdf_: hasPdf_, forwardableFiles_: forwardableFiles_, faxConfigured_: faxConfigured_, faxAddress_: faxAddress_,
    faxDomain_: faxDomain_, faxDigits_: faxDigits_, destinationsFor_: destinationsFor_, configWarnings_: configWarnings_
  };
})();

em) {\n      var noDest = plan.storeIds.filter(function (id) { return destinationsFor_(cfg, storeById_(cfg, id)).length === 0; });\n      if (noDest.length) {\n        plan.problem = 'There\\u2019s no working fax or Teams address for ' + noDest.map(function (id) { return storeName_(cfg, id); }).join(', ') +\n          (faxConfigured_(cfg) ? '' : ' yet (the fax provider address is still a placeholder)');\n      }\n    }\n    if (!plan.problem && files.length === 0 && !plan.bodyAsPdf) {\n      plan.problem = 'There\\u2019s nothing to send: no attachment, and \\u201cturn the message text into a PDF\\u201d is off';\n    }\n    return plan;\n  }\n\n  function where_(kw) {\n    var parts = [];\n    if (kw.subject.length) parts.push('the subject (' + kw.subject.join(', ') + ')');\n    if (kw.attachment.length) parts.push('an attachment name (' + kw.attachment.join(', ') + ')');\n    if (kw.body.length) parts.push('the message text (' + kw.body.join(', ') + ')');\n    if (kw.pdf && kw.pdf.length) parts.push('the text inside a PDF (' + kw.pdf.join(', ') + ')');\n    if (parts.length <= 1) return parts.join('');\n    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];\n  }\n\n  /**\n   * The main decision. Returns:\n   *   action: 'send' | 'review' | 'exclude' | 'ignore'\n   *   reasons: plain-language list of why\n   *   storeIds, files, bodyAsPdf: what would be sent where\n   * env: { trusted: [emails], blocked: [emails], homeStoreId: 's1', inSpam: bool }\n   */\n  function decide_(cfg, info, env) {\n    env = env || {};\n    var s = parseSender_(info.from);\n    var kw = keywordMatches_(cfg, info);\n    var any = kw.subject.length + kw.attachment.length + kw.body.length + kw.pdf.length > 0;\n    var book = findBookEntry_(cfg, s.email, s.domain);\n    var vendor = book && book.vendor ? ' (' + book.vendor + ')' : '';\n    var blocked = (env.blocked || []).indexOf(s.email) >= 0;\n    var trusted = (env.trusted || []).indexOf(s.email) >= 0;\n    var res = var GAS_SRC = "/* ============================================================\n * GMAIL PART - reads mail, sends faxes / Teams posts, applies labels.\n * ============================================================ */\nvar P_LAST = 'LAST_RUN_MS';\nvar P_HANDLED = 'HANDLED_IDS';\nvar P_TRUST = 'LEARNED_TRUSTED';\nvar P_BLOCK = 'LEARNED_BLOCKED';\nvar P_SHEET = 'LOG_SHEET_ID';\nvar P_FATAL = 'LAST_FATAL_NOTICE';\n\n/* ---------- Functions you can run from the editor ---------- */\n\n/** Run once after pasting a new version. Creates labels, the timer and the log sheet. Safe to run again. */\nfunction setup() {\n  var names = labelNames_();\n  var labelProblems = [];\n  var wanted = [names.review, names.send, names.notInvoice, names.block, names.trust, names.sent, names.dismissed, names.excluded, names.error];\n  (CONFIG.stores || []).forEach(function (s) { wanted.push(storeLabelName_(s)); });\n  wanted.forEach(function (n) {\n    try { getOrCreateLabel_(n); } catch (e) { labelProblems.push((e && e.message) || String(e)); }\n  });\n  labelProblems.forEach(function (m) { console.warn('LABEL PROBLEM: ' + m); });\n\n  deleteTimers_();\n  var allowed = [1, 5, 10, 15, 30];\n  var mins = allowed.indexOf(Number(CONFIG.runEveryMinutes)) >= 0 ? Number(CONFIG.runEveryMinutes) : 10;\n  ScriptApp.newTrigger('runForwarder').timeBased().everyMinutes(mins).create();\n\n  var p = PropertiesService.getScriptProperties();\n  if (!p.getProperty(P_LAST)) {\n    p.setProperty(P_LAST, String(Date.now() - (Number(CONFIG.firstRunLookbackHours) || 0) * 3600000));\n  }\n  if (CONFIG.logToSheet) {\n    var sheet = getLogSheet_();\n    console.log('Log sheet: ' + sheet.getParent().getUrl());\n  }\n  console.log('Timer set: runForwarder will run every ' + mins + ' minutes.');\n  checkSetup();\n  logChangeHistory_('Installed or updated');\n}\n\n/** Prints which store this Gmail account is, and anything that still needs attention. */\nfunction checkSetup() {\n  var account = currentAccount_();\n  var home = homeStore_(account);\n  console.log('Settings version ' + CONFIG.rev + ' (saved ' + CONFIG.savedAt + (CONFIG.savedByName ? ' by ' + CONFIG.savedByName : '') + ')');\n  console.log('This Gmail account: ' + account);\n  console.log(home ? 'Detected store: ' + home.name : 'WARNING: this account is not listed as any store\\'s Gmail on the setup page. Invoices with no store keyword will be held for review.');\n  if (home) {\n    var dests = IFCore.destinationsFor_(CONFIG, home, { includePending: true });\n    dests.forEach(function (d) {\n      console.log('  ' + (d.kind === 'fax-pending' ? 'fax (waiting for fax provider address)' : d.kind) + ': ' + d.address);\n    });\n  }\n  if (CONFIG.readPdfText) {\n    console.log(driveAvailable_() ? 'Reading inside PDFs: on (Drive service found).' :\n      'WARNING: reading inside PDFs is on in the settings, but the Drive service is not added to this project. In the left sidebar, click + next to Services, choose Drive API, click Add, then run setup again.');\n  }\n  IFCore.configWarnings_(CONFIG).forEach(function (w) { console.log(w.level.toUpperCase() + ': ' + w.text); });\n}\n\n/** Shows what WOULD happen to recent emails. Sends nothing and changes no labels. */\nfunction dryRun() { run_(true); }\n\n/** The main job. The timer runs this automatically. */\nfunction runForwarder() { run_(false); }\n\n/** Sends a one-page test to this store's fax and/or Teams channel. */\nfunction sendTestToMyStore() {\n  var account = currentAccount_();\n  var home = homeStore_(account);\n  if (!home) throw new Error('This Gmail account (' + account + ') is not listed as any store\\'s Gmail on the setup page.');\n  var dests = IFCore.destinationsFor_(CONFIG, home);\n  if (!dests.length) throw new Error('No working fax or Teams address for ' + home.name + ' yet.');\n  var html = '<html><body style=\"font-family:Arial,sans-serif\"><h1>Invoice Forwarder test page<\/h1>' +\n    '<p>Store: ' + esc_(home.name) + '<\/p><p>Sent from: ' + esc_(account) + '<\/p><p>Time: ' + esc_(String(new Date())) + '<\/p><\/body><\/html>';\n  var pdf = Utilities.newBlob(html, MimeType.HTML, 'test.html').getAs(MimeType.PDF).setName('Invoice-Forwarder-test.pdf');\n  dests.forEach(function (d) {\n    GmailApp.sendEmail(d.address, CONFIG.systemTag + ' Test page for ' + home.name, d.kind === 'fax' ? (CONFIG.faxBodyText || '') : 'Test post from the Invoice Forwarder.', {\n      attachments: [pdf], name: CONFIG.senderName || 'Invoice Forwarder'\n    });\n    console.log('Sent test to ' + d.kind + ': ' + d.address);\n  });\n}\n\n/** Lists senders that staff trusted or blocked with labels, so you can add them to the setup page address book. */\nfunction showLearnedLists() {\n  var st = loadState_();\n  console.log('Trusted senders (always forward): ' + (st.trusted.length ? st.trusted.join(', ') : 'none'));\n  console.log('Blocked senders (never forward): ' + (st.blocked.length ? st.blocked.join(', ') : 'none'));\n}\n\n/** Clears the trusted/blocked lists learned from labels (run after copying them into the setup page). */\nfunction resetLearnedLists() {\n  var p = PropertiesService.getScriptProperties();\n  p.deleteProperty(P_TRUST);\n  p.deleteProperty(P_BLOCK);\n  console.log('Learned trusted and blocked senders were cleared.');\n}\n\n/** Stops automatic runs. Run setup() to start them again. */\nfunction removeTimer() {\n  deleteTimers_();\n  console.log('Automatic runs stopped. Run setup to start them again.');\n  logChangeHistory_('Turned off');\n}\n\nfunction deleteTimers_() {\n  ScriptApp.getProjectTriggers().forEach(function (t) {\n    if (t.getHandlerFunction() === 'runForwarder') ScriptApp.deleteTrigger(t);\n  });\n}\n\n/* ---------- Main run ---------- */\n\nfunction run_(isDryRun) {\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(5000)) { console.log('Another run is still working, so this one was skipped.'); return; }\n  var ctx = null;\n  try {\n    ctx = newContext_(isDryRun);\n    if (!ctx.dryRun) processStaffLabels_(ctx);\n    scanNewMail_(ctx);\n    finish_(ctx);\n  } catch (e) {\n    console.error((e && e.stack) || e);\n    if (ctx && !ctx.dryRun) notifyFatal_(ctx, e);\n    throw e;\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction newContext_(isDryRun) {\n  var account = currentAccount_();\n  return {\n    dryRun: isDryRun, started: Date.now(), state: loadState_(), account: account, home: homeStore_(account),\n    labels: {}, review: [], sent: [], errors: [], excluded: [], staff: [], logRows: [], report: [], notes: [],\n    scanned: 0, stoppedEarly: false\n  };\n}\n\nfunction env_(ctx, inSpam) {\n  return { trusted: ctx.state.trusted, blocked: ctx.state.blocked, homeStoreId: ctx.home ? ctx.home.id : '', inSpam: !!inSpam };\n}\n\nfunction timeLeft_(ctx) { return (Date.now() - ctx.started) < (Number(CONFIG.maxRunSeconds) || 270) * 1000; }\n\nfunction scanNewMail_(ctx) {\n  var p = ctx.state.props;\n  var now = Date.now();\n  var last = Number(p.getProperty(P_LAST)) || 0;\n  var since;\n  if (ctx.dryRun) since = now - (Number(CONFIG.dryRunHours) || 72) * 3600000;\n  else if (!last) since = now - (Number(CONFIG.firstRunLookbackHours) || 0) * 3600000 - 15 * 60000;\n  else since = last - 15 * 60000; // small overlap so nothing slips between runs\n\n  var base = 'after:' + Math.floor(since / 1000) + ' -in:sent -in:drafts -in:chats -from:me';\n  var passes = [{ q: base, spam: false }];\n  if (CONFIG.checkSpam) passes.push({ q: base + ' in:spam', spam: true });\n\n  for (var pi = 0; pi < passes.length && !ctx.stoppedEarly; pi++) {\n    var start = 0, pageSize = 50;\n    while (!ctx.stoppedEarly) {\n      var threads = GmailApp.search(passes[pi].q, start, pageSize);\n      if (!threads.length) break;\n      for (var i = 0; i < threads.length && !ctx.stoppedEarly; i++) {\n        var th = threads[i];\n        var msgs = th.getMessages();\n        for (var j = 0; j < msgs.length; j++) {\n          var m = msgs[j];\n          if (m.getDate().getTime() <= since) continue;\n          if (m.isInTrash() || m.isDraft()) continue;\n          if (ctx.state.handled[m.getId()]) continue;\n          if (!timeLeft_(ctx)) { ctx.stoppedEarly = true; break; }\n          handleNew_(ctx, m, th, passes[pi].spam);\n          ctx.scanned++;\n        }\n      }\n      if (threads.length < pageSize) break;\n      start += pageSize;\n      if (start >= 500) { ctx.stoppedEarly = true; break; }\n    }\n  }\n  if (!ctx.dryRun && !ctx.stoppedEarly) p.setProperty(P_LAST, String(now));\n  if (ctx.stoppedEarly) ctx.notes.push('This run ran out of time before checking every new email. The next run continues where it left off.');\n}\n\nfunction handleNew_(ctx, msg, thread, inSpam) {\n  var info = extractInfo_(msg);\n  if (isSystemMessage_(info)) return;\n  var d = IFCore.decide_(CONFIG, info, env_(ctx, inSpam));\n  if (!inSpam && IFCore.needsPdfText_(CONFIG, info, d)) {\n    info.pdfText = readPdfText_(ctx, info);\n    if (info.pdfText) d = IFCore.decide_(CONFIG, info, env_(ctx, inSpam));\n  }\n  if (inSpam && d.action === 'exclude') d.action = 'ignore';\n  if (d.action === 'ignore') return;\n\n  if (ctx.dryRun) { ctx.report.push({ info: info, d: d }); return; }\n\n  ctx.state.handled[info.id] = Math.floor(Date.now() / 1000);\n  if (d.action === 'exclude') {\n    thread.addLabel(label_(ctx, 'excluded'));\n    ctx.excluded.push(info);\n    log_(ctx, info, 'Excluded', d, '', thread);\n  } else if (d.action === 'review') {\n    thread.addLabel(label_(ctx, 'review'));\n    ctx.review.push({ info: info, d: d, link: thread.getPermalink() });\n    log_(ctx, info, 'Needs review', d, '', thread);\n  } else {\n    deliverAndLabel_(ctx, msg, info, d, thread);\n  }\n}\n\n/* ---------- Staff decisions made with labels ---------- */\n\nfunction processStaffLabels_(ctx) {\n  var n = labelNames_();\n  var jobs = [\n    { name: n.send, kind: 'send' }, { name: n.trust, kind: 'trust' },\n    { name: n.notInvoice, kind: 'dismiss' }, { name: n.block, kind: 'block' }\n  ];\n  (CONFIG.stores || []).forEach(function (s) { jobs.push({ name: storeLabelName_(s), kind: 'sendTo', storeId: s.id }); });\n\n  jobs.forEach(function (job) {\n    var label = findLabel_(job.name);\n    if (!label) return;\n    label.getThreads(0, 25).forEach(function (th) {\n      if (!timeLeft_(ctx)) { ctx.stoppedEarly = true; return; }\n      var msg = pickMessage_(ctx, th);\n      th.removeLabel(label);\n      removeIfPresent_(th, n.review);\n      removeIfPresent_(th, n.error);\n      if (!msg) return;\n      var info = extractInfo_(msg);\n      var sender = IFCore.parseSender_(info.from).email;\n      ctx.state.handled[info.id] = Math.floor(Date.now() / 1000);\n\n      if (job.kind === 'dismiss' || job.kind === 'block') {\n        if (job.kind === 'block' && sender) {\n          addUnique_(ctx.state.blocked, sender);\n          removeItem_(ctx.state.trusted, sender);\n        }\n        th.addLabel(label_(ctx, 'dismissed'));\n        ctx.staff.push((job.kind === 'block' ? 'Blocked sender ' + sender + ': ' : 'Marked not an invoice: ') + info.subject);\n        log_(ctx, info, job.kind === 'block' ? 'Dismissed + blocked sender' : 'Dismissed by staff', null, '', th);\n        return;\n      }\n      if (job.kind === 'trust' && sender) {\n        addUnique_(ctx.state.trusted, sender);\n        removeItem_(ctx.state.blocked, sender);\n      }\n      var plan = IFCore.plan_(CONFIG, info, env_(ctx), job.kind === 'sendTo' ? job.storeId : null);\n      if (IFCore.needsPdfText_(CONFIG, info, { action: 'send', routeKind: plan.routeKind })) {\n        info.pdfText = readPdfText_(ctx, info);\n        if (info.pdfText) plan = IFCore.plan_(CONFIG, info, env_(ctx), null);\n      }\n      if (plan.problem) {\n        th.addLabel(label_(ctx, 'error'));\n        var msgText = plan.problem + '. To pick the store yourself, apply the label \"' + n.sendTo + '/<store name>\".';\n        ctx.errors.push({ info: info, error: msgText, link: th.getPermalink() });\n        log_(ctx, info, 'Error', { reasons: [msgText], storeIds: plan.storeIds }, '', th);\n        return;\n      }\n      plan.action = 'send';\n      plan.reasons = ['Staff applied the label \"' + job.name + '\"'];\n      deliverAndLabel_(ctx, msg, info, plan, th);\n      ctx.staff.push('Sent after staff review: ' + info.subject);\n    });\n  });\n}\n\n// Newest message in the thread that wasn't sent by this account.\nfunction pickMessage_(ctx, thread) {\n  var msgs = thread.getMessages();\n  for (var i = msgs.length - 1; i >= 0; i--) {\n    if (IFCore.parseSender_(msgs[i].getFrom()).email !== ctx.account) return msgs[i];\n  }\n  return msgs.length ? msgs[msgs.length - 1] : null;\n}\n\n/* ---------- Sending ---------- */\n\nfunction deliverAndLabel_(ctx, msg, info, d, thread) {\n  try {\n    var sentTo = deliver_(ctx, msg, info, d, thread);\n    thread.addLabel(label_(ctx, 'sent'));\n    ctx.sent.push({ info: info, to: sentTo });\n    log_(ctx, info, 'Sent', d, sentTo.join('; '), thread);\n  } catch (e) {\n    thread.addLabel(label_(ctx, 'error'));\n    ctx.errors.push({ info: info, error: String((e && e.message) || e), link: thread.getPermalink() });\n    log_(ctx, info, 'Error', d, String((e && e.message) || e), thread);\n  }\n}\n\nfunction deliver_(ctx, msg, info, d, thread) {\n  var blobs = [];\n  if (d.bodyAsPdf) blobs.push(bodyToPdf_(msg, info));\n  (d.files || []).forEach(function (f) { blobs.push(f.blob.copyBlob().setName(f.name)); });\n  if (!blobs.length) throw new Error('Nothing to send.');\n  var total = 0;\n  blobs.forEach(function (b) { total += b.getBytes().length; });\n  if (total > 20 * 1024 * 1024) throw new Error('The attachments are over 20 MB, which is too large to send by email.');\n\n  var sentTo = [], failures = [];\n  var opts = { attachments: blobs, name: CONFIG.senderName || 'Invoice Forwarder' };\n  (d.storeIds || []).forEach(function (id) {\n    var store = IFCore.storeById_(CONFIG, id);\n    IFCore.destinationsFor_(CONFIG, store).forEach(function (dest) {\n      try {\n        if (dest.kind === 'fax') {\n          GmailApp.sendEmail(dest.address, subjectFor_(store, info), CONFIG.faxBodyText || '', opts);\n        } else {\n          GmailApp.sendEmail(dest.address, subjectFor_(store, info), detailsText_(ctx, store, info, d, thread), opts);\n        }\n        sentTo.push(store.name + ' ' + dest.kind);\n      } catch (e) {\n        failures.push(store.name + ' ' + dest.kind + ' (' + ((e && e.message) || e) + ')');\n      }\n    });\n    if (CONFIG.deliveryMode !== 'teams' && !IFCore.faxConfigured_(CONFIG)) {\n      addUnique_(ctx.notes, 'Faxes were skipped because the fax provider email address is still a placeholder on the setup page.');\n    }\n  });\n  if (CONFIG.auditCopyAddress) {\n    try {\n      GmailApp.sendEmail(CONFIG.auditCopyAddress, subjectFor_(IFCore.storeById_(CONFIG, d.storeIds[0]), info),\n        detailsText_(ctx, null, info, d, thread), opts);\n    } catch (e) { failures.push('audit copy (' + ((e && e.message) || e) + ')'); }\n  }\n  if (failures.length) throw new Error('Sent to: ' + (sentTo.join(', ') || 'nothing') + '. Failed: ' + failures.join(', '));\n  if (!sentTo.length) throw new Error('No working destination for this store.');\n  return sentTo;\n}\n\nfunction subjectFor_(store, info) {\n  var s = (CONFIG.systemTag || '[Invoice Forwarder]') + ' ' + (store ? store.name + ': ' : '') + (info.subject || '(no subject)');\n  return s.length > 180 ? s.slice(0, 177) + '...' : s;\n}\n\nfunction detailsText_(ctx, store, info, d, thread) {\n  var lines = [];\n  if (store) lines.push('Store: ' + store.name);\n  lines.push('From: ' + info.from);\n  lines.push('Received: ' + info.date);\n  lines.push('Subject: ' + info.subject);\n  lines.push('Why: ' + (d.reasons || []).concat(d.routeReason ? [d.routeReason] : []).join('; '));\n  lines.push('Received in: ' + ctx.account);\n  try { lines.push('Open in Gmail (signed in as ' + ctx.account + '): ' + thread.getPermalink()); } catch (e) {}\n  lines.push('----------');\n  lines.push(String(info.body || '').slice(0, 3000));\n  return lines.join('\\n');\n}\n\nfunction bodyToPdf_(msg, info) {\n  var html = '';\n  try { html = msg.getBody() || ''; } catch (e) {}\n  if (!html) html = '<pre style=\"white-space:pre-wrap;font-family:Arial,sans-serif\">' + esc_(info.body) + '<\/pre>';\n  var header = '<div style=\"font-family:Arial,sans-serif;font-size:10pt;border-bottom:1px solid #999;margin-bottom:12px;padding-bottom:8px\">' +\n    '<b>From:<\/b> ' + esc_(info.from) + '<br><b>Received:<\/b> ' + esc_(String(info.date)) + '<br><b>Subject:<\/b> ' + esc_(info.subject) + '<\/div>';\n  var doc = '<html><head><meta charset=\"utf-8\"><\/head><body>' + header + html + '<\/body><\/html>';\n  var name = String(info.subject || 'email').replace(/[^A-Za-z0-9 _-]+/g, '').trim().slice(0, 60) || 'email';\n  return Utilities.newBlob(doc, MimeType.HTML, 'email.html').getAs(MimeType.PDF).setName(name + '.pdf');\n}\n\n/* ---------- Review notices, log and state ---------- */\n\nfunction finish_(ctx) {\n  if (ctx.dryRun) { printDryRun_(ctx); return; }\n  saveState_(ctx.state);\n  writeLog_(ctx);\n  sendSummary_(ctx);\n  console.log('Checked ' + ctx.scanned + ' new emails. Sent: ' + ctx.sent.length + '. Needs review: ' + ctx.review.length +\n    '. Excluded: ' + ctx.excluded.length + '. Staff decisions: ' + ctx.staff.length + '. Errors: ' + ctx.errors.length + '.');\n  ctx.notes.forEach(function (n) { console.log('NOTE: ' + n); });\n}\n\nfunction printDryRun_(ctx) {\n  var hours = Number(CONFIG.dryRunHours) || 72;\n  console.log('DRY RUN for ' + ctx.account + (ctx.home ? ' (' + ctx.home.name + ')' : ' (not listed as a store)') +\n    ': last ' + hours + ' hours. Nothing was sent and no labels were changed.');\n  if (!ctx.report.length) console.log('No emails matched. If you expected some, check keywords or add the sender to the address book.');\n  ctx.report.forEach(function (r) {\n    var stores = r.d.storeIds.map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(', ') || '-';\n    var verb = { send: 'WOULD SEND', review: 'WOULD HOLD FOR REVIEW', exclude: 'WOULD EXCLUDE' }[r.d.action] || r.d.action;\n    console.log(verb + ' | to: ' + stores + ' | from: ' + r.info.from + ' | subject: ' + r.info.subject +\n      ' | why: ' + r.d.reasons.concat(r.d.routeReason ? [r.d.routeReason] : []).join('; '));\n  });\n  console.log('Checked ' + ctx.scanned + ' emails.');\n}\n\nfunction sendSummary_(ctx) {\n  if (!ctx.review.length && !ctx.errors.length) return;\n  var n = labelNames_();\n  var to = IFCore.list_(CONFIG.reviewRecipients);\n  if (!to.length) to = [ctx.account];\n  var who = ctx.account + (ctx.home ? ' (' + ctx.home.name + ')' : '');\n  var subject = (CONFIG.systemTag || '[Invoice Forwarder]') + ' ' +\n    (ctx.review.length ? ctx.review.length + ' to review' : '') + (ctx.review.length && ctx.errors.length ? ', ' : '') +\n    (ctx.errors.length ? ctx.errors.length + ' error' + (ctx.errors.length > 1 ? 's' : '') : '') + ' - ' + who;\n\n  var h = ['<div style=\"font-family:Arial,sans-serif;font-size:14px;color:#15232A\">'];\n  if (ctx.review.length) {\n    h.push('<h2 style=\"font-size:18px\">Emails that might be invoices<\/h2>');\n    h.push('<p>These arrived in <b>' + esc_(who) + '<\/b>. Open each one in Gmail while signed in to that account, then apply one label:<\/p>');\n    h.push('<ul><li><b>' + esc_(n.send) + '<\/b>: it is an invoice, forward it (store picked automatically)<\/li>' +\n      '<li><b>' + esc_(n.sendTo) + '/&lt;store&gt;<\/b>: it is an invoice for that store<\/li>' +\n      '<li><b>' + esc_(n.trust) + '<\/b>: forward it, and always forward this sender<\/li>' +\n      '<li><b>' + esc_(n.notInvoice) + '<\/b>: not an invoice, ignore it<\/li>' +\n      '<li><b>' + esc_(n.block) + '<\/b>: not an invoice, and never forward this sender<\/li><\/ul>');\n    h.push(tableHtml_(ctx.review.map(function (r) {\n      return [r.info.from, r.info.subject, r.d.reasons.join('; '), r.d.storeIds.map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(', ') || '?', r.link];\n    }), ['From', 'Subject', 'Why it was held', 'Best guess', '']));\n  }\n  if (ctx.errors.length) {\n    h.push('<h2 style=\"font-size:18px\">Couldn\\'t send<\/h2><p>These have the label <b>' + esc_(n.error) + '<\/b>. Fix the problem, then apply <b>' + esc_(n.send) + '<\/b> to try again.<\/p>');\n    h.push(tableHtml_(ctx.errors.map(function (e) { return [e.info.from, e.info.subject, e.error, '', e.link]; }), ['From', 'Subject', 'Problem', '', '']));\n  }\n  ctx.notes.forEach(function (note) { h.push('<p style=\"color:#8a5a00\">' + esc_(note) + '<\/p>'); });\n  h.push('<p style=\"color:#667\">Sent by the Invoice Forwarder script, settings version ' + esc_(String(CONFIG.rev)) + '.<\/p><\/div>');\n\n  var plain = 'Open Gmail as ' + who + ' and look at the label \"' + n.review + '\".';\n  to.forEach(function (addr) {\n    try { GmailApp.sendEmail(addr, subject, plain, { htmlBody: h.join(''), name: CONFIG.senderName || 'Invoice Forwarder' }); }\n    catch (e) { console.error('Could not send review notice to ' + addr + ': ' + e); }\n  });\n}\n\nfunction tableHtml_(rows, heads) {\n  var cell = 'style=\"border:1px solid #ccd;padding:6px;vertical-align:top\"';\n  var out = '<table style=\"border-collapse:collapse;margin:8px 0 16px\"><tr>' +\n    heads.map(function (x) { return '<th ' + cell + ' align=\"left\">' + esc_(x) + '<\/th>'; }).join('') + '<\/tr>';\n  rows.forEach(function (r) {\n    out += '<tr>' + r.map(function (v, i) {\n      if (i === r.length - 1) return '<td ' + cell + '>' + (v ? '<a href=\"' + esc_(v) + '\">Open in Gmail<\/a>' : '') + '<\/td>';\n      return '<td ' + cell + '>' + esc_(v) + '<\/td>';\n    }).join('') + '<\/tr>';\n  });\n  return out + '<\/table>';\n}\n\nfunction notifyFatal_(ctx, e) {\n  try {\n    var p = PropertiesService.getScriptProperties();\n    var last = Number(p.getProperty(P_FATAL)) || 0;\n    if (Date.now() - last < 6 * 3600000) return; // at most one function select(path, options) {
  var cur = getPath(app.cfg, path);
  return '<select data-k="' + path + '"' + (typeof cur === 'number' ? ' data-num' : '') + '>' + options.map(function (o) {
    return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(cur) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
  }).join('') + '</select>';
}

    ['staff', r + '/Send', 'It’s an invoice. Forward it, picking the store automatically.'],
    ['staff', r + '/Send to/<store name>', 'It’s an invoice for this store. One label per store.'],
    ['staff', r + '/Trust Sender', 'Forward it, and always forward this sender from now on.'],
    ['staff', r + '/Not Invoice', 'Not an invoice. Ignore it.'],
    ['staff', r + '/Block Sender', 'Not an invoice, and never forward this sender.'],
    ['script', r + '/Sent', 'Forwarded.'],
    ['script', r + '/Dismissed', 'Staff said it isn’t an invoice.'],
    ['script', r + '/Excluded', 'Matched an exclusion, so it wasn’t sent.'],

  return rows;
}

function renderTestResult() {
  var el = $('#testResult');
  if (!el) return;
  var t = app.test, c = app.cfg;
  var info = { from: t.from, subject: t.subject, body: t.body, attachments: IFCore.list_(t.att).map(function (n) { return { name: n, size: null }; }) };
  var env = { homeStoreId: t.home, inSpam: t.spam, trusted: [], blocked: [] };
  var d = IFCore.decide_(c, info, env);
  var readPdf = !t.spam && IFCore.needsPdfText_(c, info, d);
  if (readPdf) { info.pdfText = t.pdf || ''; d = IFCore.decide_(c, info, env); }
  var titles = { send: 'Forward', review: 'Hold for review', exclude: 'Exclude', ignore: 'Ignore' };
  var subs = { send: 'Sent automatically', review: 'Staff get a review notice', exclude: 'Labeled Excluded, not sent', ignore: 'Not treated as an invoice' };
  var rows = '';
  if (d.action === 'send' || d.action === 'review') {
    var stores = d.storeIds.map(function (id) {
      var s = IFCore.storeById_(c, id);
      var dests = IFCore.destinationsFor_(c, s, { includePending: true }).map(function (x) {
        return x.kind === 'fax-pending' ? 'fax (waiting for provider address)' : x.kind === 'fax' ? 'fax ' + x.address : 'Teams ' + x.address;
      });
      return '<li><b>' + esc(s ? s.name : id) + '</b>' + (dests.length ? ': ' + esc(dests.join(', ')) : ': no destination set') + '</li>';
    }).join('');
    rows += '<dt>Store</dt><dd>' + (stores ? '<ul>' + stores + '</ul>' : 'Not decided') + (d.routeReason ? '<div class="hint">' + esc(d.routeReason) + '</div>' : '') + '</dd>';
    var files = d.files.map(function (f) { return f.name; });
    if (d.bodyAsPdf) files.unshift('Message text as a PDF');
    if (readPdf) rows += '<dt>PDF text</dt><dd>' + (t.pdf ? 'Read to help decide' : 'Would be read, but none was entered above') + '</dd>';
    rows += '<dt>Pages sent</dt><dd>' + (files.length ? esc(files.join(', ')) : 'Nothing') + '</dd>';
  }
  var reasons = d.reasons.length ? '<ul>' + d.reasons.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' :
    'No invoice wording, and the sender isn’t in the address book. To catch emails like this, add the sender to the address book.';
  rows += '<dt>Why</dt><dd>' + reasons + '</dd>';
  el.innerHTML = '<div class="rxlabel ' + d.action + '"><header><small>' + subs[d.action] + '</small><strong>' + titles[d.action] + '</strong></header>' +
    '<div class="body"><dl>' + rows + '</dl></div></div>';
}

/* ---------- Install view ---------- */
function scriptRevLabel() {
  if (!app.savedRev) return 'unsaved';
  return app.dirty ? app.savedRev + ' plus unsaved changes' : String(app.savedRev);
}
function buildScript() {
  var c = clone(app.cfg);
  c.rev = scriptRevLabel();
  c.savedRev = app.savedRev;
  c.savedAt = app.savedAt || '';
  c.generatedAt = new Date().toISOString();
  var head = [
    '/**',
    ' * PHARMACY INVOICE FORWARDER - Google Apps Script for Gmail',
    ' * Settings version: ' + c.rev + (c.savedAt ? ' (saved ' + c.savedAt + ')' : '') + ', generated ' + c.generatedAt,
    ' *',
    ' * Do not edit this file by hand. Change settings on the Invoice Forwarder',
    ' * setup page, copy the new script, and paste it over everything here.',
    ' *',
    ' * Functions to choose in the menu next to "Debug", then click Run:',
    ' *   setup              run once after every paste (labels, timer, log sheet)',
    ' *   dryRun             show what would happen to recent email; sends nothing',
    ' *   sendTestToMyStore  send a test page to this store\'s fax and Teams',
    ' *   checkSetup         show which store this account is, and any problems',
    ' *   showLearnedLists   senders staff trusted or blocked with labels',
    ' *   resetLearnedLists  forget those senders',
    ' *   removeTimer        stop automatic runs (run setup to start again)',
    ' */',
    ''
  ].join('\n');
  return head + '/* CONFIG-START */\nvar CONFIG = ' + JSON.stringify(c, null, 2) + ';\n/* CONFIG-END */\n\n' + CORE_SRC + '\n' + GAS_SRC;
}

function readinessHtml() {
  var w = IFCore.configWarnings_(app.cfg);
  if (!w.length) return '<ul class="readiness"><li class="ok">Everything needed is filled in.</li></ul>';
  var order = { error: 0, warn: 1, info: 2 };
  w.sort(function (a, b) { return order[a.level] - order[b.level]; });
  return '<ul class="readiness">' + w.map(function (x) { return '<li class="' + x.level + '">' + esc(x.text) + '</li>'; }).join('') + '</ul>';
}

function instructionsHtml() {
  var c = app.cfg;
  var mode = c.deliveryMode;
  var faxOk = IFCore.faxConfigured_(c);
  var teamsAny = c.defaultTeamsAddress || c.stores.some(function (s) { return s.teamsAddress; });
  var gmails = c.stores.map(function (s) { return s.gmail; }).filter(Boolean);
  var r = String(c.labelRoot || 'Invoice');
  var dest = mode === 'fax' ? 'the store’s fax in PioneerRx' : mode === 'teams' ? 'the Teams channel' : 'PioneerRx (fax) and the Teams channel';

  }
  h += item(IFCore.list_(c.reviewRecipients).length > 0, 'Decide who gets review notices, and enter them on the Where invoices go step.');
  if (String(c.historyDocUrl || '').trim()) h += item(null, 'Share the change history document with each store’s Gmail as an editor' + (gmails.length ? ': ' + esc(gmails.join(', ')) : '') + '. Otherwise setup can’t add its entry.');
  else h += item(false, 'Optional: link a change history Google Sheet or Doc on the Labels and schedule step, so every install and update is recorded there.');

  h += '</ol>';

  h += '<h3>Install in each store’s Gmail</h3><p>Repeat for each of the ' + c.stores.length + ' stores; it takes about 10 minutes each. Every store gets the same script. Use a separate Chrome profile or a private window, so you’re signed in to only that store’s Gmail.</p><ol>' +
    '<li><b>Copy the script</b> with the Copy script button above.</li>' +
    '<li><b>Open Apps Script.</b> Signed in as the store’s Gmail, go to <code>script.google.com</code> and choose New project. Click “Untitled project” at the top and name it Invoice Forwarder.</li>' +
    '<li><b>Paste.</b> Click in the Code.gs editor, select everything (Ctrl+A, or Cmd+A on a Mac), delete it, and paste. Save with Ctrl+S (Cmd+S). The Run button stays greyed out until you save.</li>' +
    (c.readPdfText ? '<li><b>Add the Drive service.</b> In the left sidebar, click + next to Services, choose Drive API, and click Add. The script uses it to read the text inside PDFs. Do this before running setup, so Google asks for every permission at once.</li>' : '') +
    '<li><b>Run setup.</b> In the menu next to Debug, choose <code>setup</code>, then click Run. Google asks for permission: choose Review permissions, pick the store’s account, then Advanced, then Go to Invoice Forwarder (unsafe), then Allow. The warning appears because this is your own script rather than a published app.</li>' +
    '<li><b>Check the log.</b> The Execution log at the bottom should say “Detected store:” and the store’s name' + (c.readPdfText ? ', and “Reading inside PDFs: on”' : '') + (String(c.historyDocUrl || '').trim() ? ', and “Added an entry to the change history document”' : '') + '. If it says the account isn’t listed, fix the store’s Gmail address on the Stores step, save, and paste the new script.</li>' +
    '<li><b>Do a dry run.</b> Choose <code>dryRun</code> and click Run. The log lists what would happen to the last ' + c.dryRunHours + ' hours of email, without sending anything. Look for invoices it would miss (add the sender to the address book) and emails it would wrongly send (add an exclusion phrase).</li>' +
    '<li><b>Send a test.</b> Choose <code>sendTestToMyStore</code> and click Run, then check that a one-page test reaches ' + dest + '.</li>' +
    '<li><b>That’s it.</b> setup started a timer, so the script now checks new email every ' + c.runEveryMinutes + ' minutes. Gmail shows a new ' + esc(r) + ' label group' + (c.logToSheet ? ', and Google Drive has a sheet named “Invoice Forwarder Log”' : '') + '. Mark the store as installed in the table at the bottom of this page.</li></ol>';

  h += '<h3>When settings change</h3><ol>' +
    '<li>Make the change on this page and select Save settings. You’ll be asked for your name and a short note; both are kept with the version' + (String(c.historyDocUrl || '').trim() ? ' and added to the change history document when the script is installed' : '') + '.</li>' +
    '<li>Copy the new script.</li>' +
    '<li>In each store’s Gmail, go to <code>script.google.com</code>, open Invoice Forwarder, select everything in Code.gs, paste, and save.</li>' +
    '<li>Choose <code>setup</code> and click Run. This refreshes the labels and the timer. Senders staff trusted or blocked are kept.' + (c.readPdfText ? ' If you just turned on reading inside PDFs, add the Drive service first (left sidebar, + next to Services, Drive API).' : '') + '</li>' +
    '<li>Mark the store as installed with the new version below. A store left on an old version keeps the old settings.</li></ol>';

  h += '<h3>Checking held emails (for staff)</h3><p>A review notice lists each held email with an Open in Gmail link. Open it while signed in to that store’s Gmail, then apply one label. On a computer, use the label button above the email; in the Gmail app, tap ⋮ and then Change labels. The script acts within ' + c.runEveryMinutes + ' minutes and removes the label.</p>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Label</th><th>Use it when</th></tr></thead><tbody>' +

    '</tbody></table></div><p>The same labels work on any email, not only held ones. If an invoice was missed, apply <code>' + esc(r) + '/Send</code> to forward it.</p>';

  h += '<h3>So invoices aren’t missed</h3><ul>' +
    '<li>When you onboard a wholesaler, add its sender to the address book as Always forward. This catches invoices that arrive in the message text or use unusual wording.</li>' +
    '<li>Run <code>dryRun</code> in one store after changing keywords or exclusions, to see the effect on real email.</li>' +
    '<li>Check the <code>' + esc(r) + '/Needs Review</code> and <code>' + esc(r) + '/Error</code> labels if no one has acted on a review notice.</li>' +
    '<li>Every few weeks, run <code>showLearnedLists</code> in each store and copy those senders into the address book, so they apply to all stores.</li></ul>';

  h += '<h3>If something isn’t working</h3><ul>' +
    '<li><b>Run is greyed out:</b> save first (Ctrl+S), then pick a function in the menu next to Debug.</li>' +
    '<li><b>Nothing is being forwarded:</b> in the Apps Script project, open Executions on the left to see errors. Run <code>dryRun</code> to see how recent emails are being sorted.</li>' +
    '<li><b>Faxes don’t arrive:</b> the fax provider must allow the store’s Gmail address as a sender. Look for failure emails from the fax provider in the store’s inbox.</li>' +
    '<li><b>Teams posts don’t appear:</b> check the channel’s email settings. Emails with more than 20 attachments, or an attachment over 10 MB, are rejected by Teams.</li>' +
    '<li><b>Daily limit:</b> free Gmail accounts can send about 100 emails a day from scripts (Google Workspace accounts more). Each forwarded invoice uses one per destination: fax, Teams, and the copy address if set.</li>' +
    '<li><b>Invoices go to the wrong store:</b> add that store’s full name and its account number with the wholesaler as store keywords. If the invoice names the store only inside the PDF, check that reading inside PDFs is on and that checkSetup reports the Drive service.</li>' +
    '<li><b>An email has the Error label:</b> the review notice says why. Fix the cause, then apply <code>' + esc(r) + '/Send</code> to try again.</li></ul>';

  h += '<h3>Turning it off</h3><p>In that store’s Apps Script project, choose <code>removeTimer</code> and click Run. To turn it back on, run <code>setup</code>.</p>';

}

function installTableHtml() {
  var c = app.cfg;
  var canMark = !!app.db && !app.readOnly && app.savedRev > 0;
  var rows = c.stores.map(function (s, i) {
    var inst = app.installs[s.id];
    var status = '<span class="st-none">Not marked yet</span>';
    if (inst) {
      var cur = inst.rev === app.savedRev;
      status = '<span class="' + (cur ? 'st-ok' : 'st-old') + '">' + (cur ? 'Up to date' : 'Needs update') + '</span><div class="hint">Version ' + esc(inst.rev) + ', ' + esc(fmtDate(inst.at)) + ((inst.name || inst.byName) ? ' by ' + esc(inst.name || inst.byName) : '') + '</div>';
    }
    return '<tr><td><b>' + esc(s.name || ('Store ' + (i + 1))) + '</b><div class="hint">' + esc(s.gmail || 'No Gmail address yet') + '</div></td><td>' + status + '</td><td>' +
      (canMark ? '<button class="btn small" data-act="mark-installed" data-id="' + esc(s.id) + '">Mark installed with version ' + app.savedRev + '</button>' : '') + '</td></tr>';

function versionsHtml() {

  return '<div class="toolbar"><button class="btn small" data-act="copy-history">Copy history</button>' +
    '<button class="btn small" data-act="dl-history" data-needs="downloads"' + (app.downloads ? '' : ' hidden') + '>Download history (.csv)</button></div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Version</th><th>Saved</th><th>What changed</th><th><span class="sr">Action</span></th></tr></thead><tbody>' +
    app.versions.map(function (v) {
      var who = v.name || v.byName;
      var ch = (v.changes || []);

        '<td>' + esc(fmtDate(v.savedAt)) + (who ? '<div class="hint">by ' + esc(who) + '</div>' : '') + '</td>' +
        '<td>' + (v.note ? esc(v.note) : '<span class="hint">No note</span>') +
        (ch.length ? '<details class="inline"><summary>' + ch.length + ' change' + (ch.length === 1 ? '' : 's') + '</summary><ul>' + ch.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details>' : '') + '</td>' +
        '<td>' + (v.rev === app.savedRev ? '' : '<button class="btn small" data-act="load-version" data-rev="' + esc(v.rev) + '">Load into the editor</button>') + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="hint">Loading an older version puts it in the editor. Save settings to make it current again. The list shows the latest 40 versions.</p>';
}

    '<div class="group"><h3>Check before installing</h3><div id="readiness">' + readinessHtml() + '</div></div>' +
    '<div class="group"><h3>The script</h3><p id="scriptVersion"></p>' +
    '<div class="toolbar"><button class="btn primary" data-act="copy-script">Copy script</button>' +
    '<button class="btn" data-act="dl-script" data-needs="downloads" hidden>Download script</button>' +
    '<button class="btn" data-act="dl-instr" data-needs="downloads" hidden>Download instructions</button></div>' +

    '<div class="group"><h3>Saved versions</h3><div id="versions"></div></div>' +

function refreshInstall() {
  if (!$('#scriptOut')) return;
  $('#readiness').innerHTML = readinessHtml();
  $('#scriptOut').value = buildScript();
  $('#scriptVersion').textContent = app.savedRev ?
    ('Settings version ' + scriptRevLabel() + (app.savedAt ? ', saved ' + fmtDate(app.savedAt) : '') + '.') :
    'These settings haven’t been saved yet, so the script has no version number.';

  $('#installTable').innerHTML = installTableHtml();

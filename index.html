<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice forwarder setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F5F4; --panel: #FFFFFF; --ink: #15232A; --muted: #55676E; --line: #D3DDDA; --line-strong: #A9BAB6;
  --send: #0B7A5E; --send-soft: #E1F2EB; --send-ink: #06553F;
  --review: #9A5B00; --review-soft: #FCEFD8; --review-ink: #6E4100;
  --exclude: #B3261E; --exclude-soft: #FBE6E4; --exclude-ink: #84190F;
  --ignore: #66767C; --ignore-soft: #ECF0EF;
  --focus: #1D63D8; --code-bg: #10201F; --code-ink: #D6E7E2;
  --radius: 6px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1617; --panel: #142123; --ink: #E3EDEB; --muted: #96AAAE; --line: #26393C; --line-strong: #3E5559;
    --send: #3FC196; --send-soft: #10342A; --send-ink: #8BE3C3;
    --review: #E6A646; --review-soft: #3A2A10; --review-ink: #F5CD8E;
    --exclude: #F08A80; --exclude-soft: #3D1B19; --exclude-ink: #F8B9B2;
    --ignore: #8FA1A5; --ignore-soft: #1C2B2D;
    --focus: #7AA7FF; --code-bg: #091112; --code-ink: #CFE2DD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1617; --panel: #142123; --ink: #E3EDEB; --muted: #96AAAE; --line: #26393C; --line-strong: #3E5559;
  --send: #3FC196; --send-soft: #10342A; --send-ink: #8BE3C3;
  --review: #E6A646; --review-soft: #3A2A10; --review-ink: #F5CD8E;
  --exclude: #F08A80; --exclude-soft: #3D1B19; --exclude-ink: #F8B9B2;
  --ignore: #8FA1A5; --ignore-soft: #1C2B2D;
  --focus: #7AA7FF; --code-bg: #091112; --code-ink: #CFE2DD;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-size: 17px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--send-ink); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
p { margin: 0 0 12px; }
code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 0.86em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-size: 20px; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--review-soft); color: var(--review-ink); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 9px 16px; border-radius: var(--radius); border: 1.5px solid var(--line-strong);
  background: var(--panel); color: var(--ink); font-weight: 700; font-size: 15px;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--send); border-color: var(--send); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #062B21; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #062B21; } }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 11px; font-size: 14px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--send-ink); text-decoration: underline; cursor: pointer; font-weight: 700; }
.linkbtn.danger { color: var(--exclude-ink); }

/* Layout */
.shell { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 44px; }
.steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); align-self: start; }
.steps ol { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps li { counter-increment: step; }
.steps a {
  display: flex; gap: 12px; align-items: baseline; padding: 9px 12px; border-left: 3px solid transparent;
  text-decoration: none; color: var(--muted); font-weight: 700; font-size: 16px;
}
.steps a::before { content: counter(step); font-variant-numeric: tabular-nums; min-width: 1.1em; color: var(--line-strong); }
.steps a:hover { color: var(--ink); }
.steps a[aria-current="page"] { color: var(--ink); border-left-color: var(--send); background: var(--panel); }
.steps a[aria-current="page"]::before { color: var(--send); }
.steps .badge { margin-left: auto; white-space: nowrap; align-self: center; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--review-soft); color: var(--review-ink); }
main { min-width: 0; max-width: 860px; }
section[data-view] { display: none; }
section[data-view].active { display: block; }
section h2 { font-size: 32px; margin-bottom: 10px; letter-spacing: -0.01em; }
.lead { color: var(--muted); font-size: 18px; max-width: 64ch; margin-bottom: 26px; }
.group { margin: 0 0 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.group > h3 { font-size: 20px; margin-bottom: 6px; }
.group > p { color: var(--muted); max-width: 68ch; }

/* Route strip: the three outcomes */
.route { display: grid; grid-template-columns: auto 1fr; gap: 0 18px; align-items: stretch; margin: 0 0 30px; }
.route-src { display: flex; align-items: center; font-weight: 700; padding: 10px 0; }
.route-lanes { display: grid; gap: 6px; }
.lane { display: flex; gap: 12px; align-items: baseline; padding: 8px 14px; border-left: 5px solid; background: var(--panel); }
.lane b { min-width: 9.5em; }
.lane span { color: var(--muted); font-size: 15px; }
.lane.send { border-color: var(--send); } .lane.send b { color: var(--send-ink); }
.lane.review { border-color: var(--review); } .lane.review b { color: var(--review-ink); }
.lane.exclude { border-color: var(--exclude); } .lane.exclude b { color: var(--exclude-ink); }

/* Fields */
label.f, .f { display: block; margin-bottom: 16px; }
.f > span, .f-label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 15px; }
.f small, .hint { display: block; color: var(--muted); font-size: 14px; margin-top: 5px; max-width: 68ch; }
input[type=text], input[type=email], input[type=number], input[type=tel], select, textarea {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--line-strong); border-radius: var(--radius);
  background: var(--panel); min-height: 44px;
}
textarea { resize: vertical; line-height: 1.45; }
input:hover, select:hover, textarea:hover { border-color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.check { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--send); }
.check b { display: block; }
.check small { color: var(--muted); font-size: 14px; }
.radio-set { display: grid; gap: 8px; margin-bottom: 16px; }
.radio-set label { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--panel); cursor: pointer; }
.radio-set label:has(input:checked) { border-color: var(--send); }
.radio-set input { accent-color: var(--send); width: 18px; height: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { border: 1.5px dashed var(--line-strong); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { border-style: solid; }
.state { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 6px; }
.state.ok { background: var(--send-soft); color: var(--send-ink); }
.state.todo { background: var(--review-soft); color: var(--review-ink); }

/* Stores */
.store { display: grid; grid-template-columns: 44px 1fr; gap: 0 14px; padding: 20px 0; border-top: 1px solid var(--line); }
.store:first-child { border-top: 0; padding-top: 0; }
.store-num { font-size: 26px; font-weight: 700; color: var(--line-strong); font-variant-numeric: tabular-nums; line-height: 1.2; }
.store-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.store-head h3 { font-size: 19px; }
.store-head .linkbtn { margin-left: auto; font-size: 14px; }
.faxprev { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all; }

/* Rules table */
.rules { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
.rules th, .rules td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.rules th { font-size: 14px; color: var(--muted); }
.rules td:first-child { font-weight: 700; }
.rules select { max-width: 260px; }

/* Address book */
.book { width: 100%; border-collapse: collapse; }
.book th { text-align: left; font-size: 14px; color: var(--muted); padding: 6px 6px; }
.book td { padding: 6px; vertical-align: top; border-top: 1px solid var(--line); }
.book td:last-child { width: 1%; white-space: nowrap; vertical-align: middle; }
.empty { padding: 18px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); margin-bottom: 14px; }

/* Labels preview */
.labels { list-style: none; padding: 0; margin: 0 0 10px; }
.labels li { display: grid; grid-template-columns: minmax(0, 15em) 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.labels code { font-weight: 500; word-break: break-word; }
.labels span { color: var(--muted); font-size: 15px; }
.who { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-right: 6px; background: var(--ignore-soft); color: var(--muted); }

/* Tester */
.presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.tester { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.rxlabel { border: 2px solid var(--ignore); border-radius: var(--radius); background: var(--panel); overflow: hidden; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); }
.rxlabel header { padding: 14px 18px; background: var(--ignore-soft); border-bottom: 2px solid var(--ignore); }
.rxlabel header small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.rxlabel header strong { display: block; font-size: 26px; line-height: 1.15; }
.rxlabel .body { padding: 14px 18px 18px; }
.rxlabel dl { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 8px 12px; }
.rxlabel dt { color: var(--muted); font-size: 14px; font-weight: 700; padding-top: 2px; }
.rxlabel dd { margin: 0; word-break: break-word; }
.rxlabel ul { margin: 0; padding-left: 18px; }
.rxlabel.send { border-color: var(--send); } .rxlabel.send header { background: var(--send-soft); border-color: var(--send); color: var(--send-ink); }
.rxlabel.review { border-color: var(--review); } .rxlabel.review header { background: var(--review-soft); border-color: var(--review); color: var(--review-ink); }
.rxlabel.exclude { border-color: var(--exclude); } .rxlabel.exclude header { background: var(--exclude-soft); border-color: var(--exclude); color: var(--exclude-ink); }

/* Install */
.readiness { list-style: none; padding: 0; margin: 0 0 20px; }
.readiness li { padding: 8px 12px 8px 14px; border-left: 4px solid var(--line-strong); margin-bottom: 6px; background: var(--panel); font-size: 15px; }
.readiness li.error { border-color: var(--exclude); }
.readiness li.warn { border-color: var(--review); }
.readiness li.info { border-color: var(--line-strong); color: var(--muted); }
.readiness li.ok { border-color: var(--send); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
.codebox { width: 100%; height: 340px; background: var(--code-bg); color: var(--code-ink); border: 0; border-radius: var(--radius); padding: 14px; font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; white-space: pre; overflow: auto; }
.instructions h3 { font-size: 21px; margin: 30px 0 10px; }
.instructions h3:first-child { margin-top: 0; }
.instructions ol, .instructions ul { padding-left: 24px; max-width: 70ch; }
.instructions li { margin-bottom: 10px; }
.instructions .todo-item { color: var(--review-ink); font-weight: 700; }
.instructions .ok-item { color: var(--send-ink); font-weight: 700; }
.tbl-wrap { overflow-x: auto; margin-bottom: 16px; }
.tbl { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 14px; color: var(--muted); }
.st-ok { color: var(--send-ink); font-weight: 700; }
.st-old { color: var(--review-ink); font-weight: 700; }
.st-none { color: var(--muted); }
details.box { border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 16px; background: var(--panel); margin-bottom: 14px; }
details.box summary { font-weight: 700; cursor: pointer; }
details.box[open] summary { margin-bottom: 12px; }

/* Banners and toast */
.banner { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 18px; border: 1.5px solid var(--review); background: var(--review-soft); color: var(--review-ink); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.banner.info { border-color: var(--line-strong); background: var(--panel); color: var(--ink); }
.banner p { margin: 0; flex: 1 1 320px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); z-index: 20;
  background: var(--ink); color: var(--panel); padding: 11px 18px; border-radius: var(--radius); font-weight: 700; font-size: 15px;
  display: none; gap: 14px; align-items: center; max-width: calc(100% - 32px); }
.toast.show { display: flex; }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 700; cursor: pointer; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.stepnav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--line); }
a.btn, a.pill { text-decoration: none; }
.sharelink { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; margin: 6px 0 8px; word-break: break-all; }
.plain-steps { padding-left: 22px; } .plain-steps li { margin-bottom: 8px; }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(8, 18, 20, .5); display: flex; align-items: flex-start; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 48px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); overflow: auto; }
.modal-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: 100%; max-width: 620px; padding: 24px; }
.modal-card h2 { font-size: 24px; margin-bottom: 14px; }
.changes { max-height: 230px; overflow: auto; margin: 0 0 8px; padding: 10px 14px 10px 30px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); font-size: 14px; }
.changes li { margin-bottom: 4px; }
.invalid { border-color: var(--exclude) !important; }
details.inline summary { cursor: pointer; color: var(--send-ink); font-weight: 700; font-size: 14px; }
details.inline ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; gap: 18px; padding-top: 0; }
  .steps { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 0px); z-index: 4; background: var(--bg); margin: 0 -24px; padding: 6px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .steps ol { display: flex; gap: 2px; }
  .steps a { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; padding: 8px 10px; font-size: 15px; }
  .steps a[aria-current="page"] { border-bottom-color: var(--send); background: transparent; }
  .tester { grid-template-columns: 1fr; }
  .rxlabel { position: static; }
  .top { position: static; }
}
@media (max-width: 620px) {
  body { font-size: 16px; }
  .row { grid-template-columns: 1fr; }
  section h2 { font-size: 26px; }
  .route { grid-template-columns: 1fr; }
  .lane { flex-direction: column; gap: 0; }
  .labels li { grid-template-columns: 1fr; gap: 2px; }
  .book thead { display: none; }
  .book tr { display: block; border-top: 1px solid var(--line); padding: 8px 0; }
  .book td { display: block; border: 0; padding: 4px 0; width: auto !important; }
  .store { grid-template-columns: 1fr; }
  .store-num { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="6" fill="var(--send)"/>
        <path d="M9 11h16M9 17h10M9 23h7" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M21 20l4 3-4 3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>Invoice forwarder setup</h1>
        <p>Settings for the Gmail script that sends invoices to each store’s fax and Teams</p>
      </div>
    </div>
    <div class="status" id="status" aria-live="polite"><span>Loading saved settings…</span></div>
  </div>
</header>

<div class="shell">
  <nav class="steps" aria-label="Setup steps">
    <ol>
      <li><a href="#stores" data-nav="stores">Stores</a></li>
      <li><a href="#delivery" data-nav="delivery">Where invoices go</a></li>
      <li><a href="#detection" data-nav="detection">What counts as an invoice</a></li>
      <li><a href="#senders" data-nav="senders">Sender address book</a></li>
      <li><a href="#labels" data-nav="labels">Labels and schedule</a></li>
      <li><a href="#test" data-nav="test">Try an email</a></li>
      <li><a href="#install" data-nav="install">Get the script <span class="badge" id="navBadge" hidden></span></a></li>
    </ol>
  </nav>

  <main id="main">
    <div id="banners"></div>
    <section data-view="stores" id="v-stores"></section>
    <section data-view="delivery" id="v-delivery"></section>
    <section data-view="detection" id="v-detection"></section>
    <section data-view="senders" id="v-senders"></section>
    <section data-view="labels" id="v-labels"></section>
    <section data-view="test" id="v-test"></section>
    <section data-view="install" id="v-install"></section>
  </main>
</div>

 <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card"><h2 id="modalTitle"></h2><div id="modalBody"></div>
    <div class="toolbar"><button class="btn primary" id="modalOk"></button><button class="btn" id="modalCancel">Cancel</button></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button id="toastAction" hidden></button></div>

<script>
/* ============================================================
 * CORE LOGIC - decides what happens to an email.
 * The setup page uses this same code for its "Try an email" tester.
 * ============================================================ */
var IFCore = (function () {
  var IMAGE_EXT = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'tif', 'tiff', 'webp'];

  // Purchase-order number variations: PO#, P.O. No., PO Number, PO Num, Purchase Order, PO 123456
  var PO_PATTERNS = [
    { label: 'PO number', re: /(?:^|[^A-Za-z0-9])p\.?\s?o\.?\s*(?:#|no\.?(?![a-z])|num(?:ber)?\.?(?![a-z])|nbr\.?(?![a-z]))/i },
    { label: 'purchase order', re: /(?:^|[^A-Za-z0-9])purchase\s+order/i },
    { label: 'PO number', re: /(?:^|[^A-Za-z0-9])P\.?O\.?\s*[:#-]?\s*\d{4,}/ }
  ];

  function list_(v) {
    if (!v) return [];
    var arr = Array.isArray(v) ? v : String(v).split(/[\n,;]+/);
    return arr.map(function (s) { return String(s).trim(); }).filter(function (s) { return s.length > 0; });
  }

  function escRe_(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  // Matches a phrase at the start of a word. Short phrases (3 letters or fewer) must be a whole word.
  function phraseRe_(phrase, wholeWord) {
    var p = String(phrase).trim();
    var body = escRe_(p).replace(/\s+/g, '\\s+');
    var whole = wholeWord || p.length <= 3;
    return new RegExp('(?:^|[^A-Za-z0-9])' + body + (whole ? '(?![A-Za-z0-9])' : ''), 'i');
  }

  function invoiceHits_(cfg, text) {
    var hits = [];
    if (!text) return hits;
    list_(cfg.keywords).forEach(function (k) {
      if (phraseRe_(k, false).test(text)) hits.push(k);
    });
    if (cfg.matchPoPatterns) {
      PO_PATTERNS.forEach(function (p) {
        if (hits.indexOf(p.label) < 0 && p.re.test(text)) hits.push(p.label);
      });
    }
    return hits;
  }

  function attachmentNames_(info) {
    return (info.attachments || []).map(function (a) { return a.name || ''; });
  }

  function keywordMatches_(cfg, info) {
    var names = attachmentNames_(info).join('\n').replace(/[_\-.]+/g, ' ');
    return {
      subject: invoiceHits_(cfg, info.subject || ''),
      attachment: invoiceHits_(cfg, names),
      body: invoiceHits_(cfg, info.body || ''),
      pdf: cfg.readPdfText && cfg.pdfWording ? invoiceHits_(cfg, info.pdfText || '') : []
    };
  }

  function exclusionMatch_(cfg, info) {
    var text = (info.subject || '') + (cfg.exclusionCheckBody ? '\n' + (info.body || '') : '');
    var phrases = list_(cfg.exclusionPhrases);
    for (var i = 0; i < phrases.length; i++) {
      if (phraseRe_(phrases[i], false).test(text)) return phrases[i];
    }
    return null;
  }

  function parseSender_(from) {
    var raw = String(from || '');
    var m = raw.match(/<([^>]+)>/);
    var email = (m ? m[1] : raw).trim().toLowerCase();
    var at = email.lastIndexOf('@');
    return { email: email, domain: at >= 0 ? email.slice(at + 1) : '' };
  }

  function validSender_(pattern) {
    var p = String(pattern || '').trim().toLowerCase().replace(/^@/, '');
    if (!p) return false;
    if (p.indexOf('@') >= 0) return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p);
    return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(p);
  }

  function senderMatches_(pattern, email, domain) {
    var p = String(pattern || '').trim().toLowerCase().replace(/^@/, '');
    if (!p) return false;
    if (p.indexOf('@') >= 0) return p === email;
    return domain === p || (domain.length > p.length && domain.slice(-(p.length + 1)) === '.' + p);
  }

  // Exact email entries win over domain entries; longer domains win over shorter ones.
  function findBookEntry_(cfg, email, domain) {
    var book = (cfg.addressBook || []).filter(function (e) { return e && e.sender; });
    var exact = book.filter(function (e) { return String(e.sender).indexOf('@') > 0 && senderMatches_(e.sender, email, domain); });
    if (exact.length) return exact[0];
    var doms = book.filter(function (e) { return String(e.sender).replace(/^@/, '').indexOf('@') < 0 && senderMatches_(e.sender, email, domain); });
    doms.sort(function (a, b) { return String(b.sender).length - String(a.sender).length; });
    return doms[0] || null;
  }

  function storeById_(cfg, id) {
    var s = (cfg.stores || []).filter(function (x) { return x.id === id; });
    return s[0] || null;
  }

  function storeName_(cfg, id) {
    var s = storeById_(cfg, id);
    return s ? (s.name || s.id) : id;
  }

  // Store keywords in the subject, message text or attachment names win over ones found only inside a PDF.
  function storeHits_(cfg, info) {
    var text = [info.subject || '', info.body || '', attachmentNames_(info).join(' ').replace(/[_\-.]+/g, ' ')].join('\n');
    var pdf = cfg.readPdfText ? String(info.pdfText || '') : '';
    var inText = [], inPdf = [];
    (cfg.stores || []).forEach(function (s) {
      var kws = list_(s.keywords);
      var textHit = null, pdfHit = null;
      for (var i = 0; i < kws.length; i++) {
        var re = phraseRe_(kws[i], true);
        if (!textHit && re.test(text)) textHit = kws[i];
        if (!pdfHit && pdf && re.test(pdf)) pdfHit = kws[i];
      }
      if (textHit) inText.push({ store: s, keyword: textHit, inPdf: false });
      else if (pdfHit) inPdf.push({ store: s, keyword: pdfHit, inPdf: true });
    });
    return inText.length ? inText : inPdf;
  }

  function emailsIn_(v) {
    var out = [];
    (Array.isArray(v) ? v : [v]).forEach(function (x) {
      String(x || '').replace(/[A-Za-z0-9._%+'-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, function (m) {
        m = m.toLowerCase();
        if (out.indexOf(m) < 0) out.push(m);
        return m;
      });
    });
    return out;
  }

  // Every address that belongs to a store: its Gmail plus any other invoice receiving addresses.
  function storeAddresses_(st) {
    return emailsIn_([st.gmail || ''].concat(list_(st.receivingEmails)));
  }

  // Stores whose addresses appear among the email's recipients (To, Cc, Delivered-To).
  function recipientStores_(cfg, info) {
    var rec = emailsIn_(info.recipients || []);
    var hits = [];
    if (!rec.length) return hits;
    (cfg.stores || []).forEach(function (st) {
      var mine = storeAddresses_(st);
      for (var i = 0; i < rec.length; i++) {
        if (mine.indexOf(rec[i]) >= 0) { hits.push({ store: st, address: rec[i] }); break; }
      }
    });
    return hits;
  }

  // The store an inbox belongs to: the one whose Gmail or receiving addresses include it. Null if none or several.
  function homeStoreFor_(cfg, account) {
    var a = String(account || '').trim().toLowerCase();
    if (!a) return null;
    var byGmail = (cfg.stores || []).filter(function (st) { return String(st.gmail || '').trim().toLowerCase() === a; });
    if (byGmail.length === 1) return byGmail[0];
    var byAny = (cfg.stores || []).filter(function (st) { return storeAddresses_(st).indexOf(a) >= 0; });
    return byAny.length === 1 ? byAny[0] : null;
  }

  function route_(cfg, info, book, env) {
    env = env || {};
    if (book && book.store && book.store !== 'auto' && storeById_(cfg, book.store)) {
      return { kind: 'book', storeIds: [book.store], reason: 'The address book sends this sender to ' + storeName_(cfg, book.store) };
    }
    var hits = cfg.storeCheck === false ? [] : storeHits_(cfg, info);
    if (hits.length === 1) {
      return { kind: 'keyword', storeIds: [hits[0].store.id], reason: 'It mentions \u201c' + hits[0].keyword + '\u201d, a keyword for ' + (hits[0].store.name || hits[0].store.id) + (hits[0].inPdf ? ' (found inside the PDF)' : '') };
    }
    if (hits.length > 1) {
      var names = hits.map(function (h) { return h.store.name || h.store.id; }).join(', ');
      var ids = hits.map(function (h) { return h.store.id; });
      if (cfg.multiStoreMatch === 'all') return { kind: 'keyword', storeIds: ids, reason: 'It mentions several stores (' + names + '), so it goes to each' };
      return { kind: 'multi', storeIds: ids, problem: 'It mentions more than one store (' + names + ')' };
    }
    var rec = recipientStores_(cfg, info);
    if (rec.length === 1) {
      return { kind: 'recipient', storeIds: [rec[0].store.id], reason: 'It was sent to ' + rec[0].address + ', a receiving address for ' + (rec[0].store.name || rec[0].store.id) };
    }
    if (rec.length > 1) {
      var recIds = rec.map(function (h) { return h.store.id; });
      if (env.homeStoreId && recIds.indexOf(env.homeStoreId) >= 0) {
        return { kind: 'home', storeIds: [env.homeStoreId], reason: 'It was sent to several stores\u2019 addresses, so this inbox\u2019s store (' + storeName_(cfg, env.homeStoreId) + ') gets its copy' };
      }
      var recNames = rec.map(function (h) { return h.store.name || h.store.id; }).join(', ');
      if (cfg.multiStoreMatch === 'all') return { kind: 'recipient', storeIds: recIds, reason: 'It was sent to addresses for several stores (' + recNames + '), so it goes to each' };
      return { kind: 'multi', storeIds: recIds, problem: 'It was sent to addresses for more than one store (' + recNames + ')' };
    }
    if (env.homeStoreId && storeById_(cfg, env.homeStoreId)) {
      return { kind: 'home', storeIds: [env.homeStoreId], reason: 'No store keyword found, so it goes to the store whose Gmail received it (' + storeName_(cfg, env.homeStoreId) + ')' };
    }
    if (cfg.fallbackStoreId && storeById_(cfg, cfg.fallbackStoreId)) {
      return { kind: 'fallback', storeIds: [cfg.fallbackStoreId], reason: 'No store keyword found, so it goes to the fallback store (' + storeName_(cfg, cfg.fallbackStoreId) + ')' };
    }
    return { kind: 'none', storeIds: [], problem: 'It isn\u2019t clear which store this is for' };
  }

  function ext_(name) {
    var m = /\.([A-Za-z0-9]+)$/.exec(name || '');
    return m ? m[1].toLowerCase() : '';
  }

  function forwardableFiles_(cfg, atts) {
    var types = list_(cfg.attachmentTypes).map(function (t) { return t.replace(/^\./, '').toLowerCase(); });
    var minImg = (Number(cfg.minImageKB) || 0) * 1024;
    return (atts || []).filter(function (a) {
      var e = ext_(a.name);
      if (types.indexOf(e) < 0) return false;
      if (IMAGE_EXT.indexOf(e) >= 0 && a.size != null && a.size < minImg) return false;
      return true;
    });
  }

  function faxConfigured_(cfg) {
    var t = String(cfg.faxAddressTemplate || '');
    return t.indexOf('{number}') >= 0 && t.indexOf('@') > 0 && !/replace|your-fax|example\./i.test(t);
  }

  function faxDigits_(number) {
    var d = String(number || '').replace(/\D/g, '');
    if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);
    return d;
  }

  function faxAddress_(cfg, number) {
    var d = faxDigits_(number);
    return d ? String(cfg.faxAddressTemplate || '').replace('{number}', d) : '';
  }

  function faxDomain_(cfg) {
    if (!faxConfigured_(cfg)) return '';
    var t = String(cfg.faxAddressTemplate);
    return t.slice(t.lastIndexOf('@') + 1).toLowerCase();
  }

  // opts.includePending = also list fax addresses that can't be used yet (for display only)
  function destinationsFor_(cfg, store, opts) {
    var out = [];
    if (!store) return out;
    var mode = cfg.deliveryMode || 'both';
    if (mode !== 'teams' && faxDigits_(store.faxNumber)) {
      if (faxConfigured_(cfg)) out.push({ kind: 'fax', address: faxAddress_(cfg, store.faxNumber) });
      else if (opts && opts.includePending) out.push({ kind: 'fax-pending', address: faxAddress_(cfg, store.faxNumber) });
    }
    if (mode !== 'fax') {
      var t = String(store.teamsAddress || '').trim() || String(cfg.defaultTeamsAddress || '').trim();
      if (t) out.push({ kind: 'teams', address: t });
    }
    return out;
  }

  // Works out stores, files and destinations. forcedStoreId is used when staff pick a store by label.
  function plan_(cfg, info, env, forcedStoreId) {
    var s = parseSender_(info.from);
    var book = findBookEntry_(cfg, s.email, s.domain);
    var r = forcedStoreId ? { kind: 'staff', storeIds: [forcedStoreId], reason: 'Staff chose ' + storeName_(cfg, forcedStoreId) } : route_(cfg, info, book, env);
    var files = forwardableFiles_(cfg, info.attachments);
    var plan = {
      storeIds: r.storeIds,
      routeKind: r.kind || '',
      routeReason: r.reason || '',
      problem: r.problem || '',
      problemKind: r.problem ? 'store' : '',
      files: files,
      bodyAsPdf: !!cfg.bodyToPdf && (files.length === 0 || !!cfg.alwaysIncludeBody)
    };
    if (!plan.problem) {
      var noDest = plan.storeIds.filter(function (id) { return destinationsFor_(cfg, storeById_(cfg, id)).length === 0; });
      if (noDest.length) {
        plan.problemKind = 'blocked';
        plan.problem = 'There\u2019s no working fax or Teams address for ' + noDest.map(function (id) { return storeName_(cfg, id); }).join(', ') +
          (faxConfigured_(cfg) ? '' : ' yet (the fax provider address is still a placeholder)');
      }
    }
    if (!plan.problem && files.length === 0 && !plan.bodyAsPdf) {
      plan.problemKind = 'blocked';
      plan.problem = 'There\u2019s nothing to send: no attachment, and \u201cturn the message text into a PDF\u201d is off';
    }
    return plan;
  }

  function where_(kw) {
    var parts = [];
    if (kw.subject.length) parts.push('the subject (' + kw.subject.join(', ') + ')');
    if (kw.attachment.length) parts.push('an attachment name (' + kw.attachment.join(', ') + ')');
    if (kw.body.length) parts.push('the message text (' + kw.body.join(', ') + ')');
    if (kw.pdf && kw.pdf.length) parts.push('the text inside a PDF (' + kw.pdf.join(', ') + ')');
    if (parts.length <= 1) return parts.join('');
    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];
  }

  /**
   * The main decision. Returns:
   *   action: 'send' | 'review' | 'exclude' | 'ignore'
   *   reasons: plain-language list of why
   *   storeIds, files, bodyAsPdf: what would be sent where
   * env: { trusted: [emails], blocked: [emails], homeStoreId: 's1', inSpam: bool }
   */
  function decide_(cfg, info, env) {
    env = env || {};
    var s = parseSender_(info.from);
    var kw = keywordMatches_(cfg, info);
    var any = kw.subject.length + kw.attachment.length + kw.body.length + kw.pdf.length > 0;
    var book = findBookEntry_(cfg, s.email, s.domain);
    var vendor = book && book.vendor ? ' (' + book.vendor + ')' : '';
    var blocked = (env.blocked || []).indexOf(s.email) >= 0;
    var trusted = (env.trusted || []).indexOf(s.email) >= 0;
    var res = { action: 'ignore', reasons: [], flags: [], keywordHits: kw, sender: s.email, bookEntry: book, storeIds: [], files: [], bodyAsPdf: false,
      routeReason: '', routeKind: '', locked: false, storeUnsure: false, blocked: false, teamsOnly: false, teamsTargets: [] };

    var neverSender = list_(cfg.excludedSenders).filter(function (p) { return senderMatches_(p, s.email, s.domain); })[0];
    if (neverSender && !(book && book.action === 'forward')) {
      res.action = any ? 'exclude' : 'ignore';
      res.locked = true;
      res.reasons.push('The sender is on the never-forward list (' + neverSender + ')');
      return res;
    }

    if (blocked || (book && book.action === 'exclude')) {
      res.action = any ? 'exclude' : 'ignore';
      res.locked = true;
      res.reasons.push(blocked ? 'Staff blocked this sender with the Block Sender label' : 'This sender is set to \u201cnever forward\u201d in the address book' + vendor);
      return res;
    }

    if (book && book.action === 'forward') {
      res.action = 'send';
      res.reasons.push('This sender is in the address book' + vendor + ' as \u201calways forward\u201d');
    } else if (trusted) {
      res.action = 'send';
      res.reasons.push('Staff trusted this sender with the Trust Sender label');
    } else if (book && book.action === 'review') {
      res.action = 'review';
      res.reasons.push('The address book says to always check this sender' + vendor);
      res.flags.push('the address book says to check this sender');
    } else {
      if (cfg.onlyBookSenders) {
        res.locked = true;
        res.reasons.push('Only senders in the address book are forwarded');
        return res;
      }
      var ex = exclusionMatch_(cfg, info);
      if (ex) {
        res.action = any ? 'exclude' : 'ignore';
        res.locked = true;
        res.reasons.push('It contains the exclusion phrase \u201c' + ex + '\u201d');
        return res;
      }
      var rules = cfg.rules || {};
      if (any) {
        var auto = (kw.subject.length && rules.subject === 'send') ||
                   (kw.attachment.length && rules.attachment === 'send') ||
                   (kw.body.length && rules.body === 'send') ||
                   (kw.pdf.length && rules.pdf === 'send');
        res.action = auto ? 'send' : 'review';
        res.reasons.push('Invoice wording found in ' + where_(kw));
        if (!auto) {
          res.reasons.push('Wording found only there is treated as unsure');
          res.flags.push('it might not be an invoice (the wording was only in the ' + (kw.body.length ? 'message text' : 'PDF') + ')');
        }
      } else if (cfg.reviewUnknownAttachments && !book && forwardableFiles_(cfg, info.attachments).length) {
        res.action = 'review';
        res.reasons.push('It has an attachment from a sender who isn\u2019t in the address book');
        res.flags.push('attachment from a sender who isn\u2019t in the address book');
      } else {
        return res;
      }
    }

    var plan = plan_(cfg, info, env, null);
    res.storeIds = plan.storeIds;
    res.routeReason = plan.routeReason;
    res.routeKind = plan.routeKind;
    res.files = plan.files;
    res.bodyAsPdf = plan.bodyAsPdf;
    if (plan.problem) {
      if (res.action === 'send') res.action = 'review';
      res.reasons.push(plan.problem);
      if (plan.problemKind === 'store') {
        res.storeUnsure = true;
        res.flags.push('check which store it\u2019s for' + (plan.routeKind === 'multi' ?
          ' (' + plan.problem.charAt(0).toLowerCase() + plan.problem.slice(1) + ')' : ''));
      } else {
        res.blocked = true;
      }
    }
    if (env.inSpam) {
      if (res.action === 'send') res.action = 'review';
      res.reasons.push('It was in the Spam folder');
      res.flags.push('it was in the Spam folder');
    }
    if (res.action === 'review' && !res.blocked && cfg.unsureAction !== 'review' && (cfg.deliveryMode || 'both') !== 'fax') {
      var targets = flaggedTargets_(cfg, res);
      if (targets.length) {
        res.action = 'send';
        res.teamsOnly = true;
        res.teamsTargets = targets;
        res.reasons.push('Unsure, so it goes to Teams only, tagged \u26a0 Check');
      } else {
        res.reasons.push('There\u2019s no Teams channel for unsure emails, so it\u2019s held for review');
      }
    }
    return res;
  }

  function hasPdf_(info) {
    return (info.attachments || []).some(function (a) { return ext_(a.name) === 'pdf'; });
  }

  // True when reading the text inside the PDF could change the decision:
  // to find the store when nothing else named it, or to find invoice wording.
  function needsPdfText_(cfg, info, d) {
    if (!cfg.readPdfText || info.pdfText != null || !hasPdf_(info) || d.locked) return false;
    if (d.action === 'ignore') return !!cfg.pdfWording;
    if (d.action === 'exclude') return false;
    return cfg.storeCheck !== false && ['home', 'recipient', 'fallback', 'none', 'multi'].indexOf(d.routeKind) >= 0;
  }

  // Where an unsure email goes when unsure emails are sent to Teams with a Check tag.
  function flaggedTargets_(cfg, res) {
    var out = [];
    var add = function (a) { a = String(a || '').trim(); if (a && out.indexOf(a) < 0) out.push(a); };
    if (res.storeUnsure || !res.storeIds.length) add(cfg.defaultTeamsAddress);
    if (!out.length) res.storeIds.forEach(function (id) { var st = storeById_(cfg, id); if (st) add(st.teamsAddress || cfg.defaultTeamsAddress); });
    return out;
  }

  function settingsSummary_(c) {
    var out = [];
    var yn = function (b) { return b ? 'yes' : 'no'; };
    var rule = function (v) { return v === 'send' ? 'forward' : 'hold for review'; };
    out.push('Sends to: ' + ({ both: 'fax and Teams', fax: 'fax only', teams: 'Teams only' }[c.deliveryMode] || c.deliveryMode));
    out.push('Fax provider format: ' + c.faxAddressTemplate + (faxConfigured_(c) ? '' : ' (placeholder)'));
    out.push('Default Teams channel: ' + (c.defaultTeamsAddress || 'none') + '; Teams posts: ' + (c.teamsStyle === 'full' ? 'full email text' : 'compact') + (c.teamsStyle !== 'full' && c.teamsAttachEmailPdf ? ', email text attached as a PDF' : ''));
    out.push('Review notices to: ' + (list_(c.reviewRecipients).join(', ') || 'each store\'s own Gmail'));
    out.push('Copy of everything to: ' + (c.auditCopyAddress || 'none'));
    out.push('Keywords: ' + (list_(c.keywords).join(', ') || 'none') + (c.matchPoPatterns ? ', plus purchase order numbers' : ''));
    out.push('Found in subject: ' + rule(c.rules.subject) + '; attachment name: ' + rule(c.rules.attachment) +
      '; message text only: ' + rule(c.rules.body) + '; inside a PDF only: ' + rule(c.rules.pdf));
    out.push('Reads inside PDFs: ' + yn(c.readPdfText) + '; looks for wording inside PDFs: ' + yn(c.pdfWording));
    out.push('Exclusion phrases: ' + (list_(c.exclusionPhrases).join(', ') || 'none') + (c.exclusionCheckBody ? ' (subject and message text)' : ' (subject only)'));
    out.push('Works out the store from keywords: ' + yn(c.storeCheck !== false) + '; unsure emails: ' + (c.unsureAction === 'review' ? 'held for review in Gmail' : 'sent to Teams with a Check tag'));
    out.push('Duplicates: ' + ({ off: 'not checked', tag: 'posted to Teams with a duplicate tag', skip: 'sure duplicates skipped, possible ones tagged' }[c.dupMode || 'off'] || c.dupMode) + ' (looks back ' + (c.dupWindowHours || 48) + ' hours)');
    out.push('Never-forward senders: ' + (list_(c.excludedSenders).join(', ') || 'none') + '; only address book senders: ' + yn(c.onlyBookSenders));
    out.push('Checks Spam: ' + yn(c.checkSpam) + '; holds attachments from unknown senders: ' + yn(c.reviewUnknownAttachments));
    out.push('Attachment types: ' + list_(c.attachmentTypes).join(', ') + '; message text to PDF: ' + yn(c.bodyToPdf));
    (c.stores || []).forEach(function (s) {
      out.push('Store ' + s.name + ': Gmail ' + (s.gmail || 'none') + ', also receives at ' + (list_(s.receivingEmails).join(', ') || 'no other addresses') + ', fax ' + (s.faxNumber || 'none') +
        ', Teams ' + (s.teamsAddress || 'default') + ', keywords ' + (list_(s.keywords).join(', ') || 'none'));
    });
    (c.addressBook || []).forEach(function (e) {
      out.push('Sender ' + e.sender + (e.vendor ? ' (' + e.vendor + ')' : '') + ': ' +
        ({ forward: 'always forward', review: 'always hold for review', exclude: 'never forward' }[e.action] || e.action) +
        ', store ' + (e.store && e.store !== 'auto' ? storeName_(c, e.store) : 'detected automatically'));
    });
    out.push('Checks every ' + c.runEveryMinutes + ' minutes; label group ' + c.labelRoot + ' (' + (c.labelMode === 'detailed' ? 'detailed labels' : 'few labels') + (c.manualSendLabel ? ', with a Send label' : '') + '); log sheet: ' + yn(c.logToSheet));
    return out;
  }

  function configWarnings_(cfg) {
    var w = [];
    var stores = cfg.stores || [];
    var mode = cfg.deliveryMode || 'both';
    if (mode !== 'teams' && !faxConfigured_(cfg)) {
      w.push({ level: 'warn', text: 'The fax provider email format is still a placeholder, so nothing will be faxed yet.' +
        (mode === 'both' ? ' Invoices will still go to Teams.' : ' Invoices will be held for review instead.') });
    }
    if (!stores.length) w.push({ level: 'error', text: 'Add at least one store.' });
    var seen = {};
    var noKeywords = 0, noGmail = 0;
    stores.forEach(function (st, i) {
      var n = st.name || ('Store ' + (i + 1));
      var issues = [], level = 'warn';
      var g = String(st.gmail || '').trim().toLowerCase();
      if (!g) { issues.push('no Gmail address'); noGmail++; }
      else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g)) { issues.push('\u201c' + st.gmail + '\u201d isn\u2019t a valid email address'); level = 'error'; }
      else if (seen[g]) { issues.push('same Gmail address as ' + seen[g]); level = 'error'; }
      else seen[g] = n;
      var d = faxDigits_(st.faxNumber);
      if (mode !== 'teams') {
        if (!d) issues.push('no fax number');
        else if (d.length !== 10) issues.push('fax number has ' + d.length + ' digits instead of 10');
      }
      list_(st.receivingEmails).forEach(function (r) {

      });

    });

    });

    }

    });

  return {

<script>
var CORE_SRC = "/* ============================================================\n * CORE LOGIC - decides what happens to an email.\n * The setup page uses this same code for its \"Try an email\" tester.\n * ============================================================ */\nvar IFCore = (function () {\n  var IMAGE_EXT = ['png', 'jpg', 'jpeg', 'gif', 'bmp', 'tif', 'tiff', 'webp'];\n\n  // Purchase-order number variations: PO#, P.O. No., PO Number, PO Num, Purchase Order, PO 123456\n  var PO_PATTERNS = [\n    { label: 'PO number', re: /(?:^|[^A-Za-z0-9])p\\.?\\s?o\\.?\\s*(?:#|no\\.?(?![a-z])|num(?:ber)?\\.?(?![a-z])|nbr\\.?(?![a-z]))/i },\n    { label: 'purchase order', re: /(?:^|[^A-Za-z0-9])purchase\\s+order/i },\n    { label: 'PO number', re: /(?:^|[^A-Za-z0-9])P\\.?O\\.?\\s*[:#-]?\\s*\\d{4,}/ }\n  ];\n\n  function list_(v) {\n    if (!v) return [];\n    var arr = Array.isArray(v) ? v : String(v).split(/[\\n,;]+/);\n    return arr.map(function (s) { return String(s).trim(); }).filter(function (s) { return s.length > 0; });\n  }\n\n  function escRe_(s) { return String(s).replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'); }\n\n  // Matches a phrase at the start of a word. Short phrases (3 letters or fewer) must be a whole word.\n  function phraseRe_(phrase, wholeWord) {\n    var p = String(phrase).trim();\n    var body = escRe_(p).replace(/\\s+/g, '\\\\s+');\n    var whole = wholeWord || p.length <= 3;\n    return new RegExp('(?:^|[^A-Za-z0-9])' + body + (whole ? '(?![A-Za-z0-9])' : ''), 'i');\n  }\n\n  function invoiceHits_(cfg, text) {\n    var hits = [];\n    if (!text) return hits;\n    list_(cfg.keywords).forEach(function (k) {\n      if (phraseRe_(k, false).test(text)) hits.push(k);\n    });\n    if (cfg.matchPoPatterns) {\n      PO_PATTERNS.forEach(function (p) {\n        if (hits.indexOf(p.label) < 0 && p.re.test(text)) hits.push(p.label);\n      });\n    }\n    return hits;\n  }\n\n  function attachmentNames_(info) {\n    return (info.attachments || []).map(function (a) { return a.name || ''; });\n  }\n\n  function keywordMatches_(cfg, info) {\n    var names = attachmentNames_(info).join('\\n').replace(/[_\\-.]+/g, ' ');\n    return {\n      subject: invoiceHits_(cfg, info.subject || ''),\n      attachment: invoiceHits_(cfg, names),\n      body: invoiceHits_(cfg, info.body || ''),\n      pdf: cfg.readPdfText && cfg.pdfWording ? invoiceHits_(cfg, info.pdfText || '') : []\n    };\n  }\n\n  function exclusionMatch_(cfg, info) {\n    var text = (info.subject || '') + (cfg.exclusionCheckBody ? '\\n' + (info.body || '') : '');\n    var phrases = list_(cfg.exclusionPhrases);\n    for (var i = 0; i < phrases.length; i++) {\n      if (phraseRe_(phrases[i], false).test(text)) return phrases[i];\n    }\n    return null;\n  }\n\n  function parseSender_(from) {\n    var raw = String(from || '');\n    var m = raw.match(/<([^>]+)>/);\n    var email = (m ? m[1] : raw).trim().toLowerCase();\n    var at = email.lastIndexOf('@');\n    return { email: email, domain: at >= 0 ? email.slice(at + 1) : '' };\n  }\n\n  function validSender_(pattern) {\n    var p = String(pattern || '').trim().toLowerCase().replace(/^@/, '');\n    if (!p) return false;\n    if (p.indexOf('@') >= 0) return /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(p);\n    return /^[a-z0-9-]+(\\.[a-z0-9-]+)+$/.test(p);\n  }\n\n  function senderMatches_(pattern, email, domain) {\n    var p = String(pattern || '').trim().toLowerCase().replace(/^@/, '');\n    if (!p) return false;\n    if (p.indexOf('@') >= 0) return p === email;\n    return domain === p || (domain.length > p.length && domain.slice(-(p.length + 1)) === '.' + p);\n  }\n\n  // Exact email entries win over domain entries; longer domains win over shorter ones.\n  function findBookEntry_(cfg, email, domain) {\n    var book = (cfg.addressBook || []).filter(function (e) { return e && e.sender; });\n    var exact = book.filter(function (e) { return String(e.sender).indexOf('@') > 0 && senderMatches_(e.sender, email, domain); });\n    if (exact.length) return exact[0];\n    var doms = book.filter(function (e) { return String(e.sender).replace(/^@/, '').indexOf('@') < 0 && senderMatches_(e.sender, email, domain); });\n    doms.sort(function (a, b) { return String(b.sender).length - String(a.sender).length; });\n    return doms[0] || null;\n  }\n\n  function storeById_(cfg, id) {\n    var s = (cfg.stores || []).filter(function (x) { return x.id === id; });\n    return s[0] || null;\n  }\n\n  function storeName_(cfg, id) {\n    var s = storeById_(cfg, id);\n    return s ? (s.name || s.id) : id;\n  }\n\n  // Store keywords in the subject, message text or attachment names win over ones found only inside a PDF.\n  function storeHits_(cfg, info) {\n    var text = [info.subject || '', info.body || '', attachmentNames_(info).join(' ').replace(/[_\\-.]+/g, ' ')].join('\\n');\n    var pdf = cfg.readPdfText ? String(info.pdfText || '') : '';\n    var inText = [], inPdf = [];\n    (cfg.stores || []).forEach(function (s) {\n      var kws = list_(s.keywords);\n      var textHit = null, pdfHit = null;\n      for (var i = 0; i < kws.length; i++) {\n        var re = phraseRe_(kws[i], true);\n        if (!textHit && re.test(text)) textHit = kws[i];\n        if (!pdfHit && pdf && re.test(pdf)) pdfHit = kws[i];\n      }\n      if (textHit) inText.push({ store: s, keyword: textHit, inPdf: false });\n      else if (pdfHit) inPdf.push({ store: s, keyword: pdfHit, inPdf: true });\n    });\n    return inText.length ? inText : inPdf;\n  }\n\n  function emailsIn_(v) {\n    var out = [];\n    (Array.isArray(v) ? v : [v]).forEach(function (x) {\n      String(x || '').replace(/[A-Za-z0-9._%+'-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/g, function (m) {\n        m = m.toLowerCase();\n        if (out.indexOf(m) < 0) out.push(m);\n        return m;\n      });\n    });\n    return out;\n  }\n\n  // Every address that belongs to a store: its Gmail plus any other invoice receiving addresses.\n  function storeAddresses_(st) {\n    return emailsIn_([st.gmail || ''].concat(list_(st.receivingEmails)));\n  }\n\n  // Stores whose addresses appear among the email's recipients (To, Cc, Delivered-To).\n  function recipientStores_(cfg, info) {\n    var rec = emailsIn_(info.recipients || []);\n    var hits = [];\n    if (!rec.length) return hits;\n    (cfg.stores || []).forEach(function (st) {\n      var mine = storeAddresses_(st);\n      for (var i = 0; i < rec.length; i++) {\n        if (mine.indexOf(rec[i]) >= 0) { hits.push({ store: st, address: rec[i] }); break; }\n      }\n    });\n    return hits;\n  }\n\n  // The store an inbox belongs to: the one whose Gmail or receiving addresses include it. Null if none or several.\n  function homeStoreFor_(cfg, account) {\n    var a = String(account || '').trim().toLowerCase();\n    if (!a) return null;\n    var byGmail = (cfg.stores || []).filter(function (st) { return String(st.gmail || '').trim().toLowerCase() === a; });\n    if (byGmail.length === 1) return byGmail[0];\n    var byAny = (cfg.stores || []).filter(function (st) { return storeAddresses_(st).indexOf(a) >= 0; });\n    return byAny.length === 1 ? byAny[0] : null;\n  }\n\n  function route_(cfg, info, book, env) {\n    env = env || {};\n    if (book && book.store && book.store !== 'auto' && storeById_(cfg, book.store)) {\n      return { kind: 'book', storeIds: [book.store], reason: 'The address book sends this sender to ' + storeName_(cfg, book.store) };\n    }\n    var hits = cfg.storeCheck === false ? [] : storeHits_(cfg, info);\n    if (hits.length === 1) {\n      return { kind: 'keyword', storeIds: [hits[0].store.id], reason: 'It mentions \\u201c' + hits[0].keyword + '\\u201d, a keyword for ' + (hits[0].store.name || hits[0].store.id) + (hits[0].inPdf ? ' (found inside the PDF)' : '') };\n    }\n    if (hits.length > 1) {\n      var names = hits.map(function (h) { return h.store.name || h.store.id; }).join(', ');\n      var ids = hits.map(function (h) { return h.store.id; });\n      if (cfg.multiStoreMatch === 'all') return { kind: 'keyword', storeIds: ids, reason: 'It mentions several stores (' + names + '), so it goes to each' };\n      return { kind: 'multi', storeIds: ids, problem: 'It mentions more than one store (' + names + ')' };\n    }\n    var rec = recipientStores_(cfg, info);\n    if (rec.length === 1) {\n      return { kind: 'recipient', storeIds: [rec[0].store.id], reason: 'It was sent to ' + rec[0].address + ', a receiving address for ' + (rec[0].store.name || rec[0].store.id) };\n    }\n    if (rec.length > 1) {\n      var recIds = rec.map(function (h) { return h.store.id; });\n      if (env.homeStoreId && recIds.indexOf(env.homeStoreId) >= 0) {\n        return { kind: 'home', storeIds: [env.homeStoreId], reason: 'It was sent to several stores\\u2019 addresses, so this inbox\\u2019s store (' + storeName_(cfg, env.homeStoreId) + ') gets its copy' };\n      }\n      var recNames = rec.map(function (h) { return h.store.name || h.store.id; }).join(', ');\n      if (cfg.multiStoreMatch === 'all') return { kind: 'recipient', storeIds: recIds, reason: 'It was sent to addresses for several stores (' + recNames + '), so it goes to each' };\n      return { kind: 'multi', storeIds: recIds, problem: 'It was sent to addresses for more than one store (' + recNames + ')' };\n    }\n    if (env.homeStoreId && storeById_(cfg, env.homeStoreId)) {\n      return { kind: 'home', storeIds: [env.homeStoreId], reason: 'No store keyword found, so it goes to the store whose Gmail received it (' + storeName_(cfg, env.homeStoreId) + ')' };\n    }\n    if (cfg.fallbackStoreId && storeById_(cfg, cfg.fallbackStoreId)) {\n      return { kind: 'fallback', storeIds: [cfg.fallbackStoreId], reason: 'No store keyword found, so it goes to the fallback store (' + storeName_(cfg, cfg.fallbackStoreId) + ')' };\n    }\n    return { kind: 'none', storeIds: [], problem: 'It isn\\u2019t clear which store this is for' };\n  }\n\n  function ext_(name) {\n    var m = /\\.([A-Za-z0-9]+)$/.exec(name || '');\n    return m ? m[1].toLowerCase() : '';\n  }\n\n  function forwardableFiles_(cfg, atts) {\n    var types = list_(cfg.attachmentTypes).map(function (t) { return t.replace(/^\\./, '').toLowerCase(); });\n    var minImg = (Number(cfg.minImageKB) || 0) * 1024;\n    return (atts || []).filter(function (a) {\n      var e = ext_(a.name);\n      if (types.indexOf(e) < 0) return false;\n      if (IMAGE_EXT.indexOf(e) >= 0 && a.size != null && a.size < minImg) return false;\n      return true;\n    });\n  }\n\n  function faxConfigured_(cfg) {\n    var t = String(cfg.faxAddressTemplate || '');\n    return t.indexOf('{number}') >= 0 && t.indexOf('@') > 0 && !/replace|your-fax|example\\./i.test(t);\n  }\n\n  function faxDigits_(number) {\n    var d = String(number || '').replace(/\\D/g, '');\n    if (d.length === 11 && d.charAt(0) === '1') d = d.slice(1);\n    return d;\n  }\n\n  function faxAddress_(cfg, number) {\n    var d = faxDigits_(number);\n    return d ? String(cfg.faxAddressTemplate || '').replace('{number}', d) : '';\n  }\n\n  function faxDomain_(cfg) {\n    if (!faxConfigured_(cfg)) return '';\n    var t = String(cfg.faxAddressTemplate);\n    return t.slice(t.lastIndexOf('@') + 1).toLowerCase();\n  }\n\n  // opts.includePending = also list fax addresses that can't be used yet (for display only)\n  function destinationsFor_(cfg, store, opts) {\n    var out = [];\n    if (!store) return out;\n    var mode = cfg.deliveryMode || 'both';\n    if (mode !== 'teams' && faxDigits_(store.faxNumber)) {\n      if (faxConfigured_(cfg)) out.push({ kind: 'fax', address: faxAddress_(cfg, store.faxNumber) });\n      else if (opts && opts.includePending) out.push({ kind: 'fax-pending', address: faxAddress_(cfg, store.faxNumber) });\n    }\n    if (mode !== 'fax') {\n      var t = String(store.teamsAddress || '').trim() || String(cfg.defaultTeamsAddress || '').trim();\n      if (t) out.push({ kind: 'teams', address: t });\n    }\n    return out;\n  }\n\n  // Works out stores, files and destinations. forcedStoreId is used when staff pick a store by label.\n  function plan_(cfg, info, env, forcedStoreId) {\n    var s = parseSender_(info.from);\n    var book = findBookEntry_(cfg, s.email, s.domain);\n    var r = forcedStoreId ? { kind: 'staff', storeIds: [forcedStoreId], reason: 'Staff chose ' + storeName_(cfg, forcedStoreId) } : route_(cfg, info, book, env);\n    var files = forwardableFiles_(cfg, info.attachments);\n    var plan = {\n      storeIds: r.storeIds,\n      routeKind: r.kind || '',\n      routeReason: r.reason || '',\n      problem: r.problem || '',\n      problemKind: r.problem ? 'store' : '',\n      files: files,\n      bodyAsPdf: !!cfg.bodyToPdf && (files.length === 0 || !!cfg.alwaysIncludeBody)\n    };\n    if (!plan.problem) {\n      var noDest = plan.storeIds.filter(function (id) { return destinationsFor_(cfg, storeById_(cfg, id)).length === 0; });\n      if (noDest.length) {\n        plan.problemKind = 'blocked';\n        plan.problem = 'There\\u2019s no working fax or Teams address for ' + noDest.map(function (id) { return storeName_(cfg, id); }).join(', ') +\n          (faxConfigured_(cfg) ? '' : ' yet (the fax provider address is still a placeholder)');\n      }\n    }\n    if (!plan.problem && files.length === 0 && !plan.bodyAsPdf) {\n      plan.problemKind = 'blocked';\n      plan.problem = 'There\\u2019s nothing to send: no attachment, and \\u201cturn the message text into a PDF\\u201d is off';\n    }\n    return plan;\n  }\n\n  function where_(kw) {\n    var parts = [];\n    if (kw.subject.length) parts.push('the subject (' + kw.subject.join(', ') + ')');\n    if (kw.attachment.length) parts.push('an attachment name (' + kw.attachment.join(', ') + ')');\n    if (kw.body.length) parts.push('the message text (' + kw.body.join(', ') + ')');\n    if (kw.pdf && kw.pdf.length) parts.push('the text inside a PDF (' + kw.pdf.join(', ') + ')');\n    if (parts.length <= 1) return parts.join('');\n    return parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1];\n  }\n\n  /**\n   * The main decision. Returns:\n   *   action: 'send' | 'review' | 'exclude' | 'ignore'\n   *   reasons: plain-language list of why\n   *   storeIds, files, bodyAsPdf: what would be sent where\n   * env: { trusted: [emails], blocked: [emails], homeStoreId: 's1', inSpam: bool }\n   */\n  function decide_(cfg, info, env) {\n    env = env || {};\n    var s = parseSender_(info.from);\n    var kw = keywordMatches_(cfg, info);\n    var any = kw.subject.length + kw.attachment.length + kw.body.length + kw.pdf.length > 0;\n    var book = findBookEntry_(cfg, s.email, s.domain);\n    var vendor = book && book.vendor ? ' (' + book.vendor + ')' : '';\n    var blocked = (env.blocked || []).indexOf(s.email) >= 0;\n    var trusted = (env.trusted || []).indexOf(s.email) >= 0;\n    var res = { action: 'ignore', reasons: [], flags: [], keywordHits: kw, sender: s.email, bookEntry: book, storeIds: [], files: [], bodyAsPdf: false,\n      routeReason: '', routeKind: '', locked: false, storeUnsure: false, blocked: false, teamsOnly: false, teamsTargets: [] };\n\n    var neverSender = list_(cfg.excludedSenders).filter(function (p) { return senderMatches_(p, s.email, s.domain); })[0];\n    if (neverSender && !(book && book.action === 'forward')) {\n      res.action = any ? 'exclude' : 'ignore';\n      res.locked = true;\n      res.reasons.push('The sender is on the never-forward list (' + neverSender + ')');\n      return res;\n    }\n\n    if (blocked || (book && book.action === 'exclude')) {\n      res.action = any ? 'exclude' : 'ignore';\n      res.locked = true;\n      res.reasons.push(blocked ? 'Staff blocked this sender with the Block Sender label' : 'This sender is set to \\u201cnever forward\\u201d in the address book' + vendor);\n      return res;\n    }\n\n    if (book && book.action === 'forward') {\n      res.action = 'send';\n      res.reasons.push('This sender is in the address book' + vendor + ' as \\u201calway

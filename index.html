Context_(isDryRun);\n    if (!ctx.dryRun) processStaffLabels_(ctx);\n    scanNewMail_(ctx);\n    finish_(ctx);\n  } catch (e) {\n    console.error((e && e.stack) || e);\n    if (ctx && !ctx.dryRun) notifyFatal_(ctx, e);\n    throw e;\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction newContext_(isDryRun) {\n  var account = currentAccount_();\n  return {\n    dryRun: isDryRun, started: Date.now(), state: loadState_(), account: account, home: homeStore_(account),\n    labels: {}, review: [], sent: [], errors: [], excluded: [], staff: [], logRows: [], report: [], notes: [],\n    scanned: 0, stoppedEarly: false\n  };\n}\n\nfunction env_(ctx, inSpam) {\n  return { trusted: ctx.state.trusted, blocked: ctx.state.blocked, homeStoreId: ctx.home ? ctx.home.id : '', inSpam: !!inSpam };\n}\n\nfunction timeLeft_(ctx) { return (Date.now() - ctx.started) < (Number(CONFIG.maxRunSeconds) || 270) * 1000; }\n\nfunction scanNewMail_(ctx) {\n  var p = ctx.state.props;\n  var now = Date.now();\n  var last = Number(p.getProperty(P_LAST)) || 0;\n  var since;\n  if (ctx.dryRun) since = now - (Number(CONFIG.dryRunHours) || 72) * 3600000;\n  else if (!last) since = now - (Number(CONFIG.firstRunLookbackHours) || 0) * 3600000 - 15 * 60000;\n  else since = last - 15 * 60000; // small overlap so nothing slips between runs\n\n  var base = 'after:' + Math.floor(since / 1000) + ' -in:sent -in:drafts -in:chats -from:me';\n  var passes = [{ q: base, spam: false }];\n  if (CONFIG.checkSpam) passes.push({ q: base + ' in:spam', spam: true });\n\n  for (var pi = 0; pi < passes.length && !ctx.stoppedEarly; pi++) {\n    var start = 0, pageSize = 50;\n    while (!ctx.stoppedEarly) {\n      var threads = GmailApp.search(passes[pi].q, start, pageSize);\n      if (!threads.length) break;\n      for (var i = 0; i < threads.length && !ctx.stoppedEarly; i++) {\n        var th = threads[i];\n        var msgs = th.getMessages();\n        for (var j = 0; j < msgs.length; j++) {\n          var m = msgs[j];\n          if (m.getDate().getTime() <= since) continue;\n          if (m.isInTrash() || m.isDraft()) continue;\n          if (ctx.state.handled[m.getId()]) continue;\n          if (!timeLeft_(ctx)) { ctx.stoppedEarly = true; break; }\n          handleNew_(ctx, m, th, passes[pi].spam);\n          ctx.scanned++;\n        }\n      }\n      if (threads.length < pageSize) break;\n      start += pageSize;\n      if (start >= 500) { ctx.stoppedEarly = true; break; }\n    }\n  }\n  if (!ctx.dryRun && !ctx.stoppedEarly) p.setProperty(P_LAST, String(now));\n  if (ctx.stoppedEarly) ctx.notes.push('This run ran out of time before checking every new email. The next run continues where it left off.');\n}\n\nfunction handleNew_(ctx, msg, thread, inSpam) {\n  var info = extractInfo_(msg);\n  if (isSystemMessage_(info)) return;\n  var d = IFCore.decide_(CONFIG, info, env_(ctx, inSpam));\n  if (!inSpam && IFCore.needsPdfText_(CONFIG, info, d)) {\n    info.pdfText = readPdfText_(ctx, info);\n    if (info.pdfText) d = IFCore.decide_(CONFIG, info, env_(ctx, inSpam));\n  }\n  if (inSpam && d.action === 'exclude') d.action = 'ignore';\n  if (d.action === 'ignore') return;\n\n  var dc = null;\n  if (d.action === 'send' && CONFIG.dupMode && CONFIG.dupMode !== 'off') {\n    dc = dupCheck_(ctx, msg, info, d);\n    if (dc && dc.level) applyDup_(ctx, d, dc);\n  }\n\n  if (ctx.dryRun) { ctx.report.push({ info: info, d: d }); return; }\n\n  ctx.state.handled[info.id] = Math.floor(Date.now() / 1000);\n  if (d.dupSkip) {\n    addResultLabel_(ctx, thread, 'dupSkipped');\n    ctx.dupSkipped = (ctx.dupSkipped || 0) + 1;\n    log_(ctx, info, 'Skipped: duplicate', d, '', thread);\n    finishDup_(dc, 'skipped duplicate');\n    return;\n  }\n  if (d.action === 'exclude') {\n    addResultLabel_(ctx, thread, 'excluded');\n    ctx.excluded.push(info);\n    log_(ctx, info, 'Excluded', d, '', thread);\n  } else if (d.action === 'review') {\n    addResultLabel_(ctx, thread, 'review');\n    ctx.review.push({ info: info, d: d, link: thread.getPermalink() });\n    log_(ctx, info, 'Needs review', d, '', thread);\n    finishDup_(dc, 'held for review');\n  } else {\n    var ok = deliverAndLabel_(ctx, msg, info, d, thread);\n    finishDup_(dc, ok ? (d.dupLevel ? 'posted, tagged duplicate' : 'posted') : 'failed');\n  }\n}\n\n/* ---------- Staff decisions made with labels ---------- */\n\nfunction processStaffLabels_(ctx) {\n  var n = labelNames_();\n  var jobs = [\n    { name: n.send, kind: 'send' }, { name: n.trust, kind: 'trust' },\n    { name: n.notInvoice, kind: 'dismiss' }, { name: n.block, kind: 'block' }\n  ];\n  (CONFIG.stores || []).forEach(function (s) { jobs.push({ name: storeLabelName_(s), kind: 'sendTo', storeId: s.id }); });\n\n  jobs.forEach(function (job) {\n    var label = findLabel_(job.name);\n    if (!label) return;\n    label.getThreads(0, 25).forEach(function (th) {\n      if (!timeLeft_(ctx)) { ctx.stoppedEarly = true; return; }\n      var msg = pickMessage_(ctx, th);\n      th.removeLabel(label);\n      removeIfPresent_(th, n.review);\n      removeIfPresent_(th, n.error);\n      if (!msg) return;\n      var info = extractInfo_(msg);\n      var sender = IFCore.parseSender_(info.from).email;\n      ctx.state.handled[info.id] = Math.floor(Date.now() / 1000);\n\n      if (job.kind === 'dismiss' || job.kind === 'block') {\n        if (job.kind === 'block' && sender) {\n          addUnique_(ctx.state.blocked, sender);\n          removeItem_(ctx.state.trusted, sender);\n        }\n        addResultLabel_(ctx, th, 'dismissed');\n        ctx.staff.push((job.kind === 'block' ? 'Blocked sender ' + sender + ': ' : 'Marked not an invoice: ') + info.subject);\n        log_(ctx, info, job.kind === 'block' ? 'Dismissed + blocked sender' : 'Dismissed by staff', null, '', th);\n        return;\n      }\n      if (job.kind === 'trust' && sender) {\n        addUnique_(ctx.state.trusted, sender);\n        removeItem_(ctx.state.blocked, sender);\n      }\n      var plan = IFCore.plan_(CONFIG, info, env_(ctx), job.kind === 'sendTo' ? job.storeId : null);\n      if (IFCore.needsPdfText_(CONFIG, info, { action: 'send', routeKind: plan.routeKind })) {\n        info.pdfText = readPdfText_(ctx, info);\n        if (info.pdfText) plan = IFCore.plan_(CONFIG, info, env_(ctx), null);\n      }\n      if (plan.problem) {\n        addResultLabel_(ctx, th, 'error');\n        var msgText = plan.problem + (CONFIG.labelMode === 'detailed' ? '. To pick the store yourself, apply the label \"' + n.sendTo + '/<store name>\".' :\n          '. Forward it by hand, or add a store keyword or receiving address on the setup page.');\n        ctx.errors.push({ info: info, error: msgText, link: th.getPermalink() });\n        log_(ctx, info, 'Error', { reasons: [msgText], storeIds: plan.storeIds }, '', th);\n        return;\n      }\n      plan.action = 'send';\n      plan.reasons = ['Staff applied the label \"' + job.name + '\"'];\n      deliverAndLabel_(ctx, msg, info, plan, th);\n      ctx.staff.push('Sent after staff review: ' + info.subject);\n    });\n  });\n}\n\n// Newest message in the thread that wasn't sent by this account.\nfunction pickMessage_(ctx, thread) {\n  var msgs = thread.getMessages();\n  for (var i = msgs.length - 1; i >= 0; i--) {\n    if (IFCore.parseSender_(msgs[i].getFrom()).email !== ctx.account) return msgs[i];\n  }\n  return msgs.length ? msgs[msgs.length - 1] : null;\n}\n\n/* ---------- Sending ---------- */\n\nfunction deliverAndLabel_(ctx, msg, info, d, thread) {\n  try {\n    var sentTo = deliver_(ctx, msg, info, d, thread);\n    addResultLabel_(ctx, thread, d.teamsOnly ? 'flagged' : 'sent');\n    ctx.sent.push({ info: info, to: sentTo });\n    log_(ctx, info, d.dupLevel ? 'Sent to Teams, tagged duplicate' : d.teamsOnly ? 'Sent to Teams, tagged Check' : 'Sent', d, sentTo.join('; '), thread);\n    return true;\n  } catch (e) {\n    addResultLabel_(ctx, thread, 'error');\n    ctx.errors.push({ info: info, error: String((e && e.message) || e), link: thread.getPermalink() });\n    log_(ctx, info, 'Error', d, String((e && e.message) || e), thread);\n    return false;\n  }\n}\n\nfunction deliver_(ctx, msg, info, d, thread) {\n  var blobs = [];\n  if (d.bodyAsPdf) blobs.push(bodyToPdf_(msg, info));\n  (d.files || []).forEach(function (f) { blobs.push(f.blob.copyBlob().setName(f.name)); });\n  if (!blobs.length) throw new Error('Nothing to send.');\n  var total = 0;\n  blobs.forEach(function (b) { total += b.getBytes().length; });\n  if (total > 20 * 1024 * 1024) throw new Error('The attachments are over 20 MB, which is too large to send by email.');\n\n  var sentTo = [], failures = [];\n  var opts = { attachments: blobs, name: CONFIG.senderName || 'Invoice Forwarder' };\n  var teamsBlobs = blobs;\n  if (CONFIG.teamsStyle !== 'full' && CONFIG.teamsAttachEmailPdf && !d.bodyAsPdf) {\n    try {\n      var textPdf = bodyToPdf_(msg, info);\n      teamsBlobs = blobs.concat([textPdf.setName('Email text - ' + textPdf.getName())]);\n    } catch (e) { console.warn('Could not turn the email text into a PDF for Teams: ' + e); }\n  }\n  var teamsOpts = { attachments: teamsBlobs, name: CONFIG.senderName || 'Invoice Forwarder' };\n  if (d.teamsOnly) {\n    // Unsure: Teams only, with a short highlighted Check line. Never faxed.\n    var fOpts = { attachments: teamsBlobs, name: CONFIG.senderName || 'Invoice Forwarder', htmlBody: flaggedHtml_(info, d) };\n    (d.teamsTargets || []).forEach(function (addr) {\n      try {\n        GmailApp.sendEmail(addr, flaggedSubject_(info, d), flaggedText_(info, d), fOpts);\n        sentTo.push('Teams (tagged Check)');\n      } catch (e) { failures.push('Teams ' + addr + ' (' + ((e && e.message) || e) + ')'); }\n    });\n  }\n  (d.teamsOnly ? [] : (d.storeIds || [])).forEach(function (id) {\n    var store = IFCore.storeById_(CONFIG, id);\n    IFCore.destinationsFor_(CONFIG, store).forEach(function (dest) {\n      try {\n        if (dest.kind === 'fax') {\n          GmailApp.sendEmail(dest.address, subjectFor_(store, info), CONFIG.faxBodyText || '', opts);\n        } else {\n          GmailApp.sendEmail(dest.address, subjectFor_(store, info), teamsText_(ctx, store, info, d, thread), teamsOpts);\n        }\n        sentTo.push(store.name + ' ' + dest.kind);\n      } catch (e) {\n        failures.push(store.name + ' ' + dest.kind + ' (' + ((e && e.message) || e) + ')');\n      }\n    });\n    if (CONFIG.deliveryMode !== 'teams' && !IFCore.faxConfigured_(CONFIG)) {\n      addUnique_(ctx.notes, 'Faxes were skipped because the fax provider email address is still a placeholder on the setup page.');\n    }\n  });\n  if (CONFIG.auditCopyAddress) {\n    try {\n      GmailApp.sendEmail(CONFIG.auditCopyAddress, subjectFor_(IFCore.storeById_(CONFIG, d.storeIds[0]), info),\n        detailsText_(ctx, null, info, d, thread), opts);\n    } catch (e) { failures.push('audit copy (' + ((e && e.message) || e) + ')'); }\n  }\n  if (failures.length) throw new Error('Sent to: ' + (sentTo.join(', ') || 'nothing') + '. Failed: ' + failures.join(', '));\n  if (!sentTo.length) throw new Error('No working destination for this store.');\n  return sentTo;\n}\n\nfunction tagWords_(d) {\n  var tags = [];\n  if (d.dupLevel) tags.push(d.dupLevel === 'high' ? 'DUPLICATE' : 'POSSIBLE DUPLICATE');\n  var other = (d.flags || []).filter(function (f) { return f.indexOf('duplicate') < 0; });\n  if (d.storeUnsure) tags.push('CHECK STORE');\n  else if (other.length) tags.push('CHECK');\n  return tags.length ? tags : ['CHECK'];\n}\n\nfunction flaggedSubject_(info, d) {\n  var stores = (d.storeIds || []).map(function (id) { return IFCore.storeName_(CONFIG, id); });\n  var s = (CONFIG.systemTag || '[Invoice Forwarder]') + ' \\u26a0 ' + tagWords_(d).join(' + ') + ': ' +\n    (!d.storeUnsure && stores.length ? stores.join(', ') + ': ' : '') + (info.subject || '(no subject)');\n  return s.length > 180 ? s.slice(0, 177) + '...' : s;\n}\n\nfunction flagLine_(d) {\n  var f = (d.flags || []).filter(function (x, i, a) { return a.indexOf(x) === i; }).join('; ');\n  return f ? f.charAt(0).toUpperCase() + f.slice(1) + '.' : 'Please double-check this one.';\n}\n\nfunction whenText_(info) {\n  try { return Utilities.formatDate(info.date, Session.getScriptTimeZone(), 'MMM d, h:mm a'); } catch (e) { return String(info.date); }\n}\n\nfunction flaggedText_(info, d) {\n  return '\\u26a0 ' + tagWords_(d).join(' + ') + ': ' + flagLine_(d) + '\\nFrom ' + info.from + ', received ' + whenText_(info);\n}\n\nfunction flaggedHtml_(info, d) {\n  var guess = d.storeIds && d.storeIds.length ? ' Best guess: ' + d.storeIds.map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(' or ') + '.' : '';\n  var badge = tagWords_(d).map(function (t) { return t.charAt(0) + t.slice(1).toLowerCase(); }).join(' + ');\n  var html = '<p><span style=\"background:#FCEFD8;color:#6E4100;font-weight:bold;padding:2px 8px;border-radius:4px\">\\u26a0 ' + esc_(badge) + '<\/span> ' +\n    esc_(flagLine_(d) + guess) + '<\/p><p style=\"color:#555555\">From ' + esc_(info.from) + ', received ' + esc_(whenText_(info)) + '<\/p>';\n  if (CONFIG.teamsStyle === 'full') html += '<pre style=\"white-space:pre-wrap;font-family:Arial,sans-serif\">' + esc_(String(info.body || '').slice(0, 3000)) + '<\/pre>';\n  return html;\n}\n\nfunction subjectFor_(store, info) {\n  var s = (CONFIG.systemTag || '[Invoice Forwarder]') + ' ' + (store ? store.name + ': ' : '') + (info.subject || '(no subject)');\n  return s.length > 180 ? s.slice(0, 177) + '...' : s;\n}\n\n// Teams shows the whole email in the channel, so by default the post is kept to one or two lines:\n// the subject (in the title), who sent it and when, plus the attachments.\nfunction teamsText_(ctx, store, info, d, thread) {\n  if (CONFIG.teamsStyle === 'full') return detailsText_(ctx, store, info, d, thread);\n  var when = String(info.date);\n  try { when = Utilities.formatDate(info.date, Session.getScriptTimeZone(), 'MMM d, h:mm a'); } catch (e) {}\n  var lines = ['From ' + info.from + ', received ' + when];\n  if (d.bodyAsPdf) lines.push('The invoice was in the email text; it is attached as a PDF.');\n  else if (CONFIG.teamsAttachEmailPdf) lines.push('The full email text is attached as a PDF.');\n  return lines.join('\\n');\n}\n\nfunction detailsText_(ctx, store, info, d, thread) {\n  var lines = [];\n  if (store) lines.push('Store: ' + store.name);\n  lines.push('From: ' + info.from);\n  lines.push('Received: ' + info.date);\n  lines.push('Subject: ' + info.subject);\n  lines.push('Why: ' + (d.reasons || []).concat(d.routeReason ? [d.routeReason] : []).join('; '));\n  lines.push('Received in: ' + ctx.account);\n  try { lines.push('Open in Gmail (signed in as ' + ctx.account + '): ' + thread.getPermalink()); } catch (e) {}\n  lines.push('----------');\n  lines.push(String(info.body || '').slice(0, 3000));\n  return lines.join('\\n');\n}\n\nfunction bodyToPdf_(msg, info) {\n  var html = '';\n  try { html = msg.getBody() || ''; } catch (e) {}\n  if (!html) html = '<pre style=\"white-space:pre-wrap;font-family:Arial,sans-serif\">' + esc_(info.body) + '<\/pre>';\n  var header = '<div style=\"font-family:Arial,sans-serif;font-size:10pt;border-bottom:1px solid #999;margin-bottom:12px;padding-bottom:8px\">' +\n    '<b>From:<\/b> ' + esc_(info.from) + '<br><b>Received:<\/b> ' + esc_(String(info.date)) + '<br><b>Subject:<\/b> ' + esc_(info.subject) + '<\/div>';\n  var doc = '<html><head><meta charset=\"utf-8\"><\/head><body>' + header + html + '<\/body><\/html>';\n  var name = String(info.subject || 'email').replace(/[^A-Za-z0-9 _-]+/g, '').trim().slice(0, 60) || 'email';\n  return Utilities.newBlob(doc, MimeType.HTML, 'email.html').getAs(MimeType.PDF).setName(name + '.pdf');\n}\n\n/* ---------- Review notices, log and state ---------- */\n\nfunction finish_(ctx) {\n  if (ctx.dryRun) { printDryRun_(ctx); return; }\n  saveState_(ctx.state);\n  writeLog_(ctx);\n  sendSummary_(ctx);\n  console.log('Checked ' + ctx.scanned + ' new emails. Sent: ' + ctx.sent.length + '. Skipped duplicates: ' + (ctx.dupSkipped || 0) + '. Needs review: ' + ctx.review.length +\n    '. Excluded: ' + ctx.excluded.length + '. Staff decisions: ' + ctx.staff.length + '. Errors: ' + ctx.errors.length + '.');\n  ctx.notes.forEach(function (n) { console.log('NOTE: ' + n); });\n}\n\nfunction printDryRun_(ctx) {\n  var hours = Number(CONFIG.dryRunHours) || 72;\n  console.log('DRY RUN for ' + ctx.account + (ctx.home ? ' (' + ctx.home.name + ')' : ' (not listed as a store)') +\n    ': last ' + hours + ' hours. Nothing was sent and no labels were changed.');\n  if (!ctx.report.length) console.log('No emails matched. If you expected some, check keywords or add the sender to the address book.');\n  ctx.report.forEach(function (r) {\n    var stores = r.d.storeIds.map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(', ') || '-';\n    var verb = r.d.dupSkip ? 'WOULD SKIP (SURE DUPLICATE)' : r.d.dupLevel ? 'WOULD SEND TO TEAMS, TAGGED ' + tagWords_(r.d).join(' + ') : r.d.teamsOnly ? 'WOULD SEND TO TEAMS, TAGGED CHECK' : ({ send: 'WOULD SEND', review: 'WOULD HOLD FOR REVIEW', exclude: 'WOULD EXCLUDE' }[r.d.action] || r.d.action);\n    console.log(verb + ' | to: ' + stores + ' | from: ' + r.info.from + ' | subject: ' + r.info.subject +\n      ' | why: ' + r.d.reasons.concat(r.d.routeReason ? [r.d.routeReason] : []).join('; '));\n  });\n  console.log('Checked ' + ctx.scanned + ' emails.');\n}\n\nfunction sendSummary_(ctx) {\n  if (!ctx.review.length && !ctx.errors.length) return;\n  var n = labelNames_();\n  var to = IFCore.list_(CONFIG.reviewRecipients);\n  if (!to.length) to = [ctx.account];\n  var who = ctx.account + (ctx.home ? ' (' + ctx.home.name + ')' : '');\n  var subject = (CONFIG.systemTag || '[Invoice Forwarder]') + ' ' +\n    (ctx.review.length ? ctx.review.length + ' to review' : '') + (ctx.review.length && ctx.errors.length ? ', ' : '') +\n    (ctx.errors.length ? ctx.errors.length + ' error' + (ctx.errors.length > 1 ? 's' : '') : '') + ' - ' + who;\n\n  var h = ['<div style=\"font-family:Arial,sans-serif;font-size:14px;color:#15232A\">'];\n  if (ctx.review.length) {\n    h.push('<h2 style=\"font-size:18px\">Emails that might be invoices<\/h2>');\n    h.push('<p>These arrived in <b>' + esc_(who) + '<\/b>. Open each one in Gmail while signed in to that account, then apply one label:<\/p>');\n    if (CONFIG.labelMode === 'detailed') {\n      h.push('<ul><li><b>' + esc_(n.send) + '<\/b>: it is an invoice, forward it (store picked automatically)<\/li>' +\n        '<li><b>' + esc_(n.sendTo) + '/&lt;store&gt;<\/b>: it is an invoice for that store<\/li>' +\n        '<li><b>' + esc_(n.trust) + '<\/b>: forward it, and always forward this sender<\/li>' +\n        '<li><b>' + esc_(n.notInvoice) + '<\/b>: not an invoice, ignore it<\/li>' +\n        '<li><b>' + esc_(n.block) + '<\/b>: not an invoice, and never forward this sender<\/li><\/ul>');\n    } else {\n      h.push('<ul><li><b>' + esc_(n.send) + '<\/b>: it is an invoice, forward it<\/li>' +\n        '<li><b>' + esc_(n.notInvoice) + '<\/b>: not an invoice, ignore it<\/li><\/ul>' +\n        '<p>Or simply forward it yourself and remove the ' + esc_(n.review) + ' label.<\/p>');\n    }\n    h.push(tableHtml_(ctx.review.map(function (r) {\n      return [r.info.from, r.info.subject, r.d.reasons.join('; '), r.d.storeIds.map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(', ') || '?', r.link];\n    }), ['From', 'Subject', 'Why it was held', 'Best guess', '']));\n  }\n  if (ctx.errors.length) {\n    h.push('<h2 style=\"font-size:18px\">Couldn\\'t send<\/h2><p>These have the label <b>' + esc_(n.error) + '<\/b>. Fix the problem, then apply <b>' + esc_(n.send) + '<\/b> to try again.<\/p>');\n    h.push(tableHtml_(ctx.errors.map(function (e) { return [e.info.from, e.info.subject, e.error, '', e.link]; }), ['From', 'Subject', 'Problem', '', '']));\n  }\n  ctx.notes.forEach(function (note) { h.push('<p style=\"color:#8a5a00\">' + esc_(note) + '<\/p>'); });\n  h.push('<p style=\"color:#667\">Sent by the Invoice Forwarder script, settings version ' + esc_(String(CONFIG.rev)) + '.<\/p><\/div>');\n\n  var plain = 'Open Gmail as ' + who + ' and look at the label \"' + n.review + '\".';\n  to.forEach(function (addr) {\n    try { GmailApp.sendEmail(addr, subject, plain, { htmlBody: h.join(''), name: CONFIG.senderName || 'Invoice Forwarder' }); }\n    catch (e) { console.error('Could not send review notice to ' + addr + ': ' + e); }\n  });\n}\n\nfunction tableHtml_(rows, heads) {\n  var cell = 'style=\"border:1px solid #ccd;padding:6px;vertical-align:top\"';\n  var out = '<table style=\"border-collapse:collapse;margin:8px 0 16px\"><tr>' +\n    heads.map(function (x) { return '<th ' + cell + ' align=\"left\">' + esc_(x) + '<\/th>'; }).join('') + '<\/tr>';\n  rows.forEach(function (r) {\n    out += '<tr>' + r.map(function (v, i) {\n      if (i === r.length - 1) return '<td ' + cell + '>' + (v ? '<a href=\"' + esc_(v) + '\">Open in Gmail<\/a>' : '') + '<\/td>';\n      return '<td ' + cell + '>' + esc_(v) + '<\/td>';\n    }).join('') + '<\/tr>';\n  });\n  return out + '<\/table>';\n}\n\nfunction notifyFatal_(ctx, e) {\n  try {\n    var p = PropertiesService.getScriptProperties();\n    var last = Number(p.getProperty(P_FATAL)) || 0;\n    if (Date.now() - last < 6 * 3600000) return; // at most one notice every 6 hours\n    p.setProperty(P_FATAL, String(Date.now()));\n    var to = IFCore.list_(CONFIG.reviewRecipients);\n    if (!to.length) to = [ctx.account];\n    to.forEach(function (addr) {\n      GmailApp.sendEmail(addr, (CONFIG.systemTag || '[Invoice Forwarder]') + ' The script stopped with an error - ' + ctx.account,\n        'The Invoice Forwarder in ' + ctx.account + ' hit an error and may not be forwarding invoices:\\n\\n' + ((e && e.message) || e) +\n        '\\n\\nOpen script.google.com as this account, open the project, and check Executions on the left.');\n    });\n  } catch (ignore) {}\n}\n\nfunction log_(ctx, info, result, d, sentTo, thread) {\n  if (!CONFIG.logToSheet || ctx.dryRun) return;\n  var stores = d && d.storeIds ? d.storeIds.map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(', ') : '';\n  var why = d ? (d.reasons || []).concat(d.routeReason ? [d.routeReason] : []).join('; ') : '';\n  var link = '';\n  try { link = thread.getPermalink(); } catch (e) {}\n  ctx.logRows.push([new Date(), result, info.from, info.subject, stores, sentTo || '', why, link]);\n}\n\nfunction writeLog_(ctx) {\n  if (!CONFIG.logToSheet || !ctx.logRows.length) return;\n  try {\n    var sh = getLogSheet_();\n    sh.getRange(sh.getLastRow() + 1, 1, ctx.logRows.length, ctx.logRows[0].length).setValues(ctx.logRows);\n  } catch (e) { console.error('Could not write to the log sheet: ' + e); }\n}\n\nfunction getLogSheet_() {\n  var p = PropertiesService.getScriptProperties();\n  var id = p.getProperty(P_SHEET), ss = null;\n  if (id) { try { ss = SpreadsheetApp.openById(id); } catch (e) { ss = null; } }\n  if (!ss) {\n    ss = SpreadsheetApp.create('Invoice Forwarder Log - ' + currentAccount_());\n    var first = ss.getSheets()[0];\n    first.setName('Log');\n    first.appendRow(['Time', 'Result', 'From', 'Subject', 'Store', 'Sent to / problem', 'Why', 'Gmail link']);\n    first.setFrozenRows(1);\n    p.setProperty(P_SHEET, ss.getId());\n  }\n  return ss.getSheetByName('Log') || ss.getSheets()[0];\n}\n\nfunction loadState_() {\n  var p = PropertiesService.getScriptProperties();\n  return {\n    props: p,\n    handled: readJson_(p, P_HANDLED, {}),\n    trusted: readJson_(p, P_TRUST, []),\n    blocked: readJson_(p, P_BLOCK, [])\n  };\n}\n\nfunction saveState_(st) {\n  var cutoff = Math.floor(Date.now() / 1000) - 4 * 86400;\n  var ids = Object.keys(st.handled).filter(function (k) { return st.handled[k] >= cutoff; })\n    .sort(function (a, b) { return st.handled[b] - st.handled[a]; }).slice(0, 200);\n  var h = {};\n  ids.forEach(function (k) { h[k] = st.handled[k]; });\n  st.props.setProperties({\n    HANDLED_IDS: JSON.stringify(h),\n    LEARNED_TRUSTED: JSON.stringify(st.trusted.slice(-150)),\n    LEARNED_BLOCKED: JSON.stringify(st.blocked.slice(-150))\n  });\n}\n\n/* ---------- Duplicate check across inboxes (uses the history Google Sheet) ---------- */\n// Every inbox running this script records what it forwards in the \"Forwarded invoices\" tab,\n// and checks that tab before posting, so the same invoice received by several people is posted once.\nvar DUP_TAB = 'Forwarded invoices';\nvar DUP_HEAD = ['Time', 'Result', 'Message ID', 'File fingerprints', 'Text fingerprint', 'Sender', 'Subject key', 'Store', 'Inbox', 'Subject', 'Duplicate of row', 'Match', 'Claim'];\n\nfunction dupSheet_(ctx) {\n  if (ctx.dupSheet !== undefined) return ctx.dupSheet;\n  ctx.dupSheet = null;\n  var url = String(CONFIG.historyDocUrl || '').trim();\n  if (!/\\/spreadsheets\\//.test(url)) {\n    addUnique_(ctx.notes, 'Duplicate checking is on, but the change history link is not a Google Sheet, so duplicates were not checked.');\n    return null;\n  }\n  try {\n    var ss = SpreadsheetApp.openByUrl(url);\n    var sh = ss.getSheetByName(DUP_TAB);\n    if (!sh && !ctx.dryRun) {\n      try { sh = ss.insertSheet(DUP_TAB); sh.appendRow(DUP_HEAD); sh.setFrozenRows(1); }\n      catch (e) { sh = ss.getSheetByName(DUP_TAB); } // another inbox created it at the same moment\n    }\n    ctx.dupSheet = sh || null;\n  } catch (e) {\n    addUnique_(ctx.notes, 'Duplicate checking could not open the history sheet (' + ((e && e.message) || e) + '). Make sure ' + ctx.account + ' has edit access to it.');\n  }\n  return ctx.dupSheet;\n}\n\nfunction hex_(bytes) {\n  return bytes.map(function (b) { var v = (b + 256) % 256; return (v < 16 ? '0' : '') + v.toString(16); }).join('');\n}\n\nfunction subjectKey_(subject) {\n  var s = String(subject || '').toLowerCase().split(String(CONFIG.systemTag || '[Invoice Forwarder]').toLowerCase()).join(' ');\n  var prev;\n  do {\n    prev = s;\n    s = s.replace(/^\\s*(re|fw|fwd|aw|wg)\\s*(\\[\\d+\\])?\\s*:\\s*/, '').replace(/^\\s*\\[[^\\]]*\\]\\s*/, '');\n  } while (s !== prev);\n  return s.replace(/\\s+/g, ' ').trim();\n}\n\nfunction normText_(body) {\n  return String(body || '').split(/\\r?\\n/).filter(function (line) {\n    var l = line.trim();\n    return l && l.charAt(0) !== '>' && !/^-+\\s*forwarded message\\s*-+$/i.test(l) && !/^(from|sent|date|to|cc|subject):/i.test(l);\n  }).join(' ').toLowerCase().replace(/\\s+/g, ' ').trim();\n}\n\nfunction fingerprint_(msg, info, d) {\n  var id = '';\n  try { id = String(msg.getHeader('Message-ID') || '').trim().toLowerCase(); } catch (e) {}\n  var files = [];\n  (d.files || []).forEach(function (f) {\n    try { files.push(hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, f.blob.getBytes()))); } catch (e) {}\n  });\n  var text = normText_(info.body);\n  var th = text.length >= 200 ? hex_(Utilities.computeDigest(Utilities.DigestAlgorithm.MD5, text, Utilities.Charset.UTF_8)) : '';\n  return { id: id, files: files, text: th, sender: IFCore.parseSender_(info.from).email, subj: subjectKey_(info.subject) };\n}\n\nfunction readDupRows_(sh, sinceMs) {\n  var last = sh.getLastRow();\n  if (last < 2) return [];\n  var start = Math.max(2, last - 999);\n  var vals = sh.getRange(start, 1, last - start + 1, DUP_HEAD.length).getValues();\n  var out = [];\n  vals.forEach(function (v, i) {\n    var t = v[0] instanceof Date ? v[0].getTime() : new Date(v[0]).getTime();\n    if (!(t >= sinceMs)) return;\n    if (String(v[1]) === 'failed') return;\n    out.push({ rowNum: start + i, time: v[0], result: String(v[1]), id: String(v[2] || ''), files: String(v[3] || '').split(' ').filter(String),\n      text: String(v[4] || ''), sender: String(v[5] || ''), subj: String(v[6] || ''), inbox: String(v[8] || ''), claim: String(v[12] || '') });\n  });\n  return out;\n}\n\n// 'high' = certainly the same invoice; 'potential' = probably; '' = different.\nfunction dupLevel_(fp, row) {\n  if (fp.id && row.id && fp.id === row.id) return 'high';\n  if (fp.files.length && row.files.length) {\n    return fp.files.some(function (h) { return row.files.indexOf(h) >= 0; }) ? 'high' : '';\n  }\n  if (!fp.files.length && !row.files.length && fp.text && row.text) {\n    return fp.text === row.text ? 'high' : '';\n  }\n  if (fp.subj && fp.subj.length >= 6 && fp.subj === row.subj) return 'potential';\n  return '';\n}\n\nfunction bestMatch_(fp, rows) {\n  var best = null;\n  rows.forEach(function (r) {\n    var lv = dupLevel_(fp, r);\n    if (!lv) return;\n    if (!best || (lv === 'high' && best.level !== 'high') || (lv === best.level && r.rowNum < best.row.rowNum)) best = { level: lv, row: r };\n  });\n  return best;\n}\n\nfunction dupCheck_(ctx, msg, info, d) {\n  var sh = dupSheet_(ctx);\n  var windowMs = (Number(CONFIG.dupWindowHours) || 48) * 3600000;\n  if (!sh) return null;\n  try {\n    var fp = fingerprint_(msg, info, d);\n    var rows = readDupRows_(sh, Date.now() - windowMs);\n    var before = bestMatch_(fp, rows);\n    if (ctx.dryRun) return before ? { level: before.level, match: before.row } : { level: '' };\n    // Record this copy, then look again: if another inbox recorded the same invoice first, this one is the duplicate.\n    var claim = Utilities.getUuid();\n    var stores = (d.storeIds || []).map(function (id) { return IFCore.storeName_(CONFIG, id); }).join(', ');\n    sh.appendRow([new Date(), 'checking', fp.id, fp.files.join(' '), fp.text, fp.sender, fp.subj, stores, ctx.account, info.subject, '', '', claim]);\n    SpreadsheetApp.flush();\n    if (!before || before.level !== 'high') Utilities.sleep(2500);\n    rows = readDupRows_(sh, Date.now() - windowMs);\n    var mine = rows.filter(function (r) { return r.claim === claim; })[0];\n    var myRow = mine ? mine.rowNum : sh.getLastRow();\n    var best = bestMatch_(fp, rows.filter(function (r) { return r.rowNum < myRow; }));\n    return { level: best ? best.level : '', match: best ? best.row : null, row: myRow, sh: sh };\n  } catch (e) {\n    addUnique_(ctx.notes, 'The duplicate check hit a problem (' + ((e && e.message) || e) + '), so invoices were posted without it.');\n    return null;\n  }\n}\n\nfunction applyDup_(ctx, d, dc) {\n  var when = dc.match.time;\n  try { when = Utilities.formatDate(new Date(dc.match.time), Session.getScriptTimeZone(), 'MMM d, h:mm a'); } catch (e) {}\n  var where = dc.match.inbox && dc.match.inbox !== ctx.account ? ' from ' + dc.match.inbox : '';\n  if (dc.level === 'high' && CONFIG.dupMode === 'skip') {\n    d.dupSkip = true;\n    d.reasons.push('The same invoice was already forwarded ' + when + where + ' (row ' + dc.match.rowNum + ' of the Forwarded invoices tab)');\n    return;\n  }\n  d.dupLevel = dc.level;\n  d.flags = (d.flags || []).concat([(dc.level === 'high' ? 'duplicate: the same invoice was already posted ' : 'possible duplicate of one posted ') + when + where]);\n  d.reasons.push((dc.level === 'high' ? 'Sure duplicate' : 'Possible duplicate') + ' of row ' + dc.match.rowNum + ' of the Forwarded invoices tab');\n  if (!d.teamsOnly) {\n    var targets = [];\n    if (CONFIG.deliveryMode !== 'fax') {\n      (d.storeIds || []).forEach(function (id) {\n        var st = IFCore.storeById_(CONFIG, id);\n        var a = String((st && st.teamsAddress) || CONFIG.defaultTeamsAddress || '').trim();\n        if (a && targets.indexOf(a) < 0) targets.push(a);\n      });\n      if (!targets.length && CONFIG.defaultTeamsAddress) targets.push(String(CONFIG.defaultTeamsAddress).trim());\n    }\n    if (!targets.length) {\n      d.action = 'review';\n      d.reasons.push('There\\'s no Teams channel to tag it in, so it\\'s held for review instead of being faxed again');\n      return;\n    }\n    d.teamsOnly = true;\n    d.teamsTargets = targets;\n  }\n}\n\nfunction finishDup_(dc, result) {\n  if (!dc || !dc.sh || !dc.row) return;\n  try {\n    dc.sh.getRange(dc.row, 2).setValue(result);\n    if (dc.match) dc.sh.getRange(dc.row, 11, 1, 2).setValues([[dc.match.rowNum, dc.level === 'high' ? 'sure' : 'possible']]);\n  } catch (e) { console.warn('Could not update the Forwarded invoices tab: ' + e); }\n}\n\n/* ---------- Change history in a Google Sheet or Doc ---------- */\n\n// Adds an entry to the linked change history document: which store, which settings version,\n// who saved those settings, what changed since this store last logged, and the full settings.\nfunction logChangeHistory_(event) {\n  var url = String(CONFIG.historyDocUrl || '').trim();\n  if (!url) return;\n  var account = currentAccount_();\n  try {\n    var p = PropertiesService.getScriptProperties();\n    var lastLogged = Number(p.getProperty('LAST_LOGGED_REV')) || 0;\n    var seqOf = function (h) { return Number(h.seq) || Number(h.rev) || 0; };\n    var entries = (CONFIG.history || []).filter(function (h) { return seqOf(h) > lastLogged; });\n    var home = homeStore_(account);\n    var storeName = home ? home.name : '(not listed as a store)';\n    var changeLines = [];\n    entries.forEach(function (h) {\n      changeLines.push('Version ' + h.rev + ', saved ' + h.savedAt + ' by ' + (h.name || 'unknown') + (h.note ? ': ' + h.note : ''));\n      (h.changes || []).forEach(function (c) { changeLines.push('    ' + c); });\n    });\n    if (!changeLines.length) changeLines.push('No settings changes since this store last logged.');\n    var summary = IFCore.settingsSummary_(CONFIG);\n    var version = String(CONFIG.savedRev || CONFIG.rev || '');\n\n    if (/\\/spreadsheets\\//.test(url)) {\n      var ss = SpreadsheetApp.openByUrl(url);\n      var sh = ss.getSheetByName('Change history') || ss.insertSheet('Change history');\n      if (sh.getLastRow() === 0) {\n        sh.appendRow(['Time', 'Event', 'Store', 'Store Gmail', 'Settings version', 'Settings saved by', 'Note', 'What changed', 'Full settings']);\n        sh.setFrozenRows(1);\n      }\n      sh.appendRow([new Date(), event, storeName, account, version, CONFIG.savedByName || '', CONFIG.changeNote || '',\n        changeLines.join('\\n').slice(0, 45000), summary.join('\\n').slice(0, 45000)]);\n    } else if (/\\/document\\//.test(url)) {\n      var doc = DocumentApp.openByUrl(url);\n      var body = doc.getBody();\n      body.appendParagraph(event + ': ' + storeName + ', settings version ' + version).setHeading(DocumentApp.ParagraphHeading.HEADING2);\n      body.appendParagraph('Time: ' + new Date() + '. Store Gmail: ' + account + '. Settings saved by: ' + (CONFIG.savedByName || 'unknown') + '.');\n      body.appendParagraph('What changed').setHeading(DocumentApp.ParagraphHeading.HEADING3);\n      changeLines.forEach(function (l) { body.appendListItem(l.trim()).setNestingLevel(/^\\s/.test(l) ? 1 : 0); });\n      body.appendParagraph('Full settings').setHeading(DocumentApp.ParagraphHeading.HEADING3);\n      summary.forEach(function (l) { body.appendListItem(l); });\n      doc.saveAndClose();\n    } else {\n      console.warn('The change history link is not a Google Sheet or Google Doc link, so nothing was logged.');\n      return;\n    }\n    var maxRev = entries.reduce(function (m, h) { return Math.max(m, seqOf(h)); }, lastLogged);\n    p.setProperty('LAST_LOGGED_REV', String(maxRev));\n    console.log('Added an entry to the change history document.');\n  } catch (e) {\n    console.warn('Could not write to the change history document (' + ((e && e.message) || e) + '). Make sure ' + account + ' has edit access to it.');\n  }\n}\n\n/* ---------- Reading text inside PDFs (needs the Drive service) ---------- */\n\nfunction driveAvailable_() {\n  return typeof Drive !== 'undefined' && !!Drive.Files;\n}\n\nfunction readPdfText_(ctx, info) {\n  if (ctx.driveOff) return '';\n  if (!driveAvailable_()) {\n    ctx.driveOff = true;\n    addUnique_(ctx.notes, 'Text inside PDFs could not be read because the Drive service is not added to this Apps Script project. In the left sidebar, click + next to Services, choose Drive API, click Add, then run setup.');\n    return '';\n  }\n  var pdfs = (info.attachments || []).filter(function (a) {\n    return /\\.pdf$/i.test(a.name || '') && (a.size == null || a.size <= 10 * 1024 * 1024);\n  }).slice(0, 3);\n  var out = [];\n  pdfs.forEach(function (a) {\n    if (!timeLeft_(ctx)) return;\n    try { out.push(pdfToText_(a.blob)); }\n    catch (e) { console.warn('Could not read the text in ' + a.name + ': ' + ((e && e.message) || e)); }\n  });\n  return out.join('\\n').slice(0, 40000);\n}\n\n// Converts the PDF to a temporary Google Doc (Google's text recognition also handles scans), reads it, deletes it.\nfunction pdfToText_(blob) {\n  var b = blob.copyBlob().setContentType('application/pdf');\n  var file;\n  if (typeof Drive.Files.create === 'function') {\n    file = Drive.Files.create({ name: 'invoice-forwarder-temp', mimeType: 'application/vnd.google-apps.document' }, b, { ocrLanguage: 'en', fields: 'id' });\n  } else {\n    file = Drive.Files.insert({ title: 'invoice-forwarder-temp', mimeType: 'application/pdf' }, b, { ocr: true, ocrLanguage: 'en' });\n  }\n  try {\n    return DocumentApp.openById(file.id).getBody().getText();\n  } finally {\n    try { Drive.Files.remove(file.id); } catch (e) { console.warn('Could not delete temporary file ' + file.id); }\n  }\n}\n\n/* ---------- Helpers ---------- */\n\nfunction extractInfo_(msg) {\n  var atts = [];\n  try { atts = msg.getAttachments({ includeInlineImages: false, includeAttachments: true }); } catch (e) {}\n  var body = '';\n  try { body = msg.getPlainBody() || ''; } catch (e) {}\n  if (body.length > 30000) body = body.slice(0, 30000);\n  var recipients = [];\n  try { recipients.push(msg.getTo() || '', msg.getCc() || ''); } catch (e) {}\n  try { recipients.push(msg.getHeader('Delivered-To') || ''); } catch (e) {}\n  return {\n    id: msg.getId(), from: msg.getFrom(), subject: msg.getSubject() || '', body: body, date: msg.getDate(), recipients: recipients,\n    attachments: atts.map(function (a) { return { name: a.getName(), size: a.getSize(), type: a.getContentType(), blob: a }; })\n  };\n}\n\nfunction isSystemMessage_(info) {\n  var tag = CONFIG.systemTag || '[Invoice Forwarder]';\n  if ((info.subject || '').indexOf(tag) >= 0) return true;\n  var s = IFCore.parseSender_(info.from);\n  if (/^(mailer-daemon|postmaster)@/.test(s.email)) return true;\n  var faxDomain = IFCore.faxDomain_(CONFIG);\n  if (faxDomain && (s.domain === faxDomain || s.domain.slice(-(faxDomain.length + 1)) === '.' + faxDomain)) return true;\n  return false;\n}\n\nfunction currentAccount_() {\n  try {\n    return String(Session.getEffectiveUser().getEmail() || '').toLowerCase();\n  } catch (e) {\n    throw new Error('The script isn\\'t allowed to see this Gmail account\\'s address, so it can\\'t tell which store it is. ' +\n      'Run setup again and, on Google\\'s permission screen, check \"Select all\" before clicking Continue.');\n  }\n}\n\n// Google lets people untick individual permissions. When run by hand, ask again for any that are missing\n// instead of failing halfway through.\nfunction requireAllPermissions_() {\n  if (typeof ScriptApp.requireAllScopes === 'function') ScriptApp.requireAllScopes(ScriptApp.AuthMode.FULL);\n}\n\nfunction homeStore_(account) {\n  return IFCore.homeStoreFor_(CONFIG, account);\n}\n\nfunction labelNames_() {\n  var r = String(CONFIG.labelRoot || 'Invoice').replace(/[\\/\\\\]/g, '-').trim() || 'Invoice';\n  return {\n    root: r, review: r + '/Needs Review', send: r + '/Send', sendTo: r + '/Send to', notInvoice: r + '/Not Invoice',\n    block: r + '/Block Sender', trust: r + '/Trust Sender', sent: r + '/Forwarded', flagged: r + '/Forwarded - Check', dupSkipped: r + '/Duplicate - Skipped', dismissed: r + '/Dismissed',\n    excluded: r + '/Excluded', error: r + '/Send Failed'\n  };\n}\n\nfunction storeLabelName_(store) {\n  return labelNames_().sendTo + '/' + String(store.name || store.id).replace(/[\\/\\\\]/g, '-').trim();\n}\n\n// Few-labels mode (the default) only creates what people need to see or use:\n// Forwarded and Send Failed, plus the review labels when unsure emails are held in Gmail.\nfunction setupLabelKeys_() {\n  if (CONFIG.labelMode === 'detailed') return ['review', 'send', 'notInvoice', 'block', 'trust', 'sent', 'flagged', 'dupSkipped', 'dismissed', 'excluded', 'error'];\n  var keys = ['sent', 'error'];\n  if (CONFIG.unsureAction === 'review' || CONFIG.deliveryMode === 'fax') keys.push('review', 'send', 'notInvoice');\n  else if (CONFIG.manualSendLabel) keys.push('send');\n  return keys;\n}\n\nfunction wantedLabelNames_() {\n  var n = labelNames_();\n  var names = setupLabelKeys_().map(function (k) { return n[k]; });\n  if (CONFIG.labelMode === 'detailed') (CONFIG.stores || []).forEach(function (s) { names.push(storeLabelName_(s)); });\n  return names;\n}\n\n// In few-labels mode, posts tagged in Teams count as Forwarded, and skipped or excluded emails get no label\n// (the history sheet still records them). Needs Review is only created the first time an email needs it.\nfunction addResultLabel_(ctx, thread, key) {\n  if (CONFIG.labelMode !== 'detailed') {\n    var map = { flagged: 'sent', dupSkipped: null, excluded: null, dismissed: null };\n    if (Object.prototype.hasOwnProperty.call(map, key)) key = map[key];\n  }\n  if (key) thread.addLabel(label_(ctx, key));\n}\n\n/** Deletes this script's Gmail labels that the current settings don't use. The emails themselves stay where they are. */\nfunction removeUnusedLabels() {\n  requireAllPermissions_();\n  var root = normLabel_(labelNames_().root);\n  var keep = wantedLabelNames_().map(normLabel_);\n  keep.slice().forEach(function (k) {\n    var parts = k.split('/');\n    for (var i = 1; i < parts.length; i++) { var p = parts.slice(0, i).join('/'); if (keep.indexOf(p) < 0) keep.push(p); }\n  });\n  var mine = GmailApp.getUserLabels().filter(function (l) { return normLabel_(l.getName()).indexOf(root + '/') === 0; });\n  mine.sort(function (a, b) { return b.getNam function labelList() {
  var c = app.cfg;

      ['script', r + '/Send Failed', 'Sending failed. A notice says why.']
    ];
    if (held) {
      few.push(['script', r + '/Needs Review', 'Unsure, held for someone to decide.']);
      few.push(['staff', r + '/Send', 'It’s an invoice. Forward it.']);
      few.push(['staff', r + '/Not Invoice', 'Not an invoice. Ignore it.']);

  ];
  return rows;
}

function renderTestResult() {
  var el = $('#testResult');
  if (!el) return;
  var t = app.test, c = app.cfg;
  var info = { from: t.from, subject: t.subject, body: t.body, recipients: [t.to || ''], attachments: IFCore.list_(t.att).map(function (n) { return { name: n, size: null }; }) };
  var env = { homeStoreId: t.home, inSpam: t.spam, trusted: [], blocked: [] };
  var d = IFCore.decide_(c, info, env);
  var readPdf = !t.spam && IFCore.needsPdfText_(c, info, d);
  if (readPdf) { info.pdfText = t.pdf || ''; d = IFCore.decide_(c, info, env); }
  var titles = { send: d.teamsOnly ? 'Teams, tagged ⚠ Check' : 'Forward', review: 'Hold for review', exclude: 'Exclude', ignore: 'Ignore' };
  var subs = { send: d.teamsOnly ? 'Unsure: sent to Teams only, not faxed' : 'Sent automatically', review: 'Staff get a review notice', exclude: 'Labeled Excluded, not sent', ignore: 'Not treated as an invoice' };
  var rows = '';
  if (d.teamsOnly) {
    var fl = d.flags.filter(function (x, i, a) { return a.indexOf(x) === i; }).join('; ');
    rows += '<dt>Check tag</dt><dd>⚠ ' + esc(fl.charAt(0).toUpperCase() + fl.slice(1)) + '</dd>';
    rows += '<dt>Posted to</dt><dd>' + esc(d.teamsTargets.join(', ')) + '</dd>';
  }
  if (d.action === 'send' || d.action === 'review') {
    var stores = d.storeIds.map(function (id) {
      var s = IFCore.storeById_(c, id);
      var dests = IFCore.destinationsFor_(c, s, { includePending: true }).map(function (x) {
        return x.kind === 'fax-pending' ? 'fax (waiting for provider address)' : x.kind === 'fax' ? 'fax ' + x.address : 'Teams ' + x.address;
      });
      return '<li><b>' + esc(s ? s.name : id) + '</b>' + (dests.length ? ': ' + esc(dests.join(', ')) : ': no destination set') + '</li>';
    }).join('');
    rows += '<dt>Store</dt><dd>' + (stores ? '<ul>' + stores + '</ul>' : 'Not decided') + (d.routeReason ? '<div class="hint">' + esc(d.routeReason) + '</div>' : '') + '</dd>';
    var files = d.files.map(function (f) { return f.name; });
    if (d.bodyAsPdf) files.unshift('Message text as a PDF');
    if (readPdf) rows += '<dt>PDF text</dt><dd>' + (t.pdf ? 'Read to help decide' : 'Would be read, but none was entered above') + '</dd>';
    rows += '<dt>Pages sent</dt><dd>' + (files.length ? esc(files.join(', ')) : 'Nothing') + '</dd>';
  }
  var reasons = d.reasons.length ? '<ul>' + d.reasons.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' :
    'No invoice wording, and the sender isn’t in the address book. To catch emails like this, add the sender to the address book.';
  rows += '<dt>Why</dt><dd>' + reasons + '</dd>';
  el.innerHTML = '<div class="rxlabel ' + (d.teamsOnly ? 'review' : d.action) + '"><header><small>' + subs[d.action] + '</small><strong>' + titles[d.action] + '</strong></header>' +
    '<div class="body"><dl>' + rows + '</dl></div></div>';
}

var META_KEYS = ['rev', 'seq', 'savedAt', 'savedByName', 'changeNote', 'history', 'generatedAt', 'savedRev'];
function settingsOnly(c) { var o = clone(normalize(c)); META_KEYS.forEach(function (k) { delete o[k]; }); return o; }
function sameSettings(a, b) { return JSON.stringify(settingsOnly(a)) === JSON.stringify(settingsOnly(b)); }

function makeVersion(d) {
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function buildScript(base) {
  var c = clone(base);
  c.savedRev = c.rev;
  c.generatedAt = c.savedAt;
  var head = [
    '/**',
    ' * PHARMACY INVOICE FORWARDER - Google Apps Script for Gmail',
    ' * Settings version: ' + c.rev + (c.savedByName ? ', updated by ' + c.savedByName : '') + (c.changeNote ? ' (' + c.changeNote.replace(/\*\//g, '') + ')' : ''),
    ' *',
    ' * Do not edit this file by hand. Change settings on the Invoice Forwarder',
    ' * setup page, click Update script, and paste the new script over everything here.',
    ' *',
    ' * Functions to choose in the menu next to "Debug", then click Run:',
    ' *   setup              run once after every paste (labels, timer, log sheet)',
    ' *   dryRun             show what would happen to recent email; sends nothing',
    ' *   sendTestToMyStore  send a test page to this store\'s fax and Teams',
    ' *   checkSetup         show which store this account is, and any problems',
    ' *   showLearnedLists   senders staff trusted or blocked with labels',
    ' *   resetLearnedLists  forget those senders',
    ' *   removeTimer        stop automatic runs (run setup to start again)',
    ' *   removeUnusedLabels delete this script\'s Gmail labels the settings no longer use',
    ' */',
    ''
  ].join('\n');
  return head + '/* CONFIG-START */\nvar CONFIG = ' + JSON.stringify(c, null, 2) + ';\n/* CONFIG-END */\n\n' + CORE_SRC + '\n' + GAS_SRC;
}

function readinessHtml() {
  var w = IFCore.configWarnings_(app.cfg);
  if (!w.length) return '<ul class="readiness"><li class="ok">Everything needed is filled in.</li></ul>';
  var order = { error: 0, warn: 1, info: 2 };
  w.sort(function (a, b) { return order[a.level] - order[b.level]; });

}

var WORK_KEY = 'invoice-forwarder-work-v2', BASE_KEY = 'invoice-forwarder-base-v2', CONN_KEY = 'invoice-forwarder-sheet-v1';
function putLocal(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function getLocal(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
var workTimer = null;
function saveWorkSoon() {
  clearTimeout(workTimer);

}

/* ---------- Google Sheet connection ---------- */
function newKey() {
  var a = new Uint8Array(12);
  try { crypto.getRandomValues(a); } catch (e) { for (var i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
  return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}
function connUrl() { return String(app.conn.url || '').trim(); }
function loggerReady() { return /^https:\/\/script\.google(usercontent)?\.com\/\S+/.test(connUrl()); }
function keyInUrl() { var m = /[?&]key=([^&#]+)/.exec(connUrl()); return m ? decodeURIComponent(m[1]) : ''; }
function effectiveKey() { return keyInUrl() || app.conn.key || ''; }
function shareLink() {
  var u = connUrl();
  if (!u) return '';
  if (!keyInUrl() && app.conn.key) u += (u.indexOf('?') < 0 ? '?' : '&') + 'key=' + encodeURIComponent(app.conn.key);
  return u;
}
function saveConn() { putLocal(CONN_KEY, app.conn); }
function ensureKey() { if (!app.conn.key && !keyInUrl()) { app.conn.key = newKey(); saveConn(); } }

function loggerCode() {
  ensureKey();
  var key = effectiveKey().replace(/[^A-Za-z0-9_-]/g, '');
  return [
    '// Invoice Forwarder: settings history logger for this Google Sheet.',
    '// The setup page sends each script update here, and loads the latest settings from here.',
    "var KEY = '" + key + "';",
    "var TAB = 'Settings history';",
    "var HEAD = ['Time', 'Version', 'Updated by', 'Note', 'What changed', 'Settings summary', 'Settings (used to reload the setup page)'];",
    '',
    'function doPost(e) {',
    '  var lock = LockService.getScriptLock();',
    '  lock.waitLock(20000);',
    '  try {',
    '    var data = JSON.parse(e.postData.contents);',
    "    var key = data.key || (e.parameter && e.parameter.key) || '';",
    "    if (KEY && key !== KEY) return out_({ ok: false, error: 'The connection key does not match' });",
    '    var json = JSON.stringify(data.settings || {});',
    "    if (json.length > 49000) return out_({ ok: false, error: 'The settings are too large for one cell' });",
    '    var sh = tab_();',
    "    sh.appendRow([new Date(), String(data.version || ''), String(data.name || ''), String(data.note || ''),",
    "      (data.changes || []).join('\\n'), (data.summary || []).join('\\n'), json]);",
    '    return out_({ ok: true, row: sh.getLastRow() });',
    '  } catch (err) {',
    '    return out_({ ok: false, error: String(err) });',
    '  } finally {',
    '    lock.releaseLock();',
    '  }',
    '}',
    '',
    'function doGet(e) {',
    '  try {',
    "    if (KEY && ((e.parameter && e.parameter.key) || '') !== KEY) return out_({ ok: false, error: 'The connection key does not match' });",
    '    var sh = tab_();',
    '    var last = sh.getLastRow();',
    '    if (last < 2) return out_({ ok: true, settings: null });',
    '    var row = sh.getRange(last, 1, 1, HEAD.length).getValues()[0];',
    "    return out_({ ok: true, time: row[0], version: row[1], name: row[2], note: row[3], settings: JSON.parse(row[6] || 'null') });",
    '  } catch (err) {',
    '    return out_({ ok: false, error: String(err) });',
    '  }',
    '}',
    '',
    'function tab_() {',
    '  var ss = SpreadsheetApp.getActiveSpreadsheet();',
    '  var sh = ss.getSheetByName(TAB) || ss.insertSheet(TAB);',
    '  if (sh.getLastRow() === 0) { sh.appendRow(HEAD); sh.setFrozenRows(1); }',
    '  return sh;',
    '}',
    '',
    'function out_(o) {',
    '  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);',
    '}',
    ''
  ].join('\n');
}

function loggerFetch(method, payload) {
  var url = shareLink();
  var opts = method === 'POST'
    ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), redirect: 'follow' }
    : { method: 'GET', redirect: 'follow' };
  return fetch(url, opts).then(function (r) {
    return r.text().then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('the sheet logger didn’t answer as expected; check it’s deployed as a web app with access set to Anyone'); }
      if (!j.ok) throw new Error(j.error || 'the sheet logger reported a problem');
      return j;
    });
  });
}
function settingsForSheet(c) {
  var s = clone(c);
  var size = function () { return JSON.stringify(s).length; };
  if (size() > 45000) s.history = (s.history || []).slice(-5);
  if (size() > 45000) s.history = (s.history || []).map(function (h) { return { rev: h.rev, seq: h.seq, savedAt: h.savedAt, name: h.name, note: h.note, changes: [] }; });
  return s;
}

  if (!loggerReady()) { el.innerHTML = '<span class="state todo">That doesn’t look like a web app link. It should start with https://script.google.com/</span>'; return; }
  el.innerHTML = '<span class="state ok">Link entered</span><p class="hint">Link to share with others who use this page (includes the connection key):</p>' +
    '<div class="sharelink"><code>' + esc(shareLink()) + '</code></div><button class="btn small" data-act="copy-share">Copy link</button>';
}

function fetchLatest(manual) {
  if (!loggerReady()) { if (manual) toast('Connect the Google Sheet first, on the Labels and schedule step.'); return; }
  loggerFetch('GET').then(function (j) {
    if (!j.settings) { if (manual) toast('The Google Sheet has no settings yet. Update the script once to store them.'); return; }
    var latest = normalize(j.settings);
    var mine = app.base ? Number(app.base.seq) || 0 : 0;
    var theirs = Number(latest.seq) || 0;
    if (app.base && theirs && theirs === mine) { if (manual) toast('You already have the latest settings (version ' + latest.rev + ').'); return; }
    if (app.base && theirs < mine && !manual) return;
    if (!app.dirty || manual === 'force') { applyLatest(latest); return; }
    app.pendingLatest = latest;
    setBanner('<p>Newer settings are in the Google Sheet: version ' + esc(latest.rev) + (latest.savedByName ? ' by ' + esc(latest.savedByName) : '') + '. Loading them replaces the changes you haven’t put in a script yet.</p>' +
      '<button class="btn small" data-act="load-pending">Load version ' + esc(latest.rev) + '</button><button class="btn small" data-act="dismiss-banner">Keep my changes</button>');
  }, function (err) { if (manual) toast('Couldn’t load from the sheet: ' + err.message); });
}
function applyLatest(latest) {
  app.base = latest;
  app.cfg = clone(latest);
  app.dirty = false;
  app.pendingLatest = null;
  persistAll();
  setBanner('');
  renderAll();
  toast('Loaded version ' + latest.rev + ' from the Google Sheet' + (latest.savedByName ? ', updated by ' + latest.savedByName : '') + '.');
}

/* ---------- Rendering all ---------- */
function renderAll() {
  renderStores(); renderDelivery(); renderDetection(); renderSenders(); renderLabelsView(); renderTestView();
  if (app.view === 'install') renderInstall();
  app.dirty = app.base ? !sameSettings(app.cfg, app.base) : !sameSettings(app.cfg, DEFAULT_CFG);
  updateStatus(); updateBadge();
}
function show(view) {
  var ids = VIEWS.map(function (v) { return v[0]; });
  if (ids.indexOf(view) < 0) view = 'stores';
  app.view = view;
  $$('section[data-view]').forEach(function (s) { s.classList.toggle('active', s.dataset.view === view); });
  $$('[data-nav]').forEach(function (a) { if (a.dataset.nav === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (view === 'install') renderInstall();
  if (view === 'test') renderTestResult();
  window.scrollTo(0, 0);
  var cur = $('[data-nav="' + view + '"]');
  if (cur && window.matchMedia('(max-width: 900px)').matches) { try { cur.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}
window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

function setBanner(html) {
  $('#banners').innerHTML = html ? '<div class="banner' + (html.indexOf('data-info') >= 0 ? ' info' : '') + '">' + html + '</div>' : '';
}
var toastTimer = null;
function toast(text, actionLabel, action) {
  var t = $('#toast');
  $('#toastText').textContent = text;
  var b = $('#toastAction');
  b.hidden = !actionLabel;
  b.textContent = actionLabel || '';
  b.onclick = action ? function () { action(); t.classList.remove('show'); } : null;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, actionLabel ? 8000 : 4500);
}

/* ---------- Dialogs ---------- */
var modalOk = null;
function openModal(o) {
  $('#modalTitle').textContent = o.title;
  $('#modalBody').innerHTML = o.body;
  $('#modalOk').textContent = o.ok;
  modalOk = o.onOk;
  $('#modal').hidden = false;
  var first = $('#modalBody input, #modalBody textarea');
  if (first) first.focus();
}
function closeModal() { $('#modal').hidden = true; modalOk = null; }
$('#modalCancel').addEventListener('click', closeModal);
$('#modalOk').addEventListener('click', function () { if (modalOk && modalOk() !== false) closeModal(); });
$('#modal').addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); $('#modalOk').click(); }
});
var NAME_KEY = 'invoice-forwarder-name';
function rememberedName() { try { return localStorage.getItem(NAME_KEY) || ''; } catch (e) { return ''; } }
function rememberName(n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) {} }
function readName() {
  var el = $('#mName');
  var n = el.value.trim();
  if (!n) { el.classList.add('invalid'); el.focus(); toast('Enter your name first.'); return null; }
  rememberName(n);
  return n;
}

function openUpdateDialog() {
  var errors = IFCore.configWarnings_(app.cfg).filter(function (w) { return w.level === 'error'; });
  if (errors.length) { toast('Fix the problems marked in red under “Check before updating” first.'); return; }
  if (app.base && !app.dirty) { toast('Nothing has changed since version ' + app.base.rev + '. The script below is current.'); return; }
  var changes = describeChanges(app.base, app.cfg);
  openModal({
    title: 'Update the script',
    body: '<label class="f"><span>Your name</span><input type="text" id="mName" value="' + esc(rememberedName()) + '" autocomplete="name"><small>Recorded with this version' + (loggerReady() ? ' and in the Google Sheet' : '') + ', so everyone can see who changed what.</small></label>' +
      '<label class="f"><span>What did you change, and why? (optional)</span><textarea id="mNote" rows="2" placeholder="Added the new wholesaler’s account numbers"></textarea></label>' +
      '<div class="f-label">Changes in this version</div><ul class="changes">' + changes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<p class="hint">' + (loggerReady() ? 'This update will be recorded in the Settings history tab of the Google Sheet.' : 'The Google Sheet isn’t connected, so this update is recorded only inside the script. You can connect it on the Labels and schedule step.') + '</p>',
    ok: 'Update script',
    onOk: function () {
      var n = readName();
      if (!n) return false;
      doUpdate(n, $('#mNote').value.trim(), changes);
    }
  });
}
function doUpdate(name, note, changes) {
  var now = new Date();
  var c = clone(app.cfg);
  var ch = changes.length > 40 ? changes.slice(0, 40).concat(['…and ' + (changes.length - 40) + ' more']) : changes;
  c.rev = makeVersion(now); c.seq = now.getTime(); c.savedAt = now.toISOString();
  c.savedByName = name; c.changeNote = note;
  c.history = ((app.base && app.base.history) || []).concat([{ rev: c.rev, seq: c.seq, savedAt: c.savedAt, name: name, note: note, changes: ch }]).slice(-15);
  app.base = normalize(c);
  app.cfg = clone(app.base);
  persistAll();
  app.lastLog = loggerReady() ? { state: 'sending' } : null;
  renderAll();
  if (loggerReady()) {
    loggerFetch('POST', { key: effectiveKey(), version: c.rev, name: name, note: note, changes: ch, summary: IFCore.settingsSummary_(app.base), settings: settingsForSheet(app.base) })
      .then(function () {
        app.lastLog = { state: 'confirmed' }; refreshInstall();
        toast('Script updated and recorded in the Google Sheet.');
      }, function (err) {
        var unconfirmed = err && err.name === 'TypeError';
        app.lastLog = unconfirmed ? { state: 'unconfirmed' } : { state: 'failed', error: err && err.message };
        refreshInstall();
        toast(unconfirmed ? 'Script updated. The page couldn’t confirm the Google Sheet got it.' : 'Script updated, but recording it in the Google Sheet failed.');
      });
  } else {
    toast('Script updated. Copy it below.');
  }
  setTimeout(function () { var g = $('#scriptGroup'); if (g && !g.hidden) g.scrollIntoView({ block: 'start' }); }, 60);
}

/* ---------- What changed between two versions ---------- */
var FIELD_LABELS = {
  deliveryMode: 'Send invoices to', faxAddressTemplate: 'Fax provider format', faxBodyText: 'Fax cover text',
  defaultTeamsAddress: 'Default Teams channel', teamsStyle: 'Teams posts', unsureAction: 'Unsure emails', storeCheck: 'Work out the store from keywords',
  labelMode: 'Gmail labels', manualSendLabel: 'Send label for missed invoices',
  excludedSenders: 'Never-forward senders', dupMode: 'Duplicates', dupWindowHours: 'Duplicate look-back (hours)', onlyBookSenders: 'Only forward address book senders', teamsAttachEmailPdf: 'Attach email text PDF to Teams posts',
  reviewRecipients: 'Review notices go to', auditCopyAddress: 'Copy of everything goes to',
  senderName: 'Sender name', keywords: 'Keywords', matchPoPatterns: 'Recognize purchase order numbers',
  readPdfText: 'Read inside PDFs', pdfWording: 'Look for wording inside PDFs', exclusionPhrases: 'Exclusion phrases',
  exclusionCheckBody: 'Check message text for exclusions', checkSpam: 'Check the Spam folder',
  reviewUnknownAttachments: 'Hold attachments from unknown senders', attachmentTypes: 'Attachment types',
  minImageKB: 'Skip images smaller than (KB)', bodyToPdf: 'Turn message text into a PDF', alwaysIncludeBody: 'Always add a message text page',
  multiStoreMatch: 'If an email mentions several stores', fallbackStoreId: 'If the store can’t be worked out',
  labelRoot: 'Label group name', systemTag: 'Tag on sent emails', runEveryMinutes: 'Check every (minutes)',
  firstRunLookbackHours: 'First install look-back (hours)', dryRunHours: 'Dry run look-back (hours)',
  logToSheet: 'Keep a log sheet', historyDocUrl: 'Change history sheet'
};
var RULE_LABELS = { subject: 'subject', attachment: 'attachment file name', body: 'message text only', pdf: 'inside a PDF only' };
function describeChanges(a, b) {
  if (!a) return ['First version'];
  var out = [];
  var short = function (s) { s = String(s); return s.length > 90 ? s.slice(0, 87) + '…' : s; };
  var nameOf = function (cfg, id) { var s = IFCore.storeById_(cfg, id); return s ? s.name : id; };
  var fmt = function (k, v, cfg) {
    if (k === 'fallbackStoreId') return v ? nameOf(cfg, v) : 'hold for review';
    if (k === 'deliveryMode') return { both: 'fax and Teams', fax: 'fax only', teams: 'Teams only' }[v] || v;
    if (k === 'teamsStyle') return v === 'full' ? 'full email text' : 'compact';
    if (k === 'labelMode') return v === 'detailed' ? 'detailed' : 'few';
    if (k === 'dupMode') return { off: 'not checked', tag: 'tagged in Teams', skip: 'sure ones skipped' }[v] || v;
    if (k === 'unsureAction') return v === 'review' ? 'held for review' : 'Teams with a Check tag';
    if (k === 'multiStoreMatch') return v === 'all' ? 'send to each' : 'hold for review';
    if (Array.isArray(v)) return v.length ? short(v.join(', ')) : 'none';
    if (typeof v === 'boolean') return v ? 'on' : 'off';
    return v === '' || v == null ? 'blank' : short(v);
  };
  Object.keys(FIELD_LABELS).forEach(function (k) {
    if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) out.push(FIELD_LABELS[k] + ': ' + fmt(k, a[k], a) + ' → ' + fmt(k, b[k], b));
  });
  Object.keys(RULE_LABELS).forEach(function (k) {
    var x = (a.rules || {})[k], y = (b.rules || {})[k];
    if (x !== y) out.push('When wording is found in the ' + RULE_LABELS[k] + ': ' + (x === 'send' ? 'forward' : 'hold') + ' → ' + (y === 'send' ? 'forward' : 'hold'));
  });
  var storeFields = { name: 'name', gmail: 'Gmail', receivingEmails: 'receiving addresses', faxNumber: 'fax number', teamsAddress: 'Teams channel', keywords: 'keywords' };
  var oldStores = {};
  (a.stores || []).forEach(function (s) { oldStores[s.id] = s; });
  (b.stores || []).forEach(function (s) {
    var o = oldStores[s.id];
    if (!o) { out.push('Added store ' + (s.name || s.id)); return; }
    delete oldStores[s.id];
    Object.keys(storeFields).forEach(function (f) {
      if (JSON.stringify(o[f]) !== JSON.stringify(s[f])) out.push('Store ' + (s.name || o.name) + ', ' + storeFields[f] + ': ' + fmt(f, o[f]) + ' → ' + fmt(f, s[f]));
    });
  });
  Object.keys(oldStores).forEach(function (id) { out.push('Removed store ' + (oldStores[id].name || id)); });
  var key = function (e) { return String(e.sender || '').trim().toLowerCase(); };
  var act = function (v) { return { forward: 'always forward', review: 'always hold for review', exclude: 'never forward' }[v] || v; };
  var bookDesc = function (e, cfg) { return e.sender + (e.vendor ? ' (' + e.vendor + ')' : '') + ', ' + act(e.action) + ', store: ' + (e.store && e.store !== 'auto' ? nameOf(cfg, e.store) : 'automatic'); };
  var oldBook = {};
  (a.addressBook || []).forEach(function (e) { if (key(e)) oldBook[key(e)] = e; });
  (b.addressBook || []).forEach(function (e) {
    var k = key(e);
    if (!k) return;
    var o = oldBook[k];
    if (!o) { out.push('Address book: added ' + bookDesc(e, b)); return; }
    delete oldBook[k];
    if (o.action !== e.action || o.store !== e.store || o.vendor !== e.vendor) out.push('Address book: ' + bookDesc(o, a) + ' → ' + bookDesc(e, b));
  });
  Object.keys(oldBook).forEach(function (k) { out.push('Address book: removed ' + bookDesc(oldBook[k], a)); });
  return out.length ? out : ['No settings changed'];
}

/* ---------- Events ---------- */
function onField(e) {
  var el = e.target;
  if (el.dataset && el.dataset.k) {
    if (el.type === 'radio' && !el.checked) return;
    setPath(app.cfg, el.dataset.k, readVal(el));
    changed();
  } else if (el.dataset && el.dataset.t) {
    app.test[el.dataset.t] = el.type === 'checkbox' ? el.checked : el.value;
    renderTestResult();
  } else if (el.id === 'loggerUrlInput') {
    app.conn.url = el.value.trim();
    saveConn();
    updateLoggerState();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.dataset.act;
  var c = app.cfg;
  if (act === 'add-store') {
    var id = 's' + Date.now().toString(36);
    c.stores.push({ id: id, name: 'Store ' + (c.stores.length + 1), gmail: '', faxNumber: '', teamsAddress: '', keywords: [] });
    renderAll(); changed();
    var last = $$('.store').pop();
    if (last) { last.scrollIntoView({ block: 'center' }); var inp = $('input', last); if (inp) { inp.focus(); inp.select(); } }
  } else if (act === 'remove-store') {
    var i = Number(b.dataset.i);
    var before = clone(c);
    var removed = c.stores.splice(i, 1)[0];
    c.addressBook.forEach(function (x) { if (x.store === removed.id) x.store = 'auto'; });
    if (c.fallbackStoreId === removed.id) c.fallbackStoreId = '';
    renderAll(); changed();
    toast('Removed ' + (removed.name || 'store'), 'Undo', function () { app.cfg = before; renderAll(); changed(); });
  } else if (act === 'add-sender') {
    c.addressBook.push({ sender: '', vendor: '', action: 'forward', store: 'auto' });
    renderSenders(); changed();
    var rows = $$('.book tbody tr');
    if (rows.length) $('input', rows[rows.length - 1]).focus();
  } else if (act === 'remove-sender') {
    var j = Number(b.dataset.i);
    var prev = clone(c.addressBook);
    var gone = c.addressBook.splice(j, 1)[0];
    renderSenders(); changed();
    toast('Removed ' + (gone.sender || 'sender'), 'Undo', function () { app.cfg.addressBook = prev; renderSenders(); changed(); });
  } else if (act === 'paste-senders') {
    var lines = ($('#bulkSenders').value || '').split('\n');
    var added = 0, bad = [];
    lines.forEach(function (line) {
      if (!line.trim()) return;
      var parts = line.split(',');
      var sender = parts[0].trim();
      if (!IFCore.validSender_(sender)) { bad.push(sender); return; }
      c.addressBook.push({ sender: sender, vendor: parts.slice(1).join(',').trim(), action: 'forward', store: 'auto' });
      added++;
    });
    renderSenders(); changed();
    toast('Added ' + added + ' sender' + (added === 1 ? '' : 's') + (bad.length ? '. Skipped: ' + bad.join(', ') : ''));
  } else if (act === 'add-keyword') {
    var w = b.dataset.word;
    if (c.keywords.map(function (k) { return k.toLowerCase(); }).indexOf(w.toLowerCase()) < 0) c.keywords.push(w);
    renderDetection(); changed();
  } else if (act === 'preset') {
    Object.assign(app.test, PRESETS[b.dataset.p]);
    renderTestView();
  } else if (act === 'update-script') {
    openUpdateDialog();
  } else if (act === 'copy-script') {
    if (app.base) copyText(buildScript(app.base), 'Script copied. Paste it into Code.gs in each store’s Apps Script project.');
  } else if (act === 'copy-settings') {
    copyText(JSON.stringify({ config: app.cfg, exportedAt: new Date().toISOString() }, null, 2), 'Settings copied.');
  } else if (act === 'dl-script') {
    if (app.base) download('invoice-forwarder-' + app.base.rev.replace(/[^0-9]/g, '') + '.txt', buildScript(app.base));
  } else if (act === 'dl-instr') {
    var doc = '<!doctype html><html><head><meta charset="utf-8"><title>Invoice forwarder install instructions</title>' +
      '<style>body{font-family:Arial,sans-serif;max-width:760px;margin:32px auto;padding:0 16px;line-height:1.5}code{background:#eef;padding:1px 4px}table{border-collapse:collapse}td,th{border:1px solid #ccd;padding:6px;text-align:left}</style></head><body>' +
      '<h1>Invoice forwarder install instructions</h1><p>Script version ' + esc(app.base ? app.base.rev : 'not made yet') + '</p>' + instructionsHtml() + '</body></html>';
    download('invoice-forwarder-instructions.html', doc);
  } else if (act === 'export') {
    download('invoice-forwarder-settings.json', JSON.stringify({ config: app.cfg, exportedAt: new Date().toISOString() }, null, 2));
  } else if (act === 'import') {
    try {
      var cfg = parseImport($('#importText').value);
      if (cfg.rev && cfg.seq) app.base = clone(cfg);
      app.cfg = cfg;
      persistAll();
      renderAll(); changed(); location.hash = 'stores';
      toast('Settings loaded' + (cfg.rev ? ' (version ' + cfg.rev + ')' : '') + '. Review them, then update the script.');
    } catch (err) {
      toast('Couldn’t read those settings: ' + err.message);
    }
  } else if (act === 'test-logger') {
    testLogger();
  } else if (act === 'load-latest') {
    fetchLatest('force');
  } else if (act === 'load-pending') {
    if (app.pendingLatest) applyLatest(app.pendingLatest);
  } else if (act === 'copy-logger') {
    copyText(loggerCode(), 'Logger code copied. Paste it into the sheet’s Apps Script editor.');
  } else if (act === 'copy-share') {
    copyText(shareLink(), 'Link copied.');
  } else if (act === 'dismiss-banner') {
    setBanner('');
  }
});

function parseImport(text) {
  text = String(text || '').trim();
  if (!text) throw new Error('nothing was pasted');
  var json = text;
  var a = text.indexOf('/* CONFIG-START */');
  if (a >= 0) {
    var bEnd = text.indexOf('/* CONFIG-END */', a);
    var seg = text.slice(a, bEnd > a ? bEnd : undefined);
    json = seg.slice(seg.indexOf('=') + 1).trim().replace(/;\s*$/, '');
  }
  var obj = JSON.parse(json);
  var c = obj && obj.config && obj.config.stores ? obj.config : obj;
  if (!c || !Array.isArray(c.stores)) throw new Error('there’s no store list in it');
  return normalize(c);
}

function copyText(text, okMsg) {
  var done = function () { toast(okMsg); };
  var fallback = function () {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) done();
    else toast('Copying isn’t allowed here. Select the text and press Ctrl+C (Cmd+C on a Mac).');
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
}

function download(filename, data) {
  if (!app.downloads) {
    if (window.claude) return;
    var url = URL.createObjectURL(new Blob([data], { type: 'text/plain;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    return;
  }
  app.downloads.save({ filename: filename, data: data }).then(function () {}, function (err) {
    if (err && err.code === 'declined') return;
    toast('The download didn’t start (' + ((err && err.code) || 'unavailable') + ').');
  });
}
function applyCapabilityVisibility() {
  $$('[data-needs="downloads"]').forEach(function (el) { el.hidden = !app.downloads && !!window.claude; });
}

/* ---------- Start ---------- */
(function start() {
  app.conn = getLocal(CONN_KEY) || { url: '', key: '' };
  var base = getLocal(BASE_KEY);
  var work = getLocal(WORK_KEY);
  if (!work) { var old = getLocal('invoice-forwarder-draft-v1'); if (old && old.cfg) work = old.cfg; }
  app.base = base ? normalize(base) : null;
  var cfg = normalize(work || base || DEFAULT_CFG);
  if (!app.base) {
    var used = cfg.stores.filter(function (s) { return !/^Store \d+$/.test(s.name || '') || s.gmail || s.faxNumber || s.teamsAddress || s.keywords.length; });
    if (used.length < cfg.stores.length) {
      cfg.stores = used.length ? used : cfg.stores.slice(0, 1);
      var ids = {}; cfg.stores.forEach(function (s) { ids[s.id] = 1; });
      cfg.addressBook.forEach(function (e) { if (!ids[e.store]) e.store = 'auto'; });
      if (cfg.fallbackStoreId && !ids[cfg.fallbackStoreId]) cfg.fallbackStoreId = '';
    }
  }
  app.cfg = cfg;
  renderAll();
  show(location.hash.slice(1) || 'stores');
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (d) { app.downloads = d; applyCapabilityVisibility(); }, function () {});
  }
  if (loggerReady()) fetchLatest(false);
})();

})();
</script>

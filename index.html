function scheduleInstall() {
  if (app.view !== 'install') return;
  clearTimeout(installTimer);
  installTimer = setTimeout(refreshInstall, 350);
}

/* ---------- Live updates ---------- */
function updateFaxPreviews() {
  $$('[data-faxprev]').forEach(function (el) {
    var s = app.cfg.stores[Number(el.dataset.faxprev)];
    if (!s) return;
    var d = IFCore.faxDigits_(s.faxNumber);
    if (!d) { el.textContent = ''; return; }
    if (d.length !== 10) { el.textContent = 'Should be 10 digits (has ' + d.length + ')'; return; }
    el.textContent = IFCore.faxConfigured_(app.cfg) ? 'Faxes go to ' + IFCore.faxAddress_(app.cfg, s.faxNumber) : 'Fax address will be ' + IFCore.faxAddress_(app.cfg, s.faxNumber) + ' once the provider format is set';
  });
  $$('[data-storetitle]').forEach(function (el) {
    var i = Number(el.dataset.storetitle);
    var s = app.cfg.stores[i];
    if (s) el.textContent = s.name || ('Store ' + (i + 1));
  });
}
function updateFaxState() {
  var el = $('#faxState');
  if (!el) return;
  var ok = IFCore.faxConfigured_(app.cfg);
  var t = String(app.cfg.faxAddressTemplate || '');
  var msg = ok ? 'Ready. Example: ' + IFCore.faxAddress_(app.cfg, '5085550123') :
    t.indexOf('{number}') < 0 ? 'Needs {number} where the fax number goes' : 'Placeholder. Nothing will be faxed until this is replaced';
  el.innerHTML = '<span class="state ' + (ok ? 'ok' : 'todo') + '">' + esc(msg) + '</span>';
}
function refreshStoreSelects() {
  $$('select[data-storeselect]').forEach(function (sel) {
    var kind = sel.dataset.storeselect;
    var cur = sel.value;
    sel.innerHTML = storeOptions(kind, cur);
    sel.value = cur;
    if (sel.value !== cur) sel.selectedIndex = 0;
  });
}
function updateBadge() {
  var n = IFCore.configWarnings_(app.cfg).filter(function (w) { return w.level !== 'info'; }).length;
  var b = $('#navBadge');
  b.hidden = !n;
  b.textContent = n + ' to fix';
}
function updateStatus() {
  var el = $('#status');
  var parts = [];
  if (!app.loaded) parts.push('<span>Loading saved settings…</span>');
  else if (app.dbMissing) parts.push('<span>Saving isn’t available here</span>');
  else if (!app.savedRev) parts.push('<span>Not saved yet</span>');
  else {
    var who = app.cfg.savedByName && !app.dirty ? app.cfg.savedByName : (app.savedTypedName || app.savedByName);
    parts.push('<span>Version ' + app.savedRev + ', saved ' + esc(fmtDate(app.savedAt)) + (who ? ' by ' + esc(who) : '') + '</span>');
  }
  if (app.dirty) parts.push('<span class="pill">Unsaved changes</span>');
  if (app.readOnly) parts.push('<span class="pill">View only</span>');
  el.innerHTML = parts.join('');
  var btn = $('#saveBtn');
  if (!app.saving) btn.disabled = false;
}
function changed() {
  app.dirty = JSON.stringify(app.cfg) !== app.savedCfgJson;
  updateStatus();
  updateBadge();
  updateFaxPreviews();
  updateFaxState();
  updateLabelPreview();
  refreshStoreSelects();
  if (app.view === 'test') renderTestResult();
  scheduleInstall();
  saveDraftSoon();
}

/* ---------- Draft (this browser only) ---------- */
var draftTimer = null;
function saveDraftSoon() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(function () {
    try {
      if (app.dirty) localStorage.setItem(DRAFT_KEY, JSON.stringify({ cfg: app.cfg, baseRev: app.savedRev, at: new Date().toISOString() }));
      else localStorage.removeItem(DRAFT_KEY);
    } catch (e) {}
  }, 600);
}
function readDraft() { try { var v = localStorage.getItem(DRAFT_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function clearDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

/* ---------- Rendering all ---------- */
function renderAll() {
  renderStores(); renderDelivery(); renderDetection(); renderSenders(); renderLabelsView(); renderTestView();
  if (app.view === 'install') renderInstall();
  updateStatus(); updateBadge();
}
function show(view) {
  var valid = ['stores', 'delivery', 'detection', 'senders', 'labels', 'test', 'install'];
  if (valid.indexOf(view) < 0) view = 'stores';
  app.view = view;
  $$('section[data-view]').forEach(function (s) { s.classList.toggle('active', s.dataset.view === view); });
  $$('[data-nav]').forEach(function (a) { if (a.dataset.nav === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (view === 'install') renderInstall();
  if (view === 'test') renderTestResult();
  window.scrollTo(0, 0);
  var cur = $('[data-nav="' + view + '"]');
  if (cur && window.matchMedia('(max-width: 900px)').matches) { try { cur.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} }
}
window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });

function setBanner(html) {
  $('#banners').innerHTML = html ? '<div class="banner' + (html.indexOf('data-info') >= 0 ? ' info' : '') + '">' + html + '</div>' : '';
}
var toastTimer = null;
function toast(text, actionLabel, action) {
  var t = $('#toast');
  $('#toastText').textContent = text;
  var b = $('#toastAction');
  b.hidden = !actionLabel;
  b.textContent = actionLabel || '';
  b.onclick = action ? function () { action(); t.classList.remove('show'); } : null;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, actionLabel ? 8000 : 3500);
}

function loadConfig(cfg, meta) {
  app.cfg = normalize(cfg);
  if (meta) {
    app.savedRev = meta.rev || 0;
    app.savedAt = meta.savedAt || '';
    app.savedBy = meta.savedBy || '';
    app.savedTypedName = app.cfg.savedByName || '';
    app.savedCfgJson = JSON.stringify(app.cfg);
  }
  app.dirty = JSON.stringify(app.cfg) !== app.savedCfgJson;
  renderAll();
  resolveNames();
}

/* ---------- Events ---------- */
function onField(e) {
  var el = e.target;
  if (el.dataset && el.dataset.k) {
    if (el.type === 'radio' && !el.checked) return;
    setPath(app.cfg, el.dataset.k, readVal(el));
    changed();
  } else if (el.dataset && el.dataset.t) {
    app.test[el.dataset.t] = el.type === 'checkbox' ? el.checked : el.value;
    renderTestResult();
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.dataset.act;
  var c = app.cfg;
  if (act === 'add-store') {
    var id = 's' + Date.now().toString(36);
    c.stores.push({ id: id, name: 'Store ' + (c.stores.length + 1), gmail: '', faxNumber: '', teamsAddress: '', keywords: [] });
    renderAll(); changed();
    var last = $$('.store').pop();
    if (last) { last.scrollIntoView({ block: 'center' }); var inp = $('input', last); if (inp) inp.focus(); }
  } else if (act === 'remove-store') {
    var i = Number(b.dataset.i);
    var before = clone(c);
    var removed = c.stores.splice(i, 1)[0];
    c.addressBook.forEach(function (x) { if (x.store === removed.id) x.store = 'auto'; });
    if (c.fallbackStoreId === removed.id) c.fallbackStoreId = '';
    renderAll(); changed();
    toast('Removed ' + (removed.name || 'store'), 'Undo', function () { app.cfg = before; renderAll(); changed(); });
  } else if (act === 'add-sender') {
    c.addressBook.push({ sender: '', vendor: '', action: 'forward', store: 'auto' });
    renderSenders(); changed();
    var rows = $$('.book tbody tr');
    if (rows.length) $('input', rows[rows.length - 1]).focus();
  } else if (act === 'remove-sender') {
    var j = Number(b.dataset.i);
    var prev = clone(c.addressBook);
    var gone = c.addressBook.splice(j, 1)[0];
    renderSenders(); changed();
    toast('Removed ' + (gone.sender || 'sender'), 'Undo', function () { app.cfg.addressBook = prev; renderSenders(); changed(); });
  } else if (act === 'paste-senders') {
    var lines = ($('#bulkSenders').value || '').split('\n');
    var added = 0, bad = [];
    lines.forEach(function (line) {
      if (!line.trim()) return;
      var parts = line.split(',');
      var sender = parts[0].trim();
      if (!IFCore.validSender_(sender)) { bad.push(sender); return; }
      c.addressBook.push({ sender: sender, vendor: parts.slice(1).join(',').trim(), action: 'forward', store: 'auto' });
      added++;
    });
    renderSenders(); changed();
    toast('Added ' + added + ' sender' + (added === 1 ? '' : 's') + (bad.length ? '. Skipped: ' + bad.join(', ') : ''));
  } else if (act === 'add-keyword') {
    var w = b.dataset.word;
    if (c.keywords.map(function (k) { return k.toLowerCase(); }).indexOf(w.toLowerCase()) < 0) c.keywords.push(w);
    renderDetection(); changed();
  } else if (act === 'preset') {
    Object.assign(app.test, PRESETS[b.dataset.p]);
    renderTestView();
  } else if (act === 'save') {
    if (!app.db) { showSavingHelp(); toast(app.loaded ? 'Saving isn’t available here. See the note at the top of the page.' : 'Still connecting to saved settings. Try again in a moment.'); }
    else if (app.readOnly) toast('You can view these settings but not save them. Ask the page owner for Contributor or Editor access.');
    else if (!app.dirty && app.savedRev) toast('There are no changes to save.');
    else openSaveDialog();
  } else if (act === 'allow-saving') {
    if (app.perms) app.perms.request(['db']).then(function (st) {
      if (st && st.db === 'granted') location.reload(); else showSavingHelp();
    });
  } else if (act === 'open-perms') {
    if (app.perms) app.perms.manage().then(function () { return app.perms.state('db'); }).then(function (st) {
      if (st === 'granted') location.reload(); else showSavingHelp();
    }, function () { toast('Open this artifact’s Permissions menu in claude.ai and allow it to store data.'); });
  } else if (act === 'save-anyway') {
    if (app.pendingSave) save(true, app.pendingSave);
  } else if (act === 'copy-script') {
    copyText(buildScript(), 'Script copied. Paste it into Code.gs in each store’s Apps Script project.');
  } else if (act === 'copy-settings') {
    copyText(JSON.stringify({ config: app.cfg, rev: app.savedRev, exportedAt: new Date().toISOString() }, null, 2), 'Settings copied.');
  } else if (act === 'dl-script') {
    download('invoice-forwarder-v' + (app.savedRev || 'unsaved') + '.txt', buildScript());
  } else if (act === 'dl-instr') {
    var doc = '<!doctype html><html><head><meta charset="utf-8"><title>Invoice forwarder install instructions</title>' +
      '<style>body{font-family:Arial,sans-serif;max-width:760px;margin:32px auto;padding:0 16px;line-height:1.5}code{background:#eef;padding:1px 4px}table{border-collapse:collapse}td,th{border:1px solid #ccd;padding:6px;text-align:left}</style></head><body>' +
      '<h1>Invoice forwarder install instructions</h1><p>Settings version ' + esc(scriptRevLabel()) + '</p>' + instructionsHtml() + '</body></html>';
    download('invoice-forwarder-instructions.html', doc);
  } else if (act === 'export') {
    download('invoice-forwarder-settings-v' + (app.savedRev || 'unsaved') + '.json', JSON.stringify({ config: app.cfg, rev: app.savedRev, exportedAt: new Date().toISOString() }, null, 2));
  } else if (act === 'import') {
    try {
      var cfg = parseImport($('#importText').value);
      var keepRev = app.savedRev;
      app.cfg = cfg;
      app.savedRev = keepRev;
      renderAll(); changed(); show('stores'); location.hash = 'stores';
      toast('Settings loaded. Review them, then save.');
    } catch (err) {
      toast('Couldn’t read those settings: ' + err.message);
    }
  } else if (act === 'load-version') {
    var rev = Number(b.dataset.rev);
    var v = app.versions.filter(function (x) { return x.rev === rev; })[0];
    if (v) { app.cfg = normalize(v.config); renderAll(); changed(); toast('Version ' + rev + ' is in the editor. Save settings to make it current.'); }
  } else if (act === 'mark-installed') {
    openInstallDialog(b.dataset.id);
  } else if (act === 'copy-history') {
    copyText(historyText('\t'), 'History copied. Paste it into a Google Sheet or Doc.');
  } else if (act === 'dl-history') {
    download('invoice-forwarder-history.csv', historyText(','));
  } else if (act === 'discard-draft') {
    clearDraft();
    loadConfig(JSON.parse(app.savedCfgJson), null);
    setBanner('');
    toast('Unsaved changes discarded.');
  } else if (act === 'load-remote') {
    if (app.pendingRemote) applyRemote(app.pendingRemote);
    setBanner('');
  } else if (act === 'dismiss-banner') {
    setBanner('');
  }
});

function parseImport(text) {
  text = String(text || '').trim();
  if (!text) throw new Error('nothing was pasted');
  var json = text;
  var a = text.indexOf('/* CONFIG-START */');
  if (a >= 0) {
    var bEnd = text.indexOf('/* CONFIG-END */', a);
    var seg = text.slice(a, bEnd > a ? bEnd : undefined);
    json = seg.slice(seg.indexOf('=') + 1).trim().replace(/;\s*$/, '');
  }
  var obj = JSON.parse(json);
  var c = obj && obj.config && obj.config.stores ? obj.config : obj;
  if (!c || !Array.isArray(c.stores)) throw new Error('there’s no store list in it');
  return normalize(c);
}

function copyText(text, okMsg) {
  var done = function () { toast(okMsg); };
  var fallback = function () {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) done();
    else {
      var box = $('#scriptOut');
      if (box && text === box.value) { box.focus(); box.select(); toast('Press Ctrl+C (Cmd+C on a Mac) to copy the selected script.'); }
      else toast('Copying isn’t allowed here. Select the text and copy it yourself.');
    }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
}

function download(filename, data) {
  if (!app.downloads) {
    if (window.claude) return;
    // Opened outside claude.ai (for example from GitHub): use a normal browser download.
    var url = URL.createObjectURL(new Blob([data], { type: 'text/plain;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    return;
  }
  app.downloads.save({ filename: filename, data: data }).then(function () {}, function (err) {
    if (err && err.code === 'declined') return;
    toast('The download didn’t start (' + ((err && err.code) || 'unavailable') + ').');
  });
}
function applyCapabilityVisibility() {
  $$('[data-needs="downloads"]').forEach(function (el) { el.hidden = !app.downloads && !!window.claude; });
}

/* ---------- Saving (shared for everyone with this page) ---------- */
function save(force, meta) {
  if (!app.db || app.readOnly) return;
  meta = meta || { name: '', note: '', changes: [] };
  var btn = $('#saveBtn');
  app.saving = true;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  var cur = app.db.doc('settings/current');
  cur.get().then(function (snap) {
    var data = snap.exists ? snap.data() : null;
    var curRev = data ? Number(data.rev) || 0 : 0;
    if (curRev > app.savedRev && !force) {
      app.pendingRemote = data;
      app.pendingSave = meta;
      setBanner('<p>Version ' + curRev + ' was saved by someone else while you were editing. Saving now replaces it with your settings.</p>' +
        '<button class="btn small" data-act="save-anyway">Save mine anyway</button><button class="btn small" data-act="load-remote">Load theirs instead</button>');
      throw { code: 'conflict' };
    }
    var rev = curRev + 1;
    var now = new Date().toISOString();
    var config = clone(app.cfg);
    var changes = meta.changes.length > 40 ? meta.changes.slice(0, 40).concat(['…and ' + (meta.changes.length - 40) + ' more']) : meta.changes;
    config.rev = rev; config.savedAt = now;
    config.savedByName = meta.name; config.changeNote = meta.note;
    config.history = (app.cfg.history || []).concat([{ rev: rev, savedAt: now, name: meta.name, note: meta.note, changes: changes }]).slice(-15);
    var body = { config: config, rev: rev, savedAt: now, savedBy: app.userId || '', savedByName: meta.name, note: meta.note, changes: changes };
    return app.db.collection('versions').doc('v' + rev).set(body).then(function () {
      return cur.set(body);
    }).then(function () {
      if (rev > 40) app.db.collection('versions').doc('v' + (rev - 40)).delete().catch(function () {});
      app.cfg = config;
      app.savedRev = rev; app.savedAt = now; app.savedBy = app.userId || '';
      app.savedCfgJson = JSON.stringify(app.cfg);
      app.savedTypedName = meta.name;
      app.dirty = false;
      app.pendingSave = null;
      clearDraft();
      setBanner('');
      resolveNames();
      toast('Saved as version ' + rev + '.');
    });
  }).catch(function (err) {
    if (err && err.code === 'conflict') return;
    if (err && err.code === 'invalid_argument') { app.readOnly = true; toast('You can view these settings but not save them. Ask the page owner for edit access.'); }
    else if (err && err.code === 'quota_exceeded') toast('Saving failed: storage is full. ' + (err.message || ''));
    else toast('Saving failed (' + ((err && err.code) || 'error') + '). Try again in a moment.');
  }).then(function () {
    btn.textContent = 'Save settings';
    app.saving = false;
    updateStatus();
    scheduleInstall();
  });
}

/* ---------- What changed between two versions ---------- */
var FIELD_LABELS = {
  deliveryMode: 'Send invoices to', faxAddressTemplate: 'Fax provider format', faxBodyText: 'Fax cover text',
  defaultTeamsAddress: 'Default Teams channel', reviewRecipients: 'Review notices go to', auditCopyAddress: 'Copy of everything goes to',
  senderName: 'Sender name', keywords: 'Keywords', matchPoPatterns: 'Recognize purchase order numbers',
  readPdfText: 'Read inside PDFs', pdfWording: 'Look for wording inside PDFs', exclusionPhrases: 'Exclusion phrases',
  exclusionCheckBody: 'Check message text for exclusions', checkSpam: 'Check the Spam folder',
  reviewUnknownAttachments: 'Hold attachments from unknown senders', attachmentTypes: 'Attachment types',
  minImageKB: 'Skip images smaller than (KB)', bodyToPdf: 'Turn message text into a PDF', alwaysIncludeBody: 'Always add a message text page',
  multiStoreMatch: 'If an email mentions several stores', fallbackStoreId: 'If the store can’t be worked out',
  labelRoot: 'Label group name', systemTag: 'Tag on sent emails', runEveryMinutes: 'Check every (minutes)',
  firstRunLookbackHours: 'First install look-back (hours)', dryRunHours: 'Dry run look-back (hours)',
  logToSheet: 'Keep a log sheet', historyDocUrl: 'Change history document'
};
var RULE_LABELS = { subject: 'subject', attachment: 'attachment file name', body: 'message text only', pdf: 'inside a PDF only' };
function describeChanges(a, b) {
  if (!a) return ['First saved version'];
  var out = [];
  var short = function (s) { s = String(s); return s.length > 90 ? s.slice(0, 87) + '…' : s; };
  var nameOf = function (cfg, id) { var s = IFCore.storeById_(cfg, id); return s ? s.name : id; };
  var fmt = function (k, v, cfg) {
    if (k === 'fallbackStoreId') return v ? nameOf(cfg, v) : 'hold for review';
    if (k === 'deliveryMode') return { both: 'fax and Teams', fax: 'fax only', teams: 'Teams only' }[v] || v;
    if (k === 'multiStoreMatch') return v === 'all' ? 'send to each' : 'hold for review';
    if (Array.isArray(v)) return v.length ? short(v.join(', ')) : 'none';
    if (typeof v === 'boolean') return v ? 'on' : 'off';
    return v === '' || v == null ? 'blank' : short(v);
  };
  Object.keys(FIELD_LABELS).forEach(function (k) {
    if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) out.push(FIELD_LABELS[k] + ': ' + fmt(k, a[k], a) + ' → ' + fmt(k, b[k], b));
  });
  Object.keys(RULE_LABELS).forEach(function (k) {
    var x = (a.rules || {})[k], y = (b.rules || {})[k];
    if (x !== y) out.push('When wording is found in the ' + RULE_LABELS[k] + ': ' + (x === 'send' ? 'forward' : 'hold') + ' → ' + (y === 'send' ? 'forward' : 'hold'));
  });
  var storeFields = { name: 'name', gmail: 'Gmail', faxNumber: 'fax number', teamsAddress: 'Teams channel', keywords: 'keywords' };
  var oldStores = {};
  (a.stores || []).forEach(function (s) { oldStores[s.id] = s; });
  (b.stores || []).forEach(function (s) {
    var o = oldStores[s.id];
    if (!o) { out.push('Added store ' + (s.name || s.id)); return; }
    delete oldStores[s.id];
    Object.keys(storeFields).forEach(function (f) {
      if (JSON.stringify(o[f]) !== JSON.stringify(s[f])) out.push('Store ' + (s.name || o.name) + ', ' + storeFields[f] + ': ' + fmt(f, o[f]) + ' → ' + fmt(f, s[f]));
    });
  });
  Object.keys(oldStores).forEach(function (id) { out.push('Removed store ' + (oldStores[id].name || id)); });
  var key = function (e) { return String(e.sender || '').trim().toLowerCase(); };
  var act = function (v) { return { forward: 'always forward', review: 'always hold for review', exclude: 'never forward' }[v] || v; };
  var bookDesc = function (e, cfg) { return e.sender + (e.vendor ? ' (' + e.vendor + ')' : '') + ', ' + act(e.action) + ', store: ' + (e.store && e.store !== 'auto' ? nameOf(cfg, e.store) : 'automatic'); };
  var oldBook = {};
  (a.addressBook || []).forEach(function (e) { if (key(e)) oldBook[key(e)] = e; });
  (b.addressBook || []).forEach(function (e) {
    var k = key(e);
    if (!k) return;
    var o = oldBook[k];
    if (!o) { out.push('Address book: added ' + bookDesc(e, b)); return; }
    delete oldBook[k];
    if (o.action !== e.action || o.store !== e.store || o.vendor !== e.vendor) out.push('Address book: ' + bookDesc(o, a) + ' → ' + bookDesc(e, b));
  });
  Object.keys(oldBook).forEach(function (k) { out.push('Address book: removed ' + bookDesc(oldBook[k], a)); });
  return out.length ? out : ['No settings changed'];
}

function historyText(sep) {
  var rows = [];
  app.versions.forEach(function (v) {
    rows.push({ t: v.savedAt, cells: ['Settings saved', v.rev, fmtDate(v.savedAt), v.name || v.byName || '', '', v.note || '', (v.changes || []).join('; ')] });
  });
  (app.installLog || []).forEach(function (x) {
    rows.push({ t: x.at, cells: ['Marked installed', x.rev, fmtDate(x.at), x.name || '', x.storeName || '', x.note || '', ''] });
  });
  rows.sort(function (p, q) { return String(q.t).localeCompare(String(p.t)); });
  var clean = function (v) {
    v = String(v == null ? '' : v);
    if (sep === '\t') return v.replace(/[\t\r\n]+/g, ' ');
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  };
  var head = ['Event', 'Version', 'Time', 'Name', 'Store', 'Note', 'What changed'];
  return [head].concat(rows.map(function (r) { return r.cells; })).map(function (r) { return r.map(clean).join(sep); }).join('\n');
}

function applyRemote(data) {
  app.pendingRemote = null;
  loadConfig(data.config, { rev: data.rev, savedAt: data.savedAt, savedBy: data.savedBy });
  clearDraft();
}

function markInstalled(storeId, name, note) {
  if (!app.db || !app.savedRev) return;
  var s = IFCore.storeById_(app.cfg, storeId);
  var rec = { rev: app.savedRev, at: new Date().toISOString(), by: app.userId || '', name: name, note: note, storeId: storeId, storeName: s ? s.name : storeId };
  app.db.collection('installs').doc(storeId).set(rec)
    .then(function () { return app.db.collection('installLog').add(rec); })
    .then(function () { toast('Marked as installed with version ' + app.savedRev + '.'); })
    .catch(function (err) { toast('Couldn’t save that (' + ((err && err.code) || 'error') + ').'); });
}

function resolveNames() {
  if (!app.user) { updateStatus(); return; }
  var ids = [];
  if (app.savedBy) ids.push(app.savedBy);
  Object.keys(app.installs).forEach(function (k) { if (app.installs[k].by) ids.push(app.installs[k].by); });
  app.versions.forEach(function (v) { if (v.savedBy) ids.push(v.savedBy); });
  if (!ids.length) { updateStatus(); return; }
  app.user.profiles(ids).then(function (ps) {
    var nm = function (id) { return id && ps[id] ? ps[id].name || '' : ''; };
    app.savedByName = nm(app.savedBy);
    Object.keys(app.installs).forEach(function (k) { app.installs[k].byName = nm(app.installs[k].by); });
    app.versions.forEach(function (v) { v.byName = nm(v.savedBy); });
    updateStatus();
    if (app.view === 'install' && $('#installTable')) { $('#installTable').innerHTML = installTableHtml(); $('#versions').innerHTML = versionsHtml(); }
  });
}

function restoreDraftIfAny() {
  var d = readDraft();
  if (!d || !d.cfg) return;
  if ((d.baseRev || 0) !== app.savedRev) { clearDraft(); return; }
  var cfg = normalize(d.cfg);
  var used = cfg.stores.filter(function (s) {
    return !/^Store \d+$/.test(s.name || '') || s.gmail || s.faxNumber || s.teamsAddress || s.keywords.length;
  });
  if (used.length < cfg.stores.length && !app.savedRev) {
    cfg.stores = used.length ? used : cfg.stores.slice(0, 1);
    var ids = {}; cfg.stores.forEach(function (s) { ids[s.id] = 1; });
    cfg.addressBook.forEach(function (e) { if (!ids[e.store]) e.store = 'auto'; });
    if (cfg.fallbackStoreId && !ids[cfg.fallbackStoreId]) cfg.fallbackStoreId = '';
  }
  if (JSON.stringify(cfg) === app.savedCfgJson) { clearDraft(); return; }
  app.cfg = cfg;
  app.dirty = true;
  renderAll();
  setBanner('<p data-info>Your unsaved changes from ' + esc(fmtDate(d.at)) + ' were restored.</p><button class="btn small" data-act="discard-draft">Discard them</button>');
}

function startDb() {
  var first = true;
  app.db.doc('settings/current').onSnapshot(function (snap) {
    var data = snap.exists ? snap.data() : null;
    if (first) {
      first = false;
      app.loaded = true;
      if (data && data.config && !app.dirty) loadConfig(data.config, { rev: data.rev, savedAt: data.savedAt, savedBy: data.savedBy });
      else if (data && data.config && app.dirty) {
        app.pendingRemote = data;
        setBanner('<p>Saved settings (version ' + esc(data.rev) + ') finished loading after you started editing.</p><button class="btn small" data-act="load-remote">Load saved settings</button><button class="btn small" data-act="dismiss-banner">Keep my edits</button>');
      }
      restoreDraftIfAny();
      updateStatus();
      return;
    }
    if (!data || !data.config) return;
    if ((Number(data.rev) || 0) <= app.savedRev) return;
    if (!app.dirty) {
      applyRemote(data);
      toast('Version ' + data.rev + ' was just saved by someone else and is now loaded.');
    } else {
      app.pendingRemote = data;
      setBanner('<p>Version ' + esc(data.rev) + ' was just saved by someone else. Loading it replaces your unsaved changes.</p><button class="btn small" data-act="load-remote">Load version ' + esc(data.rev) + '</button><button class="btn small" data-act="dismiss-banner">Keep editing</button>');
    }
  }, function () {
    app.loaded = true; app.dbMissing = true; updateStatus();
  });

  app.db.collection('versions').orderBy('rev', 'desc').limit(40).onSnapshot(function (snap) {
    app.versions = snap.docs.map(function (d) { var x = d.data(); return { rev: Number(x.rev) || 0, savedAt: x.savedAt, savedBy: x.savedBy, name: x.savedByName || '', note: x.note || '', changes: x.changes || [], config: x.config }; });
    resolveNames();
    if (app.view === 'install' && $('#versions')) { $('#versions').innerHTML = versionsHtml(); applyCapabilityVisibility(); }
  }, function () {});

  app.db.collection('installLog').orderBy('at', 'desc').limit(200).onSnapshot(function (snap) {
    app.installLog = snap.docs.map(function (d) { return d.data(); });
  }, function () {});

  app.db.collection('installs').onSnapshot(function (snap) {
    var m = {};
    snap.docs.forEach(function (d) { m[d.id] = d.data(); });
    app.installs = m;
    resolveNames();
    if (app.view === 'install' && $('#installTable')) $('#installTable').innerHTML = installTableHtml();
  }, function () {});
}

var noDbTimer = setTimeout(noSaving, 11000);

if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(function (d) { app.downloads = d; applyCapabilityVisibility(); }, function () {});

    resolveNames();
  }, function () {});
  window.claude.use('db').then(function (db) {
    clearTimeout(noDbTimer);
    if (!db) { noSaving(); return; }
    app.db = db;
    app.dbMissing = false;
    setSaveHelp('');
    startDb();
  }, function () { clearTimeout(noDbTimer); noSaving(); });
} else {
  clearTimeout(noDbTimer);
  noSaving();
}
})();
</script>
</body>
